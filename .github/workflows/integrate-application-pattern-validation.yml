name: Application Pattern Validation統合

on:
  push:
    branches:
      - work/application-pattern-validation-integration

permissions:
  contents: write

jobs:
  integrate-validation:
    if: ${{ !contains(github.event.head_commit.message, '[pattern-validation-integrated]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Repositoryを取得
        uses: actions/checkout@v7
        with:
          ref: work/application-pattern-validation-integration

      - name: 共通Validateへ1か所だけ接続
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('internal/validation/validation.go')
          source = path.read_text()
          old = 'func Validate(w ir.World) []Diagnostic {\n\tvar out []Diagnostic\n'
          new = 'func Validate(w ir.World) []Diagnostic {\n\tout := validateApplicationPatterns(w)\n'
          if source.count(old) != 1:
              raise SystemExit(f'置換対象の件数が1ではありません: {source.count(old)}')
          if new in source:
              raise SystemExit('Application Pattern Validationはすでに共通Validateへ接続されています。')
          path.write_text(source.replace(old, new, 1))
          PY

          gofmt -w internal/validation/validation.go

          read -r added deleted path <<<"$(git diff --numstat -- internal/validation/validation.go)"
          if [[ "${added}" != "1" || "${deleted}" != "1" || "${path}" != "internal/validation/validation.go" ]]; then
            echo "validation.goに想定外の差分があります: added=${added} deleted=${deleted} path=${path}"
            git diff -- internal/validation/validation.go
            exit 1
          fi

      - name: 差分をbranchへ反映
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/validation/validation.go
          git commit -m "Application Pattern Validationを共通Validateへ接続する [pattern-validation-integrated]"
          git push origin HEAD:work/application-pattern-validation-integration
