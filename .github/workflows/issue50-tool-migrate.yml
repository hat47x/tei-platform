name: Migrate Issue 50 reference PostgreSQL tool

on:
  push:
    branches: [work/issue-50-core-model]
    paths:
      - .github/workflows/issue50-tool-migrate.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Reference PostgreSQL helperを移行
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('tools/reference-postgres-integration/main.go')
          text = p.read_text()
          pattern = r'''func hasIndex\(snapshot physical\.SchemaSnapshot, table, name string, unique bool, columns \.\.\.string\) bool \{.*?\n\}\n\nfunc hasDropColumn'''
          replacement = '''func hasIndex(snapshot physical.SchemaSnapshot, table, name string, unique bool, columns ...string) bool {
          \tt, ok := snapshot.Table(table)
          \tif !ok {
          \t\treturn false
          \t}
          \tfor _, index := range t.Indexes {
          \t\tindexColumns, ok := simpleIndexColumns(index)
          \t\tif ok && index.Name == name && index.Unique == unique && sameStrings(indexColumns, columns) {
          \t\t\treturn true
          \t\t}
          \t}
          \treturn false
          }

          func simpleIndexColumns(index physical.Index) ([]string, bool) {
          \tcolumns := make([]string, 0, len(index.Keys))
          \tfor _, key := range index.Keys {
          \t\tif key.Expression != nil || key.Column == "" {
          \t\t\treturn nil, false
          \t\t}
          \t\tcolumns = append(columns, key.Column)
          \t}
          \treturn columns, true
          }

          func hasDropColumn'''
          text, n = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'hasIndex replacement count={n}')
          p.write_text(text)
          PY
          gofmt -w tools/reference-postgres-integration/main.go
      - name: 全体静的検査
        run: go vet ./...
      - name: 全テスト
        run: go test ./...
      - name: 移行をcommit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/reference-postgres-integration/main.go
          git commit -m "Issue #50 Reference PostgreSQL toolを新Index modelへ移行する"
          git push
