name: Gate A Ready文書最終整文

on:
  push:
    branches:
      - docs/gate-a-ready

permissions:
  contents: write

jobs:
  polish:
    if: ${{ !contains(github.event.head_commit.message, '[gate-a-polished]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Repositoryを取得
        uses: actions/checkout@v7
        with:
          ref: docs/gate-a-ready

      - name: 文書構造を整える
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          plan = Path("plan/V1_REFERENCE_APPLICATION_PLAN.md")
          text = plan.read_text()
          old = "DriverではGate Aで成立したResolver、Evaluator、Capability Invocation境界を組み合わせ、UIなしで`order_entry`の主要シナリオを実行します。\n## Stage 2 — Application Driver"
          new = "DriverではGate Aで成立したResolver、Evaluator、Capability Invocation境界を組み合わせ、UIなしで`order_entry`の主要シナリオを実行します。\n\n## Stage 2 — Application Driver"
          if text.count(old) != 1:
              raise SystemExit("V1 planのStage 2接続位置を一意に確認できません")
          plan.write_text(text.replace(old, new))

          status = Path("docs/status.md")
          text = status.read_text()
          marker = "## Database / Persistence\n"
          if text.count(marker) != 1:
              raise SystemExit("docs/status.mdのDatabase見出しを一意に確認できません")
          section = '''## Authentication / Authorization / Capability結果境界

Gate Aへ必要なApplication利用者のSecurity境界も、Reference / Conformanceとして成立しています。

- `security.authenticate`の`authenticated` / `denied`を正常なBusiness Resultとして扱う
- 認証・認可の実行障害をExecution Errorとして分離する
- 既存user recordのdisabled、validity、lock、organization、role、system-specific ruleを保持したままadapterへ接続する
- `order_entry/security.authenticate`の同じBinding identityで、既存record経路と既存function経路を交換できる
- `security.authorize`でApplication Pattern identityをaction / resourceとして利用する
- legacy roleやschemaをApplication / Driverへ公開して認可ruleを再実装しない
- password、token、credential hash等のsecret materialをCanonical Worldや通常Evidenceへ保存しない

Application利用者のAuthentication / Authorizationと、Plugin / Runtimeに与えるPermission Grant / Resource Leaseは別の責務として維持します。

'''
          status.write_text(text.replace(marker, section + marker))
          PY

      - name: 意図した文書だけを確認
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = $'docs/status.md\nplan/V1_REFERENCE_APPLICATION_PLAN.md'

      - name: 変更をbranchへ反映
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/status.md plan/V1_REFERENCE_APPLICATION_PLAN.md
          git commit -m "Gate A Ready文書を自然な構成へ整える [gate-a-polished]"
          git push origin HEAD:docs/gate-a-ready
