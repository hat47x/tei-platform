name: TEI 実PostgreSQL未実行スイートの検証

# #3681: 実PostgreSQLを前提にしながら、どのworkflowからも環境変数を設定されて
# いなかった4系統を、使い捨てのservice containerで実行する。
# skipはgo testでは成功と同じ終了コードになるため、DSN未設定のSKIPが残って
# いないことと、対象の試験がPASSしたことを別々に確かめる。
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'internal/command/lifecyclepg/**'
      - 'internal/driver/**'
      - 'tools/reference-expected-state-update/**'
      - 'reference/web-api-contract/**'
      - 'reference/org-staged-axis/**'
      - 'internal/operations/org_axis_asof_physical_test.go'
      - 'internal/operations/org_axis_asof_postgres_integration_test.go'
      - '.github/workflows/tei-postgres-unrun-suites-ci.yml'
      - 'go.mod'
      - 'go.sum'
  push:
    branches: [main]
    paths:
      - 'internal/command/lifecyclepg/**'
      - 'internal/driver/**'
      - 'tools/reference-expected-state-update/**'
      - 'reference/web-api-contract/**'
      - 'reference/org-staged-axis/**'
      - 'internal/operations/org_axis_asof_physical_test.go'
      - 'internal/operations/org_axis_asof_postgres_integration_test.go'
      - '.github/workflows/tei-postgres-unrun-suites-ci.yml'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tei-postgres-unrun-suites-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  postgres-suites:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tei
          POSTGRES_PASSWORD: tei_integration_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tei -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GOENV: off
      GOWORK: off
      GOFLAGS: ''
      GOTOOLCHAIN: local
      # Each suite refuses DDL unless the database name it was told to expect is
      # the one it connected to, so the names here are part of the contract.
      TEI_COMMAND_PG_DSN: postgres://tei:tei_integration_only@localhost:5432/tei_command_e2e?sslmode=disable
      TEI_STANDARD_CRUD_PG_DSN: postgres://tei:tei_integration_only@localhost:5432/tei_standard_crud_e2e?sslmode=disable
      TEI_STANDARD_CRUD_PG_CONFIRM_ISOLATED: tei_standard_crud_e2e
      TEI_EXPECTED_STATE_PG_DSN: postgres://tei:tei_integration_only@localhost:5432/tei_expected_state_e2e?sslmode=disable
      TEI_EXPECTED_STATE_PG_CONFIRM_ISOLATED: tei_expected_state_e2e
      TEI_WEB_SCOPED_PG_DSN: postgres://tei:tei_integration_only@localhost:5432/tei_web_scoped_e2e?sslmode=disable
      TEI_WEB_SCOPED_PG_CONFIRM_ISOLATED: tei_web_scoped_e2e
      TEI_ORG_AXIS_PG_DSN: postgres://tei:tei_integration_only@localhost:5432/tei_org_axis_e2e?sslmode=disable
      TEI_ORG_AXIS_PG_CONFIRM_ISOLATED: tei_org_axis_e2e
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: 検証対象を取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Gitの版と作業領域を検証
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            [[ "$GITHUB_REF" =~ ^refs/pull/[0-9]+/merge$ ]]
            read -r merge base head extra < <(git rev-list --parents -n 1 HEAD)
            test -z "${extra:-}"
            test "$merge" = "$GITHUB_SHA"
            test "$head" = "$PR_HEAD_SHA"
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored=matching)"

      - name: Go実行環境を準備
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false

      - name: Native organization as-of Go source formatting
        shell: bash
        run: |
          set -euo pipefail
          gofmt -d internal/operations/org_axis_asof_physical_test.go \
            internal/operations/org_axis_asof_postgres_integration_test.go | tee "$RUNNER_TEMP/org-asof-gofmt.diff"
          test ! -s "$RUNNER_TEMP/org-asof-gofmt.diff"

      # The suites create their own tables and drop their own schemas; separate
      # databases keep them from seeing each other's relations.
      - name: 使い捨てデータベースを作成
        shell: bash
        run: |
          set -euo pipefail
          for name in tei_command_e2e tei_standard_crud_e2e tei_expected_state_e2e tei_web_scoped_e2e tei_org_axis_e2e; do
            docker exec "${{ job.services.postgres.id }}" \
              psql -v ON_ERROR_STOP=1 -U tei -d postgres -c "CREATE DATABASE ${name}"
          done

      - name: 実PostgreSQLの試験を実行
        shell: bash
        run: |
          set -euo pipefail
          # A DSN that is empty would make every test below skip, and a skipped
          # test exits 0, so the empty case is rejected before the run.
          for key in TEI_COMMAND_PG_DSN TEI_STANDARD_CRUD_PG_DSN TEI_EXPECTED_STATE_PG_DSN TEI_WEB_SCOPED_PG_DSN TEI_ORG_AXIS_PG_DSN; do
            test -n "${!key:-}" || { echo "${key} is empty; the suites would skip" >&2; exit 1; }
          done
          log="$RUNNER_TEMP/go-test.log"
          : > "$log"
          # Only the DSN-gated tests run: naming them keeps the job short and
          # makes "no SKIP" mean something about these tests rather than about
          # every unrelated skip in the package.
          go test -count=1 -v -timeout 25m -run 'TestStorePersistsStagesAcrossReconnect|TestRowLockBlocksASecondWriter|TestTwoProcessesCannotBothDispatch|TestTwoProcessesCannotBothTakeOver' \
            ./internal/command/lifecyclepg | tee -a "$log"
          go test -count=1 -v -timeout 10m -run 'TestStandardCRUDUpdateAgainstIsolatedPostgres' \
            ./internal/driver | tee -a "$log"
          go test -count=1 -v -timeout 10m -run '^TestPG' \
            ./tools/reference-expected-state-update | tee -a "$log"
          go test -count=1 -v -timeout 10m -run 'TestScopedPostgres|TestScopedTenantPostgres' \
            ./reference/web-api-contract | tee -a "$log"
          # Native .tei as-of Query: actual physical valid/known/quantity predicates.
          go test -count=1 -v -timeout 10m -run '^TestOrgAxisAsOfActualPostgresOptIn

      - name: SKIPとFAILの検証
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/go-test.log"
          # The DSN-gated tests are the reason this workflow exists: a SKIP that
          # names the DSN means the environment did not reach the test.
          if grep -Eq -- '^[[:space:]]*--- SKIP: .*(PostgreSQL|PG_DSN|tenant PostgreSQL)' "$log"; then
            echo "a DSN-gated test skipped although the DSNs are set:" >&2
            grep -E -- '^[[:space:]]*--- SKIP:' "$log" >&2
            exit 1
          fi
          if grep -Eq -- '^[[:space:]]*--- FAIL:' "$log"; then
            echo "unexpected FAIL in the real-PostgreSQL run:" >&2
            grep -E -- '^[[:space:]]*--- FAIL:' "$log" >&2
            exit 1
          fi
          # Name the tests so a rename or a removed call cannot turn this job
          # green by running nothing.
          required=(
            'TestStorePersistsStagesAcrossReconnect'
            'TestRowLockBlocksASecondWriter'
            'TestTwoProcessesCannotBothDispatch'
            'TestTwoProcessesCannotBothTakeOver'
            'TestStandardCRUDUpdateAgainstIsolatedPostgres'
            'TestPGConflictIsABusinessResultAndKeepsTheFirstUpdate'
            'TestPGTwoConnectionsApplyExactlyOneUpdate'
            'TestPGCommitAcknowledgementLossOverSocket'
            'TestPGRuntimeStageUnknownTakeoverEndToEnd'
            'TestScopedPostgresAgainstIsolatedDatabase'
            'TestScopedTenantPostgresAgainstIsolatedDatabase'
            'TestScopedPostgresDefaultOrderRevealsUnpublishedOrderedAt'
            'TestScopedTenantPostgresDefaultOrderRevealsUnpublishedOrderedAt'
            'TestOrgAxisAsOfActualPostgresOptIn'
          )
          for name in "${required[@]}"; do
            grep -Eq -- "^[[:space:]]*--- PASS: ${name} \(" "$log" || { echo "required test did not PASS: ${name}" >&2; exit 1; }
          done

      - name: 検証後の変更を検出
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored=matching)"
 \
            ./internal/operations | tee -a "$log"

      - name: SKIPとFAILの検証
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/go-test.log"
          # The DSN-gated tests are the reason this workflow exists: a SKIP that
          # names the DSN means the environment did not reach the test.
          if grep -Eq -- '^[[:space:]]*--- SKIP: .*(PostgreSQL|PG_DSN|tenant PostgreSQL)' "$log"; then
            echo "a DSN-gated test skipped although the DSNs are set:" >&2
            grep -E -- '^[[:space:]]*--- SKIP:' "$log" >&2
            exit 1
          fi
          if grep -Eq -- '^[[:space:]]*--- FAIL:' "$log"; then
            echo "unexpected FAIL in the real-PostgreSQL run:" >&2
            grep -E -- '^[[:space:]]*--- FAIL:' "$log" >&2
            exit 1
          fi
          # Name the tests so a rename or a removed call cannot turn this job
          # green by running nothing.
          required=(
            'TestStorePersistsStagesAcrossReconnect'
            'TestRowLockBlocksASecondWriter'
            'TestTwoProcessesCannotBothDispatch'
            'TestTwoProcessesCannotBothTakeOver'
            'TestStandardCRUDUpdateAgainstIsolatedPostgres'
            'TestPGConflictIsABusinessResultAndKeepsTheFirstUpdate'
            'TestPGTwoConnectionsApplyExactlyOneUpdate'
            'TestPGCommitAcknowledgementLossOverSocket'
            'TestPGRuntimeStageUnknownTakeoverEndToEnd'
            'TestScopedPostgresAgainstIsolatedDatabase'
            'TestScopedTenantPostgresAgainstIsolatedDatabase'
            'TestScopedPostgresDefaultOrderRevealsUnpublishedOrderedAt'
            'TestScopedTenantPostgresDefaultOrderRevealsUnpublishedOrderedAt'
            'TestOrgAxisAsOfActualPostgresOptIn'
          )
          for name in "${required[@]}"; do
            grep -Eq -- "^[[:space:]]*--- PASS: ${name} \(" "$log" || { echo "required test did not PASS: ${name}" >&2; exit 1; }
          done

      - name: 検証後の変更を検出
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored=matching)"
