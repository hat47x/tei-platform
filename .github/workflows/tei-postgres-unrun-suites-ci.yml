name: TEI 実PostgreSQL未実行スイートの検証

# #3681: 実PostgreSQLを前提にしながら、どのworkflowからも環境変数を設定されて
# いなかった4系統を、使い捨てのservice containerで実行する。
# skipはgo testでは成功と同じ終了コードになるため、DSN未設定のSKIPが残って
# いないことと、対象の試験がPASSしたことを別々に確かめる。
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'internal/command/lifecyclepg/**'
      - 'internal/driver/**'
      - 'internal/numbering/**'
      - 'internal/numberingpostgres/**'
      - 'cmd/tei/cli_view.go'
      - 'cmd/tei/cli_view_environment.go'
      - 'cmd/tei/cli_view_environment_test.go'
      - 'cmd/tei/cli_view_environment_names_test.go'
      - 'cmd/tei/destination_order_runtime_pg_test.go'
      - 'tools/reference-first-web-target/read_scenario_postgres.go'
      - 'tools/reference-first-web-target/read_scenario_postgres_test.go'
      - 'tools/reference-first-web-target/read_scenario_page_postgres_test.go'
      - 'tools/reference-first-web-target/first_change_walkthrough_test.go'
      - 'tools/reference-first-web-target/first_change_guide_e2e_test.go'
      - 'tools/reference-first-web-target/first_change_sql_setup_test.go'
      - 'docs/first-change.md'
      - 'cmd/tei/desired_schema_applied_pg_test.go'
      - 'testdata/destination-order-change/**'
      - 'tools/reference-expected-state-update/**'
      - 'reference/web-api-contract/**'
      - 'reference/org-staged-axis/**'
      - 'internal/operations/org_axis_asof_physical_test.go'
      - 'internal/operations/org_axis_asof_postgres_integration_test.go'
      - 'internal/operations/org_axis_bitemporal_rectangle_candidate_test.go'
      - 'internal/operations/org_axis_bitemporal_exclusion_candidate_test.go'
      - 'internal/operations/org_axis_bitemporal_two_writer_candidate_test.go'
      - 'internal/operations/org_c1_abstract_route_contract_test.go'
      - '.github/workflows/tei-postgres-unrun-suites-ci.yml'
      - 'go.mod'
      - 'go.sum'
  push:
    branches: [main]
    paths:
      - 'internal/command/lifecyclepg/**'
      - 'internal/driver/**'
      - 'internal/numbering/**'
      - 'internal/numberingpostgres/**'
      - 'cmd/tei/cli_view.go'
      - 'cmd/tei/cli_view_environment.go'
      - 'cmd/tei/cli_view_environment_test.go'
      - 'cmd/tei/cli_view_environment_names_test.go'
      - 'cmd/tei/destination_order_runtime_pg_test.go'
      - 'tools/reference-first-web-target/read_scenario_postgres.go'
      - 'tools/reference-first-web-target/read_scenario_postgres_test.go'
      - 'tools/reference-first-web-target/read_scenario_page_postgres_test.go'
      - 'tools/reference-first-web-target/first_change_walkthrough_test.go'
      - 'tools/reference-first-web-target/first_change_guide_e2e_test.go'
      - 'tools/reference-first-web-target/first_change_sql_setup_test.go'
      - 'docs/first-change.md'
      - 'cmd/tei/desired_schema_applied_pg_test.go'
      - 'testdata/destination-order-change/**'
      - 'tools/reference-expected-state-update/**'
      - 'reference/web-api-contract/**'
      - 'reference/org-staged-axis/**'
      - 'internal/operations/org_axis_asof_physical_test.go'
      - 'internal/operations/org_axis_asof_postgres_integration_test.go'
      - 'internal/operations/org_axis_bitemporal_rectangle_candidate_test.go'
      - 'internal/operations/org_axis_bitemporal_exclusion_candidate_test.go'
      - 'internal/operations/org_axis_bitemporal_two_writer_candidate_test.go'
      - 'internal/operations/org_c1_abstract_route_contract_test.go'
      - '.github/workflows/tei-postgres-unrun-suites-ci.yml'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tei-postgres-unrun-suites-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  postgres-suites:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tei
          POSTGRES_PASSWORD: tei_integration_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tei -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GOENV: off
      GOWORK: off
      GOFLAGS: ''
      GOTOOLCHAIN: local
      # Each suite refuses DDL unless the database name it was told to expect is
      # the one it connected to, so the names here are part of the contract.
      TEI_COMMAND_PG_DSN: postgres://tei:tei_integration_only@localhost:5432/tei_command_e2e?sslmode=disable
      TEI_STANDARD_CRUD_PG_DSN: postgres://tei:tei_integration_only@localhost:5432/tei_standard_crud_e2e?sslmode=disable
      TEI_STANDARD_CRUD_PG_CONFIRM_ISOLATED: tei_standard_crud_e2e
      TEI_EXPECTED_STATE_PG_DSN: postgres://tei:tei_integration_only@localhost:5432/tei_expected_state_e2e?sslmode=disable
      TEI_EXPECTED_STATE_PG_CONFIRM_ISOLATED: tei_expected_state_e2e
      TEI_WEB_SCOPED_PG_DSN: postgres://tei:tei_integration_only@localhost:5432/tei_web_scoped_e2e?sslmode=disable
      TEI_WEB_SCOPED_PG_CONFIRM_ISOLATED: tei_web_scoped_e2e
      TEI_ORG_AXIS_PG_DSN: postgres://tei:tei_integration_only@localhost:5432/tei_org_axis_e2e?sslmode=disable
      TEI_ORG_AXIS_PG_CONFIRM_ISOLATED: tei_org_axis_e2e
      TEI_VIEW_PG_DSN: postgres://tei:tei_integration_only@localhost:5432/tei_destination_order_e2e?sslmode=disable
      # The web read test seeds and drops the same table, so it reuses the same
      # disposable database; a second one would not add isolation.
      TEI_WEB_READ_PG_DSN: postgres://tei:tei_integration_only@localhost:5432/tei_destination_order_e2e?sslmode=disable
      TEI_WEB_READ_PG_CONFIRM_ISOLATED: tei_destination_order_e2e
      # The numbering store only needs one table, so it shares the fixture
      # database instead of asking for a seventh one.
      TEI_TEST_POSTGRES_DSN: postgres://tei:tei_integration_only@localhost:5432/tei_fixture?sslmode=disable
      TEI_VIEW_PG_CONFIRM_ISOLATED: tei_destination_order_e2e
      TEI_VIEW_BROWSER_BINARY: google-chrome
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: 検証対象を取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Gitの版と作業領域を検証
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            [[ "$GITHUB_REF" =~ ^refs/pull/[0-9]+/merge$ ]]
            read -r merge base head extra < <(git rev-list --parents -n 1 HEAD)
            test -z "${extra:-}"
            test "$merge" = "$GITHUB_SHA"
            test "$head" = "$PR_HEAD_SHA"
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored=matching)"

      - name: Go実行環境を準備
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false

      - name: 到達点のCLI/実PostgreSQL試験のGo整形
        shell: bash
        run: |
          set -euo pipefail
          gofmt -d cmd/tei/cli_view.go cmd/tei/cli_view_environment.go \
            cmd/tei/cli_view_environment_test.go cmd/tei/destination_order_runtime_pg_test.go \
            tools/reference-first-web-target/read_scenario_postgres.go \
            tools/reference-first-web-target/read_scenario_postgres_test.go \
            tools/reference-first-web-target/read_scenario_page_postgres_test.go \
            | tee "$RUNNER_TEMP/destination-order-gofmt.diff"
          test ! -s "$RUNNER_TEMP/destination-order-gofmt.diff"

      - name: Native organization as-of Go source formatting
        shell: bash
        run: |
          set -euo pipefail
          gofmt -d internal/operations/org_axis_asof_physical_test.go \
            internal/operations/org_axis_asof_postgres_integration_test.go \
            internal/operations/org_axis_bitemporal_rectangle_candidate_test.go \
            internal/operations/org_axis_bitemporal_exclusion_candidate_test.go \
            internal/operations/org_axis_bitemporal_two_writer_candidate_test.go \
            internal/operations/org_c1_abstract_route_contract_test.go | tee "$RUNNER_TEMP/org-asof-gofmt.diff"
          test ! -s "$RUNNER_TEMP/org-asof-gofmt.diff"

      # The suites create their own tables and drop their own schemas; separate
      # databases keep them from seeing each other's relations.
      - name: 使い捨てデータベースを作成
        shell: bash
        run: |
          set -euo pipefail
          for name in tei_command_e2e tei_standard_crud_e2e tei_expected_state_e2e tei_web_scoped_e2e tei_org_axis_e2e tei_destination_order_e2e tei_fixture; do
            docker exec "${{ job.services.postgres.id }}" \
              psql -v ON_ERROR_STOP=1 -U tei -d postgres -c "CREATE DATABASE ${name}"
          done

      - name: 実PostgreSQLの試験を実行
        shell: bash
        run: |
          set -euo pipefail
          # A DSN that is empty would make every test below skip, and a skipped
          # test exits 0, so the empty case is rejected before the run.
          for key in TEI_COMMAND_PG_DSN TEI_STANDARD_CRUD_PG_DSN TEI_EXPECTED_STATE_PG_DSN TEI_WEB_SCOPED_PG_DSN TEI_ORG_AXIS_PG_DSN TEI_VIEW_PG_DSN TEI_WEB_READ_PG_DSN TEI_TEST_POSTGRES_DSN; do
            test -n "${!key:-}" || { echo "${key} is empty; the suites would skip" >&2; exit 1; }
          done
          log="$RUNNER_TEMP/go-test.log"
          : > "$log"
          # Named DB probes and the source/IR contract keep the job short and
          # make "no SKIP" mean something about these tests rather than about
          # every unrelated skip in the package.
          go test -count=1 -v -timeout 25m -run 'TestStorePersistsStagesAcrossReconnect|TestRowLockBlocksASecondWriter|TestTwoProcessesCannotBothDispatch|TestTwoProcessesCannotBothTakeOver' \
            ./internal/command/lifecyclepg | tee -a "$log"
          go test -count=1 -v -timeout 10m -run 'TestStandardCRUDUpdateAgainstIsolatedPostgres' \
            ./internal/driver | tee -a "$log"
          go test -count=1 -v -timeout 10m -run '^TestPG' \
            ./tools/reference-expected-state-update | tee -a "$log"
          go test -count=1 -v -timeout 10m -run 'TestScopedPostgres|TestScopedTenantPostgres' \
            ./reference/web-api-contract | tee -a "$log"
          # Native as-of Query, isolated DB probes, and source/IR route contract must execute.
          go test -count=1 -v -timeout 10m -run '^(TestOrgAxisAsOf(ActualPostgres|RevisionKeyCandidate|BitemporalRectangleCandidate|ExclusionConstraintCandidate|TwoWriterExclusionCandidate)OptIn|TestOrgC1AbstractUnitReadPathUsesStableSemanticIDs)$' \
            ./internal/operations | tee -a "$log"
          # ^TestPostgres names every test in the package. Listing the individual ones
          # let LoadRequiresARuleID fall outside the filter, so it never ran while
          # the job stayed green.
          go test -count=1 -v -timeout 10m -run '^TestPostgres' \
            ./internal/numberingpostgres | tee -a "$log"

      - name: Web画面検証用Chromeの存在を確認
        shell: bash
        run: |
          set -euo pipefail
          command -v "$TEI_VIEW_BROWSER_BINARY"
          "$TEI_VIEW_BROWSER_BINARY" --version

      - name: 到達点「受注の一変更」の実PostgreSQLから製品CLIまでを検証
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/go-test.log"
          go test -count=1 -v -timeout 10m -run '^TestDestinationOrderChangeReadViaCLIFromPostgres$|^TestDesiredSchemaSQLCreatesTheTableTheReadNeeds$|^TestDeclaredDecimalPrecisionSurvivesToTheDatabaseAndBack$' ./cmd/tei | tee -a "$log"
          go test -count=1 -v -timeout 10m -run 'TestPostgresReadRunnerAnswersTheRowsPostgreSQLReturned' \
            ./tools/reference-first-web-target | tee -a "$log"
          # Road item 2's remaining half: the page a browser opens must carry
          # the same answers from the same database. Kept separate so its PASS
          # line is required by name below.
          go test -count=1 -v -timeout 10m -run '^TestShippedWebPageShowsRealPostgresRowAnswers$|^TestFirstWebAcceptsARuleChangeEndToEnd$|^TestFirstChangeGuideRunsEndToEnd$' \
            ./tools/reference-first-web-target | tee -a "$log"
          # Refusal paths must be tested even without a database fixture.
          go test -count=1 -v -timeout 10m -run '^TestServeReadFromDB' \
            ./tools/reference-first-web-target | tee -a "$log"
          # The handbook itself is part of the acceptance: a reader who follows it
          # must reach the same shipped entry point. This needs no database, but
          # it belongs with the other step-5 checks so one job covers the page.
          go test -count=1 -v -timeout 10m -run '^TestFirstChangeWalkthroughWebUsesEditedWorkspace$|^TestFirstChangeGuideExecutesLiteralRuleEdit$|^TestFirstChangeGuideSetupFailsClosed$|^TestFirstChangeGuideSQLSetupIsAtomicInPostgres$' \
            ./tools/reference-first-web-target | tee -a "$log"

      - name: SKIPとFAILの検証
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/go-test.log"
          # The DSN-gated tests are the reason this workflow exists: a SKIP that
          # names the DSN means the environment did not reach the test.
          if grep -Eq -- '^[[:space:]]*--- SKIP: .*(PostgreSQL|PG_DSN|tenant PostgreSQL)' "$log"; then
            echo "a DSN-gated test skipped although the DSNs are set:" >&2
            grep -E -- '^[[:space:]]*--- SKIP:' "$log" >&2
            exit 1
          fi
          if grep -Eq -- '^[[:space:]]*--- FAIL:' "$log"; then
            echo "unexpected FAIL in the real-PostgreSQL run:" >&2
            grep -E -- '^[[:space:]]*--- FAIL:' "$log" >&2
            exit 1
          fi
          # Name the tests so a rename or a removed call cannot turn this job
          # green by running nothing.
          required=(
            'TestStorePersistsStagesAcrossReconnect'
            'TestRowLockBlocksASecondWriter'
            'TestTwoProcessesCannotBothDispatch'
            'TestTwoProcessesCannotBothTakeOver'
            'TestStandardCRUDUpdateAgainstIsolatedPostgres'
            'TestPGConflictIsABusinessResultAndKeepsTheFirstUpdate'
            'TestPGTwoConnectionsApplyExactlyOneUpdate'
            'TestPGCommitAcknowledgementLossOverSocket'
            'TestPGRuntimeStageUnknownTakeoverEndToEnd'
            'TestScopedPostgresAgainstIsolatedDatabase'
            'TestScopedTenantPostgresAgainstIsolatedDatabase'
            'TestPostgresStoreStartsAtZero'
            'TestPostgresRefusesAStaleVersion'
            'TestPostgresReservesAcrossReopen'
            'TestPostgresRefusesAForeignFirstWrite'
            'TestPostgresRefusesANegativeCounter'
            'TestPostgresLoadRequiresARuleID'
            'TestScopedPostgresDefaultOrderRevealsUnpublishedOrderedAt'
            'TestScopedTenantPostgresDefaultOrderRevealsUnpublishedOrderedAt'
            'TestOrgAxisAsOfActualPostgresOptIn'
            'TestOrgAxisAsOfRevisionKeyCandidateOptIn'
            'TestOrgAxisAsOfBitemporalRectangleCandidateOptIn'
            'TestOrgAxisAsOfExclusionConstraintCandidateOptIn'
            'TestOrgAxisAsOfTwoWriterExclusionCandidateOptIn'
            'TestOrgC1AbstractUnitReadPathUsesStableSemanticIDs'
            'TestDestinationOrderChangeReadViaCLIFromPostgres'
            'TestDesiredSchemaSQLCreatesTheTableTheReadNeeds'
            'TestDeclaredDecimalPrecisionSurvivesToTheDatabaseAndBack'
            'TestPostgresReadRunnerAnswersTheRowsPostgreSQLReturned'
            'TestShippedWebPageShowsRealPostgresRowAnswers'
            'TestFirstChangeWalkthroughWebUsesEditedWorkspace'
            'TestFirstChangeGuideExecutesLiteralRuleEdit'
            'TestFirstChangeGuideSetupFailsClosed'
            'TestFirstChangeGuideSetupFailsClosed/DDL_failure_prevents_psql'
            'TestFirstChangeGuideSetupFailsClosed/psql_failure_stops_setup'
            'TestFirstChangeGuideSetupFailsClosed/both_steps_succeed'
            'TestFirstChangeGuideSQLSetupIsAtomicInPostgres'
            'TestFirstChangeGuideSQLSetupIsAtomicInPostgres/valid_seed_commits_rows'
            'TestFirstChangeGuideSQLSetupIsAtomicInPostgres/late_seed_error_rolls_back_DDL_and_rows'
            'TestFirstWebAcceptsARuleChangeEndToEnd'
            'TestFirstWebAcceptsARuleChangeEndToEnd/before'
            'TestFirstWebAcceptsARuleChangeEndToEnd/after'
            'TestFirstWebAcceptsARuleChangeEndToEnd/before/chrome-dom'
            'TestFirstWebAcceptsARuleChangeEndToEnd/after/chrome-dom'
            'TestFirstChangeGuideRunsEndToEnd'
            'TestServeReadFromDBRefusesAHostSuppliedDatabase'
            'TestServeReadFromDBRequiresTheEnvironmentDSN'
            'TestServeReadFromDBUnusableDoesNotLeakTheDSN'
          )
          for name in "${required[@]}"; do
            grep -Eq -- "^[[:space:]]*--- PASS: ${name} \(" "$log" || { echo "required test did not PASS: ${name}" >&2; exit 1; }
          done
          # Before/after x three orders. Chrome must actually receive the DOM;
          # simply installing a browser or skipping the optional test is not PASS.
          browser_count="$(grep -Fc 'actual Chrome DOM verified for order' "$log" || true)"
          test "$browser_count" -eq 6 || {
            echo "Chrome DOM receipts: $browser_count; expected six" >&2
            exit 1
          }
          # The first Web Target must reach Chrome through HTTP; the CLI's
          # static HTML Chrome test and the HTTP body assertion are separate.
          guide_count="$(grep -Fc 'first-change guide steps 0-5 verified end to end' "$log" || true)"
          test "$guide_count" -eq 1 || {
            echo "first-change guide end-to-end receipt: $guide_count; expected one" >&2
            exit 1
          }
          rule_change_chrome_count="$(grep -Fc 'actual rule-change Chrome DOM verified for order 1001' "$log" || true)"
          test "$rule_change_chrome_count" -eq 2 || {
            echo "rule-change Chrome DOM receipts: $rule_change_chrome_count; expected two (before and after)" >&2
            exit 1
          }
          first_web_chrome_count="$(grep -Fc 'actual first Web HTTP Chrome DOM verified for order 1001' "$log" || true)"
          test "$first_web_chrome_count" -eq 1 || {
            echo "first Web real PostgreSQL HTTP Chrome DOM receipt is missing" >&2
            exit 1
          }

      - name: 検証後の変更を検出
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored=matching)"
