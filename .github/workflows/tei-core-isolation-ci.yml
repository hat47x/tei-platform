name: TEI コア隔離・外部利用者検証

# 独立したサブプロジェクトへ移管する前に、最小の合成基盤の
# 単独構築・契約の外部利用を差分限定で確認する。
on:
  pull_request:
    branches: [main]
    paths:
      - 'internal/composition/**'
      - 'tools/check-core-isolation.sh'
      - 'tools/check-core-subject-isolation.sh'
      - 'core/subject/**'
      - 'core/effect/**'
      - 'internal/subject/**'
      - 'tools/repository-architecture-check/**'
      - 'tools/reference-subproject-impact/**'
      - 'reference/composition-kernel/testdata/external-consumer/**'
      - 'tools/reference-composition-process-bridge/**'
      - 'plugins/reference-process-executor/**'
      - 'plugins/reference-order-quote/**'
      - 'tools/reference-capability-transport/**'
      - 'plugins/reference-bundle-alpha/**'
      - 'plugins/reference-bundle-beta/**'
      - 'tools/reference-plugin-bundle/**'
      - 'tools/check-reference-plugin-bundle-isolation.sh'
      - 'tools/check-reference-plugin-isolation.sh'
      - 'tools/check-reference-plugin-wasi-smoke.sh'
      - 'tools/reference-plugin-wasi-smoke/**'
      - '.github/workflows/tei-core-isolation-ci.yml'
  push:
    branches: [main]
    paths:
      - 'internal/composition/**'
      - 'tools/check-core-isolation.sh'
      - 'tools/check-core-subject-isolation.sh'
      - 'core/subject/**'
      - 'core/effect/**'
      - 'internal/subject/**'
      - 'tools/repository-architecture-check/**'
      - 'tools/reference-subproject-impact/**'
      - 'reference/composition-kernel/testdata/external-consumer/**'
      - 'tools/reference-composition-process-bridge/**'
      - 'plugins/reference-process-executor/**'
      - 'plugins/reference-order-quote/**'
      - 'tools/reference-capability-transport/**'
      - 'plugins/reference-bundle-alpha/**'
      - 'plugins/reference-bundle-beta/**'
      - 'tools/reference-plugin-bundle/**'
      - 'tools/check-reference-plugin-bundle-isolation.sh'
      - 'tools/check-reference-plugin-isolation.sh'
      - 'tools/check-reference-plugin-wasi-smoke.sh'
      - 'tools/reference-plugin-wasi-smoke/**'
      - '.github/workflows/tei-core-isolation-ci.yml'

permissions:
  contents: read

concurrency:
  group: tei-core-isolation-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  isolated-composition:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOENV: off
      GOWORK: off
      GOFLAGS: ''
      GOTOOLCHAIN: local
    steps:
      - name: 対象版を取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 実行対象と変更のない作業領域を確認
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored=matching)"

      - name: Go 1.23.2を用意
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false

      - name: コア隔離・外部利用者試験
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l core/effect/*.go internal/composition/scope.go)"
          go test -count=1 ./core/effect
          go vet ./core/effect
          bash tools/check-core-isolation.sh

      - name: Subject正本の外部利用と旧パスの型同一性を検証
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l core/subject/*.go internal/subject/*.go)"
          go test -count=1 ./core/subject ./internal/subject
          bash tools/check-core-subject-isolation.sh

      - name: 既存の依存境界を検証
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./tools/repository-architecture-check

      - name: サブプロジェクト変更面積を測定
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gofmt -d tools/reference-subproject-impact/*.go
          test -z "$(gofmt -l tools/reference-subproject-impact/*.go)"
          go test -count=1 ./tools/reference-subproject-impact
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            go run ./tools/reference-subproject-impact -base "$PR_BASE_SHA" -head "$PR_HEAD_SHA"
          fi

      - name: 独立した参照プラグインを構築・試験
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l plugins/reference-process-executor/*.go)"
          bash tools/check-reference-plugin-isolation.sh
          bash tools/check-reference-plugin-wasi-smoke.sh
          gofmt -d plugins/reference-bundle-alpha/*.go plugins/reference-bundle-beta/*.go tools/reference-plugin-bundle/*.go
          test -z "$(gofmt -l plugins/reference-bundle-alpha/*.go plugins/reference-bundle-beta/*.go tools/reference-plugin-bundle/*.go)"
          bash tools/check-reference-plugin-bundle-isolation.sh

      - name: 独立した業務プラグインの実計算と契約境界を検証
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l plugins/reference-order-quote/*.go tools/reference-capability-transport/*.go)"
          go test -count=1 -timeout 120s -run '^TestIndependentBusinessQuoteOverExistingGenericProcessTransport$' ./tools/reference-capability-transport
          go vet ./tools/reference-capability-transport

      - name: 実プロセスプラグインとの接続を検証
        shell: bash
        run: |
          set -euo pipefail
          gofmt -d tools/reference-composition-process-bridge/*.go
          test -z "$(gofmt -l tools/reference-composition-process-bridge/*.go)"
          go test -count=1 -timeout 90s ./tools/reference-composition-process-bridge
          go vet ./tools/reference-composition-process-bridge

      - name: 実行後の変更のない作業領域を確認
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored=matching)"
