name: TEI RA-1 Browse Query pre-executor tests

on:
  pull_request:
    branches:
      - feat/b2c-recent-orders-declared-from-20261114
    paths:
      - '.github/workflows/tei-ra1-browse-preexecutor-tests.yml'
      - 'internal/driver/**'
      - 'internal/query/**'
      - 'internal/validation/**'
      - 'reference/workspace/**'
      - 'tools/reference-first-web-target/**'

permissions:
  contents: read

jobs:
  ra1-driver-preflight:
    name: Exact PR code - Go Driver and historical Web reference
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR merge code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Go from module
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check Go format for RA-1 changed Go sources
        shell: bash
        run: |
          set -euo pipefail
          files=(
            internal/driver/query_execution.go
            internal/driver/query_execution_test.go
            internal/driver/query_invocation_parameter_test.go
            internal/driver/browse_query_environment.go
            internal/driver/browse_query_environment_test.go
          )
          test -z "$(gofmt -l "${files[@]}")"
      - name: Run RA-1 typed path and Source/Loader Go tests
        run: |
          set -euo pipefail
          go test -count=1 ./internal/driver ./internal/query ./internal/syntax ./internal/validation
      - name: Run older First Web Target fixture regression
        run: |
          set -euo pipefail
          go test -count=1 ./tools/reference-first-web-target
      - name: Run reference Reader and product CLI tests without claiming PG E2E
        run: |
          set -euo pipefail
          go test -count=1 ./tools/reference-browse-read ./cmd/tei
      - name: Go vet changed runtime and test consumers
        run: |
          set -euo pipefail
          go vet ./internal/driver ./tools/reference-first-web-target ./tools/reference-browse-read

# This is a candidate-branch-only test; it proves only the checked-out code.
# Disposable PostgreSQL, Native Consumer, accepted Source, Owner authority and
# production Host/Studio Stage2 require independent witnesses.
