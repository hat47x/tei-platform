name: TEI 旧変換コミットの不具合と修正の再現検査

# #1053: 旧変換PRの固定コミットを再現する検査。
#
# 固定コミット 868156f6 は壊れたマージ解決を含み、internal/plugin/transform が
# ビルドできない（eval.go が objectShared(fields...) と可変長で呼ぶが、定義は
# objectShared(fields []Field)）。修正は ed04b700e。
#
# この検査は「その不具合が実在したこと」と「修正で解消したこと」を両方向から
# 確かめる。片側だけでは、対象コミットの取り違えや、修正の巻き戻しを検出できない。
# #3725: 以前は固定コミットに対して go vet・go test を実行していたため、
# 対象が壊れている以上どの実行も失敗し、2026-10-12 以降ずっと赤だった。
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - .github/workflows/tei-transform-historical-head-qualification.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/tei-transform-historical-head-qualification.yml
  workflow_dispatch:

permissions:
  contents: read

# 同じPRの古い実行だけを取り消し、mainへのpushは取り消さない（#3682）。
concurrency:
  group: tei-historical-transform-defect-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  historical-defect-reproduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOENV: off
      GOWORK: off
      GOFLAGS: ''
      GOTOOLCHAIN: local
      BROKEN_SHA: 868156f603a6af21dc3c56d395e2a9d07c479116
      FIX_SHA: ed04b700e9d566b5606270e648530ba424e17d7f
    steps:
      - name: 固定コミットを含む完全なGit履歴を取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 対象コミットの存在と作業領域を確認
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          for sha in "$BROKEN_SHA" "$FIX_SHA"; do
            git cat-file -e "${sha}^{commit}"
          done
          # 修正が不具合より後であること。順序が逆なら再現の前提が崩れている。
          if ! git merge-base --is-ancestor "$BROKEN_SHA" "$FIX_SHA"; then
            echo "the fix commit is not a descendant of the broken commit" >&2
            exit 1
          fi
          printf 'broken-commit=%s\nfix-commit=%s\n' "$BROKEN_SHA" "$FIX_SHA"

      - name: Go実行環境を準備
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false

      - name: 固定コミットが実際に壊れていることを確かめる
        shell: bash
        run: |
          set -euo pipefail
          git checkout --quiet --detach "$BROKEN_SHA"
          test "$(git rev-parse HEAD)" = "$BROKEN_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          # 壊れた状態を「落ちる」ことで確かめる。落ちなければ対象の取り違え。
          log="$RUNNER_TEMP/broken-vet.log"
          if go vet ./internal/plugin/transform/... >"$log" 2>&1; then
            echo "the pinned commit compiled; it no longer reproduces the historical defect" >&2
            cat "$log" >&2
            exit 1
          fi
          cat "$log"
          if ! grep -Fq 'objectShared' "$log"; then
            echo "the failure is not the historical objectShared defect:" >&2
            cat "$log" >&2
            exit 1
          fi
          printf 'historical-defect-reproduced=%s\n' "$BROKEN_SHA"

      - name: 修正コミットで解消していることを確かめる
        shell: bash
        run: |
          set -euo pipefail
          git checkout --quiet --detach "$FIX_SHA"
          test "$(git rev-parse HEAD)" = "$FIX_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          go vet ./internal/plugin/transform/...
          go test -count=1 -timeout 15m ./internal/plugin/transform/...
          printf 'historical-defect-fixed=%s\n' "$FIX_SHA" | tee "$RUNNER_TEMP/historical-fix-receipt.txt"

      - name: 検証後の変更を検出
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: 検証の記録を保存
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tei-historical-transform-defect-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/broken-vet.log
            ${{ runner.temp }}/historical-fix-receipt.txt
