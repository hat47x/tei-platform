name: TEI topology coverage synthetic P1 Node

# Verifies only declared synthetic Graph/Table preservation and fail-closed
# bounded absence. This is NOT real Source/Provider/Policy completeness.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'reference/tei-topology-coverage/**'
      - '.github/workflows/tei-topology-coverage-ci.yml'
  push:
    branches: [main]
    paths:
      - 'reference/tei-topology-coverage/**'
      - '.github/workflows/tei-topology-coverage-ci.yml'

permissions:
  contents: read

concurrency:
  group: tei-topology-p1-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  topology-p1-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact PR head or push
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Pin Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
          check-latest: false

      - name: Verify source identity before test
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          node --version
          for file in reference/tei-topology-coverage/coverage.mjs reference/tei-topology-coverage/coverage.test.mjs; do
            test -f "$file"
            printf 'topology-p1-blob=%s file=%s\n' "$(git hash-object "$file")" "$file"
          done

      - name: Run synthetic Graph/Table bounded-absence tests
        shell: bash
        run: |
          set -euo pipefail
          node --test reference/tei-topology-coverage/coverage.test.mjs

      - name: Verify tested revision remains unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
