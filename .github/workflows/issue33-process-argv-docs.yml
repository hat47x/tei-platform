name: Finalize Issue 33 process argv docs

on:
  push:
    branches:
      - work/issue-33-process-argv
    paths:
      - .github/workflows/issue33-process-argv-docs.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/issue-33-process-argv
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Update M0.25 documentation
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "docs/architecture.md",
              "M0.24では`StdioProcessLauncher`をReference Host adapterとして追加し、`exec.CommandContext`でactual child processを起動してRequest / Response JSONをstdioで交換します。commandは一つのexecutable名/pathとして扱い、shell展開や空白からのargv推測は行いません。plain process launcherはsandboxではなく、`sandbox required`の実行には引き続きHost Sandboxのpolicy enforcerが必要です。",
              "M0.24では`StdioProcessLauncher`をReference Host adapterとして追加し、actual child processとRequest / Response JSONをstdioで交換しました。M0.25では [ADR-0006](adr/0006-process-command-and-argv.md) に基づき、process指定を単一executableと順序付きargvへ分離しています。`Runtime.Command`は単一executable名/path、`Runtime.Args`は順序付き引数であり、Host境界では`ProcessCommand{Executable, Args}`として構造化したまま`exec.CommandContext(ctx, executable, args...)`へ渡します。shell展開、空白split、quote再解釈は行いません。plain process launcherはsandboxではなく、`sandbox required`の実行には引き続きHost Sandboxのpolicy enforcerが必要です。"
          )
          replace_once(
              "docs/architecture.md",
              "このone-shot local process境界とDurable reattachは別です。OS PIDをDurable Runtime Handleとはみなさず、cross-host reattachにはopaque durable handleを提供する外部runtime adapterが必要です。詳細は [M0.24実process Conformance](conformance/process-runtime-m0.24.md) を参照してください。",
              "このone-shot local process境界とDurable reattachは別です。OS PIDをDurable Runtime Handleとはみなさず、cross-host reattachにはopaque durable handleを提供する外部runtime adapterが必要です。実process transportは [M0.24実process Conformance](conformance/process-runtime-m0.24.md)、executable / argv境界は [M0.25 Conformance](conformance/process-command-argv-m0.25.md) を参照してください。"
          )

          marker = "詳細は [M0.24実process Conformance](conformance/process-runtime-m0.24.md) を参照してください。\n\n## 継続的な検証"
          addition = "詳細は [M0.24実process Conformance](conformance/process-runtime-m0.24.md) を参照してください。\n\n## M0.25 process executable / argv\n\nM0.25では、process Pluginの実行指定をshell-likeなcommand lineではなく、単一executableと順序付きargvへ分離しました。設計判断は [ADR-0006](adr/0006-process-command-and-argv.md) に記録しています。\n\n- authoring grammarで `runtime process \"python3\" args \"-m\" \"worker\"` を表現\n- `Runtime.Command`は単一executable、`Runtime.Args`は順序付きargv\n- legacyな空白入りcommandを自動splitせず、明示argsへの移行を要求\n- `ProcessCommand{Executable, Args}`をProcess / Sandbox境界で維持\n- args差分をDefinition / Plugin Lock / Runtime Policy fingerprintへ反映\n- Reference Workspaceのprocess descriptorをargs利用へ移行\n- 空白を含む一つのargv elementがactual child processの`os.Args`まで保存されることをReference実process例で検証\n\n詳細は [M0.25 Conformance](conformance/process-command-argv-m0.25.md) を参照してください。\n\n## 継続的な検証"
          replace_once("docs/status.md", marker, addition)
          replace_once(
              "docs/status.md",
              "- DeploymentExecutorからactual child processへstdio protocolで到達できること\n- runtime reattachの参照例が動作すること",
              "- DeploymentExecutorからactual child processへstdio protocolで到達できること\n- executable / argvをshell-like stringへ畳まず、空白を含む一つのargv elementがactual child processまで保存されること\n- runtime reattachの参照例が動作すること"
          )

          replace_once(
              "docs/getting-started.md",
              "出力の`outcome`は`accepted`、Plugin Invocationの`boundary`は`process`になります。`accepted`はexecutor acknowledgementであり、外部stateの完成証明ではありません。",
              "出力の`outcome`は`accepted`、Plugin Invocationの`boundary`は`process`になります。Reference pluginには`--tei-reference-marker=argv value preserved`という空白を含む一つのargv elementも渡され、子process側がその境界を確認してから成功Responseを返します。`accepted`はexecutor acknowledgementであり、外部stateの完成証明ではありません。"
          )
          replace_once(
              "docs/getting-started.md",
              "この例はone-shot local processです。PIDをDurable Runtime Handleとして扱わず、Host restart / cross-host reattachを実現したとはみなしません。詳細は [M0.24実process Conformance](conformance/process-runtime-m0.24.md) を参照してください。",
              "この例はone-shot local processです。PIDをDurable Runtime Handleとして扱わず、Host restart / cross-host reattachを実現したとはみなしません。実process境界は [M0.24実process Conformance](conformance/process-runtime-m0.24.md)、executable / argv境界は [M0.25 Conformance](conformance/process-command-argv-m0.25.md) を参照してください。"
          )
      - name: Verify repository
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l cmd internal examples tools)"
          go vet ./...
          go test ./...
          go run ./cmd/tei validate -workspace reference/workspace
          go build -o /tmp/tei-reference-process-plugin ./tools/reference-process-plugin
          go run ./examples/process-plugin -plugin /tmp/tei-reference-process-plugin > /tmp/result.json
          grep -q 'argv=--tei-reference-marker=argv value preserved' /tmp/result.json
      - name: Commit docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture.md docs/status.md docs/getting-started.md
          git commit -m "M0.25 executable argv境界を文書化する"
          git push origin HEAD:work/issue-33-process-argv
