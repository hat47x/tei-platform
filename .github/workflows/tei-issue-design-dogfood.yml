              "- **Context→Scenario World束縛**：Context FPと生成Plan SHAの一致、実CLIを使ったSource Indexの生成前・Pinned実行後の版を再照合。",
              "- **Source-only drift**：隔離Sourceの末尾LFでWorld不変／Source Index改版を観測。既存World PinでScenario自体は成功しても、旧Contextの採用は拒否。A→B→Aの履歴は証明しない。",
              "- **Context→Scenario版束縛**：ContextのWorld FPと生成Plan WorldSHA一致、Source Indexを実CLIで実行前後に再観測。",
              "- **Source-only TOCTOU**：隔離WorkspaceのSource末尾改行でCanonical Worldは不変、Source Indexだけ変化。World-pinned Scenario実行だけでは失効を検出できず、Context Consumerが拒否。A→B→Aの履歴は不明。",
