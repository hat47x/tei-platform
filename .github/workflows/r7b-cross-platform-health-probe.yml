name: R7B cross-platform repository health probe

on:
  push:
    branches:
      - research/selective-knowledge-routing-r6

permissions:
  contents: read

jobs:
  repository-health:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            shell: bash
          - runner: windows-2025
            shell: bash
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify exact packet identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1)"
          test "$(git hash-object tools/run-first-web-target-r7b-replay.sh)" = "2f55ec06f29bbca8f4a9e6ce04816bd311a8af03"
          test "$(git ls-files -s tools/run-first-web-target-r7b-replay.sh | awk '{print $1}')" = "100755"
          go version
          go env GOOS GOARCH

      - name: Repository health
        run: |
          set -euo pipefail
          bash tools/repository-health-check.sh
