name: Patch semantic validation anchor

on:
  push:
    branches:
      - work/business-validation-semantic-contract

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Repositoryを取得
        uses: actions/checkout@v7
        with:
          ref: work/business-validation-semantic-contract

      - name: Semantic Validation anchorを安全に更新
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_semantic_validation_anchor.py
          git diff --check
          if git diff --quiet -- internal/syntax/semantic_anchor.go internal/workspace/source_index.go; then
            echo '既にanchor修正済みです。'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/syntax/semantic_anchor.go internal/workspace/source_index.go
          git commit -m "Semantic ValidationをSource Indexの正確なanchorへ接続する [semantic-validation-anchor-patched]"
          git push origin HEAD:work/business-validation-semantic-contract
