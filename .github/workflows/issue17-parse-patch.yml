name: Finish Issue 17 source-aware validate

on:
  push:
    branches:
      - work/issue-17-parse-diagnostics-cli
    paths:
      - .github/workflows/issue17-parse-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/issue-17-parse-diagnostics-cli

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Route workspace validation through source-aware diagnostics
        shell: python
        run: |
          from pathlib import Path

          p = Path("cmd/tei/main.go")
          text = p.read_text()
          old = '''\tif (*worldPath == "") == (*workspacePath == "") {
\t\tfmt.Fprintln(os.Stderr, "exactly one of -workspace or -world is required")
\t\tos.Exit(2)
\t}

\tw, err := loadWorld(*worldPath, *workspacePath)
'''
          new = '''\tif (*worldPath == "") == (*workspacePath == "") {
\t\tfmt.Fprintln(os.Stderr, "exactly one of -workspace or -world is required")
\t\tos.Exit(2)
\t}
\tif command == "validate" && *workspacePath != "" {
\t\tcode, err := validateWorkspace(os.Stdout, *workspacePath)
\t\tif err != nil {
\t\t\tfmt.Fprintln(os.Stderr, err)
\t\t\tos.Exit(2)
\t\t}
\t\tif code != 0 {
\t\t\tos.Exit(code)
\t\t}
\t\treturn
\t}

\tw, err := loadWorld(*worldPath, *workspacePath)
'''
          if text.count(old) != 1:
              raise SystemExit("main validation routing target not found exactly once")
          p.write_text(text.replace(old, new, 1))

      - name: Format
        run: gofmt -w cmd/tei/main.go cmd/tei/validation_output.go cmd/tei/validation_output_test.go internal/workspace/source_diagnostic_test.go

      - name: Verify focused packages
        run: go test ./cmd/tei ./internal/workspace ./internal/syntax

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue17-parse-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Workspace validateをsource-aware diagnosticへ接続する"
          git push origin HEAD:work/issue-17-parse-diagnostics-cli
