name: Apply Issue 9 runtime fencing documentation

on:
  push:
    branches:
      - work/issue-9-runtime-fencing-authority
    paths:
      - .github/workflows/issue9-runtime-fencing-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/issue-9-runtime-fencing-authority

      - name: Update authority documentation
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, got {count}: {old[:160]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "docs/architecture.md",
              '''Resource authorityのfencingとruntime reattachのfencingを両方要求します。\n\n`unknown`時のruntime authorityとDurable Handle上のfencing generationの意味には未決の論点があり、Issue #9で独立して扱っています。''',
              '''Resource authorityのfencingとruntime reattachのfencingを両方要求します。\n\nADR-0005では、Supervisor側のauthority generationと、外部runtimeが実際に受理済みのgenerationを分離しました。`DurableInvocationHandle.FencingToken`はSupervisor generation、`RuntimeFencingToken`はruntime-confirmed generationを表します。\n\n`unknown`では新SupervisorのgenerationだけをDurable Handleへ保存し、`RuntimeFencingToken`は進めません。後続観測でruntimeが`running` / `starting`へ戻り、authority-bearing reattachが成功した時点で両generationが再び一致します。これにより、runtime authorityが未確立なのに確立済みとして保存することを避けます。詳細は [ADR-0005](adr/0005-supervisor-and-runtime-fencing-authority.md) を参照してください。''',
          )

          replace_once(
              "docs/status.md",
              '''一方、`RuntimeUnknown`時にDurable Invocation Handle上のfencing generationをどこまで進めたとみなすかは、意味上の判断が残っています。この論点はIssue #9へ分離しており、M0.22.1のConformance testで先に意味を固定していません。''',
              '''`RuntimeUnknown`時のfencing authorityについてはIssue #9 / ADR-0005で整理しました。Durable control plane上のSupervisor generationと、外部runtimeが実際に受理済みのgenerationを分離し、`FencingToken`と`RuntimeFencingToken`として記録します。unknownでは前者だけを進め、runtime-confirmed generationはlive reattach成功時にだけ追いつかせます。''',
          )

          replace_once(
              "docs/conformance/plugin-runtime-m0.22.1.md",
              '''## 現時点で未決の境界\n\n`RuntimeUnknown` のfencing authorityには、M0.22.1の監査で未決の継ぎ目が見つかりました。\n\n現在の実装は、runtimeが`unknown`ならreattachを行わず観測待ちにしますが、Durable Invocation Handle上のSupervisor owner / fencing tokenは新しい世代へ進めます。このtokenが「観測・調停するSupervisorの世代」を表すのか、「runtime自身にも設置済みのauthority世代」を表すのかで、意味が変わります。\n\nこの点はIssue #9で独立して検討します。M0.22.1のConformance test追加では、どちらかの意味を先に固定しません。''',
              '''## RuntimeUnknownとfencing authority\n\nM0.22.1の監査で見つかった`RuntimeUnknown`時の継ぎ目は、Issue #9 / ADR-0005で判断を固定しました。\n\nDurable Invocation Handleでは、Supervisor Ownership Store上で現在の調停権を持つgenerationと、外部runtimeがauthority-bearingな操作を通じて実際に受理したgenerationを別の事実として扱います。\n\n- `SupervisorOwnerID` / `FencingToken`: Durable control plane上のSupervisor authority\n- `RuntimeFencingToken`: runtime側で受理済みと確認できた最後のgeneration\n\n基本不変条件は`RuntimeFencingToken <= FencingToken`です。fieldが存在しない既存Handleは、runtime generationを`FencingToken`から暗黙に推測せず、0をunknownとして扱います。\n\n`RuntimeUnknown`を観測した場合、新Supervisorのowner / fencing tokenは保存しますが、`RuntimeFencingToken`は進めません。reattachも行わず、deployment actionはunresolvedのまま残します。後続観測で同じruntimeが`running` / `starting`へ戻り、authority-bearing reattachが成功した場合にだけ`RuntimeFencingToken`を現在のSupervisor generationへ進めます。\n\nこの区別により、Resource Broker側では新generationへtakeover済みでも、runtime-side fencingがまだ未確立という状態をDurableに表現できます。その期間にfull runtime authorityを持つとは主張せず、runtime-mutating operationや自動replayへ短絡しません。\n\nConformance testでは、unknownでSupervisor generationだけが進むこと、後続reattachでruntime generationが追いつくこと、runtime generationがSupervisor generationを超えるHandleを拒否すること、terminal / missingの非authority-bearing observationだけではruntime generationを進めないことを直接確認します。設計理由は [ADR-0005](../adr/0005-supervisor-and-runtime-fencing-authority.md) に記録しています。''',
          )

      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          go vet ./...
          go test ./...
          grep -q 'RuntimeFencingToken' docs/conformance/plugin-runtime-m0.22.1.md
          grep -q 'ADR-0005' docs/architecture.md docs/status.md

      - name: Commit documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture.md docs/status.md docs/conformance/plugin-runtime-m0.22.1.md
          git commit -m "Runtime fencing authorityのConformanceを更新する"
          git push origin HEAD:work/issue-9-runtime-fencing-authority
