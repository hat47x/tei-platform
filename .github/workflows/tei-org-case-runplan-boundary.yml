name: TEI org-case RunPlan boundary

on:
  pull_request:
    paths:
      - 'internal/execution/**'
      - '.github/workflows/tei-org-case-runplan-boundary.yml'

permissions:
  contents: read

concurrency:
  group: tei-org-case-runplan-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  org-runplan-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
      - name: Assert fixed head and clean input
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          go version
      - name: Actual Go Runner negative characterizations
        run: |
          go test ./internal/execution -run '^TestOrgCaseRunPlan' -count=1 -v
      - name: Confirm clean source
        run: |
          test -z "$(git status --porcelain)"
