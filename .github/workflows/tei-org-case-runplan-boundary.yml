name: TEI org-case RunPlan boundary

on:
  pull_request:
    paths:
      - 'internal/execution/**'
      - '.github/workflows/tei-org-case-runplan-boundary.yml'

permissions:
  contents: read

jobs:
  org-runplan-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Assert fixed head and clean input
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          go version
      - name: Actual Go Runner negative characterizations
        run: |
          go test ./internal/execution -run '^TestOrgCaseRunPlan' -count=1 -v
      - name: Confirm clean source
        run: |
          test -z "$(git status --porcelain)"
