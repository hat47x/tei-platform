name: TEI org-case RunPlan boundary

on:
  pull_request:
    paths:
      - 'internal/execution/**'
      - '.github/workflows/tei-org-case-runplan-boundary.yml'

permissions:
  contents: read

# One result per commit, and a newer pull-request run replaces an older one.
# CONTRIBUTING.md requires concurrency from every workflow a pull request can
# start, and tools/ci-workflows-test.py enforces it. This file was added
# without it, alongside an unpinned action and a checkout that kept its
# credentials, which turned repository-health red for every pull request that
# touched internal/execution (#3682).
concurrency:
  group: tei-org-case-runplan-boundary-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  org-runplan-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOENV: off
      GOWORK: off
      GOFLAGS: ''
      GOTOOLCHAIN: local
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Assert fixed head and clean input
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          go version
      - name: Actual Go Runner negative characterizations
        run: |
          go test ./internal/execution -run '^TestOrgCaseRunPlan' -count=1 -v
      - name: Confirm clean source
        run: |
          test -z "$(git status --porcelain)"
