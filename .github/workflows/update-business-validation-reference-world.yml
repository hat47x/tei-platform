name: 業務Validation Reference World更新

on:
  push:
    branches:
      - work/business-validation-reference-v4

permissions:
  contents: write

jobs:
  update-reference-world:
    if: ${{ !contains(github.event.head_commit.message, '[business-validation-world-generated]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Repositoryを取得
        uses: actions/checkout@v7
        with:
          ref: work/business-validation-reference-v4

      - name: Goを準備
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Reference Worldを正本から再生成
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/tei world \
            -workspace reference/workspace \
            > /tmp/tei-reference-world.json
          mv /tmp/tei-reference-world.json reference/world.json

      - name: 生成結果をbranchへ反映
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- reference/world.json; then
            echo "reference/world.jsonに差分はありません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/world.json
          git commit -m "Reference Worldを業務Validation実Referenceへ同期する [business-validation-world-generated]"
          git push origin HEAD:work/business-validation-reference-v4
