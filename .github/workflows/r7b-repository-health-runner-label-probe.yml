name: R7B repository health runner-label probe

on:
  push:
    branches:
      - research/selective-knowledge-routing-r6

permissions:
  contents: read

jobs:
  repository-health:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-22.04
          - ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Record execution revision
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git status --short
          go version
          go env GOOS GOARCH

      - name: Repository health
        run: |
          set -euo pipefail
          bash tools/repository-health-check.sh
