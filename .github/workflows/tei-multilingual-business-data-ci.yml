name: TEI 多言語業務データの参照契約

on:
  pull_request:
    branches: [main]
    paths:
      - 'reference/multilingual-business-data/**'
      - '.github/workflows/tei-multilingual-business-data-ci.yml'
      - 'go.mod'
      - 'go.sum'
  push:
    branches: [main]
    paths:
      - 'reference/multilingual-business-data/**'
      - '.github/workflows/tei-multilingual-business-data-ci.yml'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

concurrency:
  group: tei-multilingual-business-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tei
          POSTGRES_PASSWORD: tei
          POSTGRES_DB: tei
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tei -d tei"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEI_MULTILINGUAL_PG_DSN: postgres://tei:tei@127.0.0.1:5432/tei?sslmode=disable
      GOENV: off
      GOWORK: off
      GOFLAGS: ''
      GOTOOLCHAIN: local
    steps:
      - name: ソースと完全な履歴を取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Goの版を用意
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: 対象版と実行前の作業領域を確認
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: 多言語業務データの整形・静的解析・局所試験
        shell: bash
        run: |
          set -euo pipefail
          if test -n "$(gofmt -l reference/multilingual-business-data/*.go)"; then
            gofmt -d reference/multilingual-business-data/*.go
            exit 1
          fi
          go vet ./reference/multilingual-business-data
          go test -race -count=1 ./reference/multilingual-business-data
      - name: SQLite実データの保存・再読込・検索を検証
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -m unittest discover -s reference/multilingual-business-data -p test_sqlite.py -v
      - name: 実行後の作業領域を確認
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
