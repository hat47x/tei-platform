name: Apply Issue 50 advanced index core model v3

on:
  push:
    branches: [work/issue-50-core-model]
    paths:
      - .github/workflows/issue50-core-model-apply3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Advanced Index Core / PostgreSQL modelへ移行
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def sub(path, pattern, replacement, flags=0):
              p = Path(path)
              text = p.read_text()
              text, n = re.subn(pattern, replacement, text, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f"replacement failed: {path} count={n}")
              p.write_text(text)

          sub('internal/database/providers/postgres/catalog.go', r'''type IndexMeta struct \{\n\tSchema  string\n\tTable   string\n\tName    string\n\tColumns \[\]string\n\tUnique  bool\n\tMethod  string\n\}''', '''type IndexKeyMeta struct {
          \tColumn        string
          \tExpression    string
          \tCollation     string
          \tOperatorClass string
          \tDescending    bool
          \tNullsFirst    bool
          }

          type IndexMeta struct {
          \tSchema           string
          \tTable            string
          \tName             string
          \tKeys             []IndexKeyMeta
          \tIncludedColumns  []string
          \tPredicate        string
          \tUnique           bool
          \tNullsNotDistinct bool
          \tMethod           string
          \tValid            bool
          \tReady            bool
          \tLive             bool
          }''')

          provider_loop = '''\tfor _, meta := range indexes {
          \t\tif i, ok := byName[key(meta.Schema, meta.Table)]; ok {
          \t\t\tt := &snapshot.Tables[i]
          \t\t\tindex := physical.Index{Name: meta.Name, IncludedColumns: append([]string(nil), meta.IncludedColumns...), Unique: meta.Unique, Method: meta.Method, State: &physical.IndexState{Valid: meta.Valid, Ready: meta.Ready, Live: meta.Live}}
          \t\t\tif meta.Unique {
          \t\t\t\tindex.UniqueNullTreatment = physical.UniqueNullsDistinct
          \t\t\t\tif meta.NullsNotDistinct { index.UniqueNullTreatment = physical.UniqueNullsNotDistinct }
          \t\t\t}
          \t\t\tif meta.Predicate != "" { index.Predicate = &physical.ProviderExpression{Provider: string(environment.ProviderPostgres), Source: meta.Predicate} }
          \t\t\tfor _, km := range meta.Keys {
          \t\t\t\tk := physical.IndexKey{Column: km.Column, Collation: km.Collation, OperatorClass: km.OperatorClass, Order: physical.IndexOrderAsc, NullsOrder: physical.IndexNullsLast}
          \t\t\t\tif km.Expression != "" { k.Column = ""; k.Expression = &physical.ProviderExpression{Provider: string(environment.ProviderPostgres), Source: km.Expression} }
          \t\t\t\tif km.Descending { k.Order = physical.IndexOrderDesc }
          \t\t\t\tif km.NullsFirst { k.NullsOrder = physical.IndexNullsFirst }
          \t\t\t\tindex.Keys = append(index.Keys, k)
          \t\t\t}
          \t\t\tt.Indexes = append(t.Indexes, index)
          \t\t}
          \t}
          \tnow := time.Now'''
          sub('internal/database/providers/postgres/provider.go', r'''\tfor _, meta := range indexes \{.*?\n\t\}\n\tnow := time\.Now''', provider_loop, re.S)

          persistence_loop = '''\t\tfor _, idx := range m.Indexes {
          \t\t\tpi := physical.Index{Name: idx.Name, Unique: idx.Unique, Method: defaultIndexMethod(provider)}
          \t\t\tif idx.Unique && provider == environment.ProviderPostgres { pi.UniqueNullTreatment = physical.UniqueNullsDistinct }
          \t\t\tfor _, attr := range idx.Attributes {
          \t\t\t\tname, ok := columnByAttribute[attr]
          \t\t\t\tif !ok { return physical.SchemaSnapshot{}, fmt.Errorf("mapping %s index %s attribute %s has no column mapping", m.ID, idx.Name, attr) }
          \t\t\t\tk := physical.IndexKey{Column: name}
          \t\t\t\tif provider == environment.ProviderPostgres { k.Order = physical.IndexOrderAsc; k.NullsOrder = physical.IndexNullsLast }
          \t\t\t\tpi.Keys = append(pi.Keys, k)
          \t\t\t}
          \t\t\tt.Indexes = append(t.Indexes, pi)
          \t\t}'''
          sub('internal/database/persistence/realize.go', r'''\t\tfor _, idx := range m\.Indexes \{.*?\n\t\t\}''', persistence_loop, re.S)

          p = Path('internal/database/migration/render.go')
          text = p.read_text().replace('joinIDs(c.Index.Columns)', 'joinIDs(columns)')
          needle = '\t\t\tunique := ""\n\t\t\tif c.Index.Unique {'
          insert = '\t\t\tcolumns, err := simpleIndexColumns(c.Index)\n\t\t\tif err != nil { return nil, fmt.Errorf("add-index %s.%s: %w", c.Table, c.Index.Name, err) }\n' + needle
          if needle not in text: raise SystemExit('migration insertion point missing')
          text = text.replace(needle, insert, 1)
          marker = 'func indexMethod(i *physical.Index) string {'
          helper = '''func simpleIndexColumns(i *physical.Index) ([]string, error) {
          \tif i.Predicate != nil || len(i.IncludedColumns) != 0 { return nil, fmt.Errorf("advanced index rendering is not implemented") }
          \tcolumns := make([]string, 0, len(i.Keys))
          \tfor _, k := range i.Keys {
          \t\tif k.Expression != nil || strings.TrimSpace(k.Column) == "" || strings.TrimSpace(k.Collation) != "" || strings.TrimSpace(k.OperatorClass) != "" { return nil, fmt.Errorf("advanced index key rendering is not implemented") }
          \t\tif k.Order != "" && k.Order != physical.IndexOrderDefault && k.Order != physical.IndexOrderAsc { return nil, fmt.Errorf("advanced index ordering is not implemented") }
          \t\tif k.NullsOrder != "" && k.NullsOrder != physical.IndexNullsDefault && k.NullsOrder != physical.IndexNullsLast { return nil, fmt.Errorf("advanced index NULL ordering is not implemented") }
          \t\tcolumns = append(columns, k.Column)
          \t}
          \treturn columns, nil
          }

          '''
          if marker not in text: raise SystemExit('migration helper point missing')
          p.write_text(text.replace(marker, helper + marker, 1))

          p = Path('internal/database/schemadiff/diff.go')
          text = p.read_text().replace('\tDropIndex            ChangeKind = "drop-index"\n', '\tDropIndex            ChangeKind = "drop-index"\n\tIndexStateDrift      ChangeKind = "index-state-drift"\n', 1)
          text, n = re.subn(r'''\t\t\} else if dok && aok && !sameIndex\(d, a\) \{\n\t\t\told := a\n\t\t\tnewi := d\n\t\t\tout = append\(out, Change\{Kind: DropIndex, Table: name, Index: &old\}, Change\{Kind: AddIndex, Table: name, Index: &newi\}\)\n\t\t\}''', '''\t\t} else if dok && aok && !sameIndexStructure(d, a) {
          \t\t\told := a; newi := d
          \t\t\tout = append(out, Change{Kind: DropIndex, Table: name, Index: &old}, Change{Kind: AddIndex, Table: name, Index: &newi})
          \t\t} else if dok && aok && a.State != nil && !a.State.Usable() {
          \t\t\tobserved := a
          \t\t\tout = append(out, Change{Kind: IndexStateDrift, Table: name, Index: &observed})
          \t\t}''', text, count=1)
          if n != 1: raise SystemExit('schemadiff loop replacement failed')
          text, n = re.subn(r'''func sameIndex\(a, b physical\.Index\) bool \{\n\treturn .*?\n\}''', '''func sameIndexStructure(a, b physical.Index) bool {
          \tif a.Unique != b.Unique || norm(a.Method) != norm(b.Method) || a.UniqueNullTreatment != b.UniqueNullTreatment || len(a.Keys) != len(b.Keys) || len(a.IncludedColumns) != len(b.IncludedColumns) { return false }
          \tfor i := range a.Keys { if !sameIndexKey(a.Keys[i], b.Keys[i]) { return false } }
          \treturn sameStrings(a.IncludedColumns, b.IncludedColumns) && sameProviderExpression(a.Predicate, b.Predicate)
          }
          func sameIndexKey(a, b physical.IndexKey) bool { return norm(a.Column) == norm(b.Column) && sameProviderExpression(a.Expression, b.Expression) && norm(a.Collation) == norm(b.Collation) && norm(a.OperatorClass) == norm(b.OperatorClass) && normalizeIndexOrder(a.Order) == normalizeIndexOrder(b.Order) && normalizeIndexNullsOrder(a.NullsOrder) == normalizeIndexNullsOrder(b.NullsOrder) }
          func sameProviderExpression(a, b *physical.ProviderExpression) bool { if a == nil || b == nil { return a == nil && b == nil }; return norm(a.Provider) == norm(b.Provider) && strings.TrimSpace(a.Source) == strings.TrimSpace(b.Source) }
          func normalizeIndexOrder(v physical.IndexOrder) physical.IndexOrder { if v == "" { return physical.IndexOrderDefault }; return v }
          func normalizeIndexNullsOrder(v physical.IndexNullsOrder) physical.IndexNullsOrder { if v == "" { return physical.IndexNullsDefault }; return v }''', text, count=1, flags=re.S)
          if n != 1: raise SystemExit('schemadiff comparator replacement failed')
          p.write_text(text)

          sub('internal/database/providers/postgres/provider_test.go', r'''func \(fakeCatalog\) Indexes\(context\.Context\) \(\[\]postgres\.IndexMeta, error\) \{\n\treturn .*?\n\}''', '''func (fakeCatalog) Indexes(context.Context) ([]postgres.IndexMeta, error) {
          \treturn []postgres.IndexMeta{{Schema: "public", Table: "orders", Name: "orders_customer_idx", Method: "btree", Keys: []postgres.IndexKeyMeta{{Column: "customer_id"}}, Valid: true, Ready: true, Live: true}}, nil
          }''', re.S)

          sql_catalog = Path('internal/database/providers/postgres/sql_catalog.go')
          text = sql_catalog.read_text()
          new_indexes = r'''func (r SQLCatalogReader) Indexes(ctx context.Context) ([]IndexMeta, error) {
          \trows, err := r.DB.QueryContext(ctx, `
          SELECT ns.nspname, tbl.relname, idx.relname, ind.indisunique, am.amname,
                 pos.ord, ind.indnkeyatts,
                 COALESCE(att.attname, ''),
                 CASE WHEN pos.ord <= ind.indnkeyatts AND pos.attnum = 0
                      THEN pg_catalog.pg_get_indexdef(ind.indexrelid, pos.ord::int, true)
                      ELSE '' END,
                 CASE WHEN pos.ord <= ind.indnkeyatts AND coll.oid <> 0
                           AND (att.attname IS NULL OR coll.oid <> att.attcollation)
                      THEN coll_ns.nspname || '.' || coll.collname ELSE '' END,
                 CASE WHEN pos.ord <= ind.indnkeyatts AND opc.oid <> 0 AND NOT opc.opcdefault
                      THEN opc_ns.nspname || '.' || opc.opcname ELSE '' END,
                 CASE WHEN pos.ord <= ind.indnkeyatts THEN COALESCE(pg_catalog.pg_index_column_has_property(ind.indexrelid, pos.ord::int, 'desc'), false) ELSE false END,
                 CASE WHEN pos.ord <= ind.indnkeyatts THEN COALESCE(pg_catalog.pg_index_column_has_property(ind.indexrelid, pos.ord::int, 'nulls_first'), false) ELSE false END,
                 COALESCE(pg_catalog.pg_get_expr(ind.indpred, ind.indrelid, true), ''),
                 ind.indnullsnotdistinct, ind.indisvalid, ind.indisready, ind.indislive
          FROM pg_catalog.pg_index ind
          JOIN pg_catalog.pg_class tbl ON tbl.oid = ind.indrelid
          JOIN pg_catalog.pg_namespace ns ON ns.oid = tbl.relnamespace
          JOIN pg_catalog.pg_class idx ON idx.oid = ind.indexrelid
          JOIN pg_catalog.pg_am am ON am.oid = idx.relam
          CROSS JOIN LATERAL unnest(ind.indkey) WITH ORDINALITY AS pos(attnum, ord)
          LEFT JOIN pg_catalog.pg_attribute att ON att.attrelid = tbl.oid AND att.attnum = pos.attnum
          LEFT JOIN pg_catalog.pg_collation coll ON coll.oid = CASE WHEN pos.ord <= ind.indnkeyatts THEN ind.indcollation[(pos.ord - 1)::int] ELSE 0 END
          LEFT JOIN pg_catalog.pg_namespace coll_ns ON coll_ns.oid = coll.collnamespace
          LEFT JOIN pg_catalog.pg_opclass opc ON opc.oid = CASE WHEN pos.ord <= ind.indnkeyatts THEN ind.indclass[(pos.ord - 1)::int] ELSE 0 END
          LEFT JOIN pg_catalog.pg_namespace opc_ns ON opc_ns.oid = opc.opcnamespace
          WHERE ns.nspname NOT IN ('pg_catalog','information_schema')
            AND ns.nspname !~ '^pg_toast'
            AND NOT EXISTS (
                SELECT 1 FROM pg_catalog.pg_constraint con
                WHERE con.conindid = ind.indexrelid AND con.contype IN ('p','u')
            )
          ORDER BY ns.nspname, tbl.relname, idx.relname, pos.ord`)
          \tif err != nil { return nil, err }
          \tdefer rows.Close()
          \tvar out []IndexMeta
          \tbyKey := map[string]int{}
          \tfor rows.Next() {
          \t\tvar schema, table, name, method, column, expression, collation, opclass, predicate string
          \t\tvar unique, descending, nullsFirst, nullsNotDistinct, valid, ready, live bool
          \t\tvar ordinal, keyCount int
          \t\tif err := rows.Scan(&schema, &table, &name, &unique, &method, &ordinal, &keyCount, &column, &expression, &collation, &opclass, &descending, &nullsFirst, &predicate, &nullsNotDistinct, &valid, &ready, &live); err != nil { return nil, err }
          \t\tk := schema + "." + table + "." + name
          \t\ti, ok := byKey[k]
          \t\tif !ok {
          \t\t\tout = append(out, IndexMeta{Schema: schema, Table: table, Name: name, Unique: unique, NullsNotDistinct: nullsNotDistinct, Method: method, Predicate: predicate, Valid: valid, Ready: ready, Live: live})
          \t\t\ti = len(out) - 1; byKey[k] = i
          \t\t}
          \t\tif ordinal <= keyCount {
          \t\t\tout[i].Keys = append(out[i].Keys, IndexKeyMeta{Column: column, Expression: expression, Collation: collation, OperatorClass: opclass, Descending: descending, NullsFirst: nullsFirst})
          \t\t} else if column != "" {
          \t\t\tout[i].IncludedColumns = append(out[i].IncludedColumns, column)
          \t\t}
          \t}
          \treturn out, rows.Err()
          }
          '''
          text, n = re.subn(r'''func \(r SQLCatalogReader\) Indexes\(ctx context\.Context\) \(\[\]IndexMeta, error\) \{.*\Z''', new_indexes, text, count=1, flags=re.S)
          if n != 1: raise SystemExit('sql catalog index replacement failed')
          sql_catalog.write_text(text)
          PY
          gofmt -w internal/database/providers/postgres/catalog.go internal/database/providers/postgres/provider.go internal/database/providers/postgres/provider_test.go internal/database/providers/postgres/sql_catalog.go internal/database/persistence/realize.go internal/database/migration/render.go internal/database/schemadiff/diff.go
      - name: Internal database tests
        run: go test ./internal/database/...
      - name: Commit core model migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/database
          git commit -m "Issue #50 Advanced Index CoreとPostgreSQL catalogを移行する"
          git push
