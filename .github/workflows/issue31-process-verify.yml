name: Verify Issue 31 real process runtime

on:
  push:
    branches:
      - work/issue-31-real-process-runtime
    paths:
      - .github/workflows/issue31-process-verify.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/issue-31-real-process-runtime
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Update M0.24 documentation
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, got {count}: {old[:160]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "docs/architecture.md",
              '''process PluginではResource Broker、Permission Grant、Resource Lease、Sandbox Profile、Host Lease Supervisor、Ownership / Fencingを通して実行します。\n\nM0.22.1で直接検証している境界とテストの対応は、[Plugin / Runtime境界のConformance](conformance/plugin-runtime-m0.22.1.md) に整理しています。''',
              '''process PluginではResource Broker、Permission Grant、Resource Lease、Sandbox Profile、Host Lease Supervisor、Ownership / Fencingを通して実行します。\n\nM0.24では`StdioProcessLauncher`をReference Host adapterとして追加し、`exec.CommandContext`でactual child processを起動してRequest / Response JSONをstdioで交換します。commandは一つのexecutable名/pathとして扱い、shell展開や空白からのargv推測は行いません。plain process launcherはsandboxではなく、`sandbox required`の実行には引き続きHost Sandboxのpolicy enforcerが必要です。\n\nこのone-shot local process境界とDurable reattachは別です。OS PIDをDurable Runtime Handleとはみなさず、cross-host reattachにはopaque durable handleを提供する外部runtime adapterが必要です。詳細は [M0.24実process Conformance](conformance/process-runtime-m0.24.md) を参照してください。\n\nM0.22.1で直接検証している境界とテストの対応は、[Plugin / Runtime境界のConformance](conformance/plugin-runtime-m0.22.1.md) に整理しています。''',
          )

          replace_once(
              "docs/getting-started.md",
              '''## 6. Runtime reattach example\n\n```bash\ngo run ./examples/runtime-reattach\n```''',
              '''## 6. 実process Pluginの参照例\n\nM0.24では、Reference Pluginを実際のOS child processとして起動できます。まずhelper binaryをbuildします。\n\n```bash\ngo build -o /tmp/tei-reference-process-plugin ./tools/reference-process-plugin\n```\n\n次に、既存`DeploymentExecutor` adapterからstdio processへcommandを渡します。\n\n```bash\ngo run ./examples/process-plugin \\\n  -plugin /tmp/tei-reference-process-plugin\n```\n\n出力の`outcome`は`accepted`、Plugin Invocationの`boundary`は`process`になります。`accepted`はexecutor acknowledgementであり、外部stateの完成証明ではありません。\n\nこの例はone-shot local processです。PIDをDurable Runtime Handleとして扱わず、Host restart / cross-host reattachを実現したとはみなしません。詳細は [M0.24実process Conformance](conformance/process-runtime-m0.24.md) を参照してください。\n\n## 7. Runtime reattach example\n\n```bash\ngo run ./examples/runtime-reattach\n```''',
          )

          replace_once(
              "docs/status.md",
              '''## 継続的な検証\n''',
              '''## M0.24 実process Plugin runtime\n\nM0.24では、`BoundaryProcess`をHost注入interfaceだけに留めず、actual OS child processへ接続する最小vertical sliceを実装しました。\n\n- `StdioProcessLauncher`でRequest / Response JSONをstdio transport\n- commandは単一executable名/pathとして実行し、shell semanticsを暗黙に導入しない\n- context cancellationで直接child processを終了\n- malformed / oversized responseを拒否\n- untrusted stdoutをReference default 8 MiBでbounded capture\n- stderr本文をTEI errorへコピーせず、異常終了時はbyte数とSHA-256だけを保持\n- forged Plugin identityを既存Registry validationで拒否\n- `tools/reference-process-plugin`を実binaryとしてbuild可能\n- `examples/process-plugin`でDeploymentExecutor → Registry → actual child processまで再現\n- Plugin Invocation provenanceで`boundary=process`を検証\n\n`StdioProcessLauncher`はplain process transportでありOS sandboxそのものではありません。`SandboxedProcessRunner`として再利用する場合も、policy適用は`HostSandboxLauncher`側の責務です。\n\nまた、このone-shot local processのPIDをDurable Runtime Handleとはみなしません。Host restart / cross-host reattachはM0.22 / ADR-0005のopaque durable handle契約を満たす別runtime adapterの責務として残します。詳細は [M0.24実process Conformance](conformance/process-runtime-m0.24.md) を参照してください。\n\n## 継続的な検証\n''',
          )

          replace_once(
              "docs/status.md",
              '''- Deployment executorの参照例が動作すること\n- runtime reattachの参照例が動作すること''',
              '''- Deployment executorの参照例が動作すること\n- Reference process Pluginを実binaryへbuildできること\n- DeploymentExecutorからactual child processへstdio protocolで到達できること\n- runtime reattachの参照例が動作すること''',
          )

          replace_once(
              "docs/status.md",
              '''- Database lifecycleの実DB integration\n- Plugin / Runtimeの実process integration\n- Deploymentのexternal executor integration\n- Source Indexを利用するGUI / LSP authoring experience''',
              '''- Database lifecycleの実DB integration\n- durable process manager / container runtimeとのcross-host reattach integration\n- production-grade Host sandbox / process isolation adapter\n- Deploymentの外部実環境executor integration\n- Source Indexを利用するGUI / LSP authoring experience''',
          )

      - name: Format
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l internal/plugin/runtime/process_stdio.go internal/plugin/runtime/process_stdio_test.go tools/reference-process-plugin examples/process-plugin)"
          if [[ -n "$files" ]]; then
            echo "$files"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build reference process plugin
        run: go build -o /tmp/tei-reference-process-plugin ./tools/reference-process-plugin
      - name: Run DeploymentExecutor through real process
        shell: bash
        run: |
          set -euo pipefail
          go run ./examples/process-plugin -plugin /tmp/tei-reference-process-plugin > /tmp/process-result.json
          grep -q '"outcome": "accepted"' /tmp/process-result.json
          grep -q '"boundary": "process"' /tmp/process-result.json
          grep -q 'reference-process://reference-process-command-1' /tmp/process-result.json
      - name: Verify documentation
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'StdioProcessLauncher' docs/architecture.md docs/status.md docs/conformance/process-runtime-m0.24.md
          grep -q '実process Pluginの参照例' docs/getting-started.md
          grep -q 'PIDをDurable Runtime Handle' docs/status.md docs/getting-started.md

      - name: Commit documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture.md docs/getting-started.md docs/status.md
          git commit -m "M0.24実process runtimeの文書境界を追加する"
          git push origin HEAD:work/issue-31-real-process-runtime
