name: 一時的にQuery result mapping Validationを共通入口へ接続

on:
  push:
    branches:
      - work/query-result-mapping-runtime
    paths:
      - .github/workflows/tmp-connect-query-result-validation.yml

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-24.04
    steps:
      - name: Repositoryを取得
        uses: actions/checkout@v7
        with:
          ref: work/query-result-mapping-runtime
      - name: validation.Validateへ最小差分で接続
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("internal/validation/validation.go")
          text = path.read_text()
          before = '''func Validate(w ir.World) []Diagnostic {
          	out := validateApplicationPatterns(w)
          	out = append(out, validateSemanticBusinessValidations(w)...)
          '''
          after = '''func Validate(w ir.World) []Diagnostic {
          	out := validateApplicationPatterns(w)
          	out = append(out, validateQueryResultMappings(w)...)
          	out = append(out, validateSemanticBusinessValidations(w)...)
          '''
          if before not in text:
              raise SystemExit("validation.Validateの想定箇所が一致しません")
          path.write_text(text.replace(before, after, 1))
          PY
          gofmt -w internal/validation/validation.go
      - name: 差分をbranchへ反映
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/validation/validation.go
          git commit -m "Query result mapping Validationを共通Validateへ接続する"
          git push origin HEAD:work/query-result-mapping-runtime
