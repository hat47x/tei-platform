name: Capability Outcome基盤の安全な接続

on:
  push:
    branches:
      - work/capability-outcome-core

permissions:
  contents: write

jobs:
  update-capability-outcome-core:
    if: ${{ !contains(github.event.head_commit.message, '[capability-outcome-core-generated]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Repositoryを取得
        uses: actions/checkout@v7
        with:
          ref: work/capability-outcome-core

      - name: Goを準備
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Outcome基盤を最小差分で接続
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: replacement target count={count}, want=1")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "internal/syntax/parser.go",
              '''\t\tcase "output":
          \t\t\t_, _ = p.next()
          \t\t\ttypeTok, err := p.expect(TokenIdent)
          \t\t\tif err != nil {
          \t\t\t\treturn c, err
          \t\t\t}
          \t\t\tc.Output, err = core.ParseCanonicalID(typeTok.Text)
          \t\t\tif err != nil {
          \t\t\t\treturn c, p.errAt(typeTok, err.Error())
          \t\t\t}
          \t\tdefault:
          \t\t\treturn c, p.errAt(t, "expected input or output")
          ''',
              '''\t\tcase "output":
          \t\t\t_, _ = p.next()
          \t\t\ttypeTok, err := p.expect(TokenIdent)
          \t\t\tif err != nil {
          \t\t\t\treturn c, err
          \t\t\t}
          \t\t\tc.Output, err = core.ParseCanonicalID(typeTok.Text)
          \t\t\tif err != nil {
          \t\t\t\treturn c, p.errAt(typeTok, err.Error())
          \t\t\t}
          \t\tcase "outcome":
          \t\t\t_, _ = p.next()
          \t\t\tnameTok, err := p.expect(TokenIdent)
          \t\t\tif err != nil {
          \t\t\t\treturn c, err
          \t\t\t}
          \t\t\tname, err := core.ParseLocalName(nameTok.Text)
          \t\t\tif err != nil {
          \t\t\t\treturn c, p.errAt(nameTok, err.Error())
          \t\t\t}
          \t\t\tpayloadTok, err := p.expect(TokenIdent)
          \t\t\tif err != nil {
          \t\t\t\treturn c, err
          \t\t\t}
          \t\t\tpayload, err := core.ParseCanonicalID(payloadTok.Text)
          \t\t\tif err != nil {
          \t\t\t\treturn c, p.errAt(payloadTok, err.Error())
          \t\t\t}
          \t\t\tc.Outcomes = append(c.Outcomes, semantic.Outcome{Name: name, Payload: payload})
          \t\tdefault:
          \t\t\treturn c, p.errAt(t, "expected input, output, or outcome")
          ''',
          )

          replace_once(
              "internal/validation/validation.go",
              '''\t\tif c.Output != "" && !semanticValueTypeExists(c.Output) {
          \t\t\tout = append(out, errd("UNKNOWN_SEMANTIC_CAPABILITY_OUTPUT", "capability %s output refers to unknown semantic value type %s", c.ID, c.Output))
          \t\t}
          ''',
              '''\t\tif c.Output != "" && !semanticValueTypeExists(c.Output) {
          \t\t\tout = append(out, errd("UNKNOWN_SEMANTIC_CAPABILITY_OUTPUT", "capability %s output refers to unknown semantic value type %s", c.ID, c.Output))
          \t\t}
          \t\tif c.Output != "" && len(c.Outcomes) > 0 {
          \t\t\tout = append(out, errd("SEMANTIC_CAPABILITY_OUTPUT_OUTCOME_CONFLICT", "capability %s cannot declare both output and named outcomes", c.ID))
          \t\t}
          \t\tseenOutcomes := map[core.LocalName]struct{}{}
          \t\tfor _, outcome := range c.Outcomes {
          \t\t\tif _, dup := seenOutcomes[outcome.Name]; dup {
          \t\t\t\tout = append(out, errd("DUPLICATE_SEMANTIC_CAPABILITY_OUTCOME", "capability %s declares outcome %s more than once", c.ID, outcome.Name))
          \t\t\t}
          \t\t\tseenOutcomes[outcome.Name] = struct{}{}
          \t\t\tif !semanticValueTypeExists(outcome.Payload) {
          \t\t\t\tout = append(out, errd("UNKNOWN_SEMANTIC_CAPABILITY_OUTCOME_PAYLOAD", "capability %s outcome %s refers to unknown semantic value type %s", c.ID, outcome.Name, outcome.Payload))
          \t\t\t}
          \t\t}
          ''',
          )

          replace_once(
              "internal/workspace/loader.go",
              '''\t\tsort.Slice(w.Semantics[i].Capabilities, func(a, b int) bool { return w.Semantics[i].Capabilities[a].ID < w.Semantics[i].Capabilities[b].ID })
          ''',
              '''\t\tfor j := range w.Semantics[i].Capabilities {
          \t\t\tsort.Slice(w.Semantics[i].Capabilities[j].Outcomes, func(a, b int) bool {
          \t\t\t\treturn w.Semantics[i].Capabilities[j].Outcomes[a].Name < w.Semantics[i].Capabilities[j].Outcomes[b].Name
          \t\t\t})
          \t\t}
          \t\tsort.Slice(w.Semantics[i].Capabilities, func(a, b int) bool { return w.Semantics[i].Capabilities[a].ID < w.Semantics[i].Capabilities[b].ID })
          ''',
          )
          PY

          gofmt -w \
            internal/semantic/model.go \
            internal/syntax/parser.go \
            internal/syntax/capability_outcome_test.go \
            internal/validation/validation.go \
            internal/validation/capability_outcome_test.go \
            internal/workspace/loader.go \
            internal/workspace/capability_outcome_normalization_test.go

          go test ./internal/syntax ./internal/validation ./internal/workspace

      - name: 変更をbranchへ反映
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/semantic/model.go internal/syntax/parser.go internal/syntax/capability_outcome_test.go internal/validation/validation.go internal/validation/capability_outcome_test.go internal/workspace/loader.go internal/workspace/capability_outcome_normalization_test.go
          if git diff --cached --quiet; then
            echo "反映すべき差分がありません。"
            exit 0
          fi
          git commit -m "Capability Outcome基盤をParser・Validation・Normalizationへ接続する [capability-outcome-core-generated]"
          git push origin HEAD:work/capability-outcome-core
