name: Apply Issue 50 advanced index core model

on:
  push:
    branches: [work/issue-50-core-model]
    paths:
      - .github/workflows/issue50-core-model-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Core model dependenciesを移行
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"replacement target not found: {path}")
              if text.count(old) != 1:
                  raise SystemExit(f"replacement target is not unique: {path} count={text.count(old)}")
              p.write_text(text.replace(old, new))

          replace('internal/database/providers/postgres/catalog.go', '''type IndexMeta struct {
          \tSchema  string
          \tTable   string
          \tName    string
          \tColumns []string
          \tUnique  bool
          \tMethod  string
          }
          ''', '''type IndexKeyMeta struct {
          \tColumn        string
          \tExpression    string
          \tCollation     string
          \tOperatorClass string
          \tDescending    bool
          \tNullsFirst    bool
          }

          type IndexMeta struct {
          \tSchema            string
          \tTable             string
          \tName              string
          \tKeys              []IndexKeyMeta
          \tIncludedColumns   []string
          \tPredicate         string
          \tUnique            bool
          \tNullsNotDistinct  bool
          \tMethod            string
          \tValid             bool
          \tReady             bool
          \tLive              bool
          }
          ''')

          replace('internal/database/providers/postgres/provider.go', '''\tfor _, meta := range indexes {
          \t\tif i, ok := byName[key(meta.Schema, meta.Table)]; ok {
          \t\t\tt := &snapshot.Tables[i]
          \t\t\tt.Indexes = append(t.Indexes, physical.Index{Name: meta.Name, Columns: append([]string(nil), meta.Columns...), Unique: meta.Unique, Method: meta.Method})
          \t\t}
          }
          ''', '''\tfor _, meta := range indexes {
          \t\tif i, ok := byName[key(meta.Schema, meta.Table)]; ok {
          \t\t\tt := &snapshot.Tables[i]
          \t\t\tindex := physical.Index{
          \t\t\t\tName:            meta.Name,
          \t\t\t\tIncludedColumns: append([]string(nil), meta.IncludedColumns...),
          \t\t\t\tUnique:          meta.Unique,
          \t\t\t\tMethod:          meta.Method,
          \t\t\t\tState:           &physical.IndexState{Valid: meta.Valid, Ready: meta.Ready, Live: meta.Live},
          \t\t\t}
          \t\t\tif meta.Unique {
          \t\t\t\tindex.UniqueNullTreatment = physical.UniqueNullsDistinct
          \t\t\t\tif meta.NullsNotDistinct {
          \t\t\t\t\tindex.UniqueNullTreatment = physical.UniqueNullsNotDistinct
          \t\t\t\t}
          \t\t\t}
          \t\t\tif meta.Predicate != "" {
          \t\t\t\tindex.Predicate = &physical.ProviderExpression{Provider: string(environment.ProviderPostgres), Source: meta.Predicate}
          \t\t\t}
          \t\t\tfor _, keyMeta := range meta.Keys {
          \t\t\t\tkey := physical.IndexKey{
          \t\t\t\t\tColumn:        keyMeta.Column,
          \t\t\t\t\tCollation:     keyMeta.Collation,
          \t\t\t\t\tOperatorClass: keyMeta.OperatorClass,
          \t\t\t\t\tOrder:         physical.IndexOrderAsc,
          \t\t\t\t\tNullsOrder:    physical.IndexNullsLast,
          \t\t\t\t}
          \t\t\t\tif keyMeta.Expression != "" {
          \t\t\t\t\tkey.Column = ""
          \t\t\t\t\tkey.Expression = &physical.ProviderExpression{Provider: string(environment.ProviderPostgres), Source: keyMeta.Expression}
          \t\t\t\t}
          \t\t\t\tif keyMeta.Descending {
          \t\t\t\t\tkey.Order = physical.IndexOrderDesc
          \t\t\t\t}
          \t\t\t\tif keyMeta.NullsFirst {
          \t\t\t\t\tkey.NullsOrder = physical.IndexNullsFirst
          \t\t\t\t}
          \t\t\t\tindex.Keys = append(index.Keys, key)
          \t\t\t}
          \t\t\tt.Indexes = append(t.Indexes, index)
          \t\t}
          }
          ''')

          replace('internal/database/persistence/realize.go', '''\t\tfor _, idx := range m.Indexes {
          \t\t\tpi := physical.Index{Name: idx.Name, Unique: idx.Unique, Method: defaultIndexMethod(provider)}
          \t\t\tfor _, attr := range idx.Attributes {
          \t\t\t\tname, ok := columnByAttribute[attr]
          \t\t\t\tif !ok {
          \t\t\t\t\treturn physical.SchemaSnapshot{}, fmt.Errorf("mapping %s index %s attribute %s has no column mapping", m.ID, idx.Name, attr)
          \t\t\t\t}
          \t\t\t\tpi.Columns = append(pi.Columns, name)
          \t\t\t}
          \t\t\tt.Indexes = append(t.Indexes, pi)
          \t\t}
          ''', '''\t\tfor _, idx := range m.Indexes {
          \t\t\tpi := physical.Index{Name: idx.Name, Unique: idx.Unique, Method: defaultIndexMethod(provider)}
          \t\t\tif idx.Unique && provider == environment.ProviderPostgres {
          \t\t\t\tpi.UniqueNullTreatment = physical.UniqueNullsDistinct
          \t\t\t}
          \t\t\tfor _, attr := range idx.Attributes {
          \t\t\t\tname, ok := columnByAttribute[attr]
          \t\t\t\tif !ok {
          \t\t\t\t\treturn physical.SchemaSnapshot{}, fmt.Errorf("mapping %s index %s attribute %s has no column mapping", m.ID, idx.Name, attr)
          \t\t\t\t}
          \t\t\t\tkey := physical.IndexKey{Column: name}
          \t\t\t\tif provider == environment.ProviderPostgres {
          \t\t\t\t\tkey.Order = physical.IndexOrderAsc
          \t\t\t\t\tkey.NullsOrder = physical.IndexNullsLast
          \t\t\t\t}
          \t\t\t\tpi.Keys = append(pi.Keys, key)
          \t\t\t}
          \t\t\tt.Indexes = append(t.Indexes, pi)
          \t\t}
          ''')

          replace('internal/database/migration/render.go', '''\t\tcase schemadiff.AddIndex:
          \t\t\tif c.Index == nil {
          \t\t\t\treturn nil, fmt.Errorf("add-index %s has no index", c.Table)
          \t\t\t}
          \t\t\tunique := ""
          \t\t\tif c.Index.Unique {
          \t\t\t\tunique = "UNIQUE "
          \t\t\t}
          \t\t\tout = append(out, fmt.Sprintf("CREATE %sINDEX %s ON %s%s (%s);", unique, qid(c.Index.Name), qname(c.Table), indexMethod(c.Index), joinIDs(c.Index.Columns)))
          ''', '''\t\tcase schemadiff.AddIndex:
          \t\t\tif c.Index == nil {
          \t\t\t\treturn nil, fmt.Errorf("add-index %s has no index", c.Table)
          \t\t\t}
          \t\t\tcolumns, err := simpleIndexColumns(c.Index)
          \t\t\tif err != nil {
          \t\t\t\treturn nil, fmt.Errorf("add-index %s.%s: %w", c.Table, c.Index.Name, err)
          \t\t\t}
          \t\t\tunique := ""
          \t\t\tif c.Index.Unique {
          \t\t\t\tunique = "UNIQUE "
          \t\t\t}
          \t\t\tout = append(out, fmt.Sprintf("CREATE %sINDEX %s ON %s%s (%s);", unique, qid(c.Index.Name), qname(c.Table), indexMethod(c.Index), joinIDs(columns)))
          ''')

          replace('internal/database/migration/render.go', '''func indexMethod(i *physical.Index) string {
          ''', '''func simpleIndexColumns(i *physical.Index) ([]string, error) {
          \tif i.Predicate != nil || len(i.IncludedColumns) != 0 {
          \t\treturn nil, fmt.Errorf("advanced index rendering is not implemented")
          \t}
          \tcolumns := make([]string, 0, len(i.Keys))
          \tfor _, key := range i.Keys {
          \t\tif key.Expression != nil || strings.TrimSpace(key.Column) == "" || strings.TrimSpace(key.Collation) != "" || strings.TrimSpace(key.OperatorClass) != "" {
          \t\t\treturn nil, fmt.Errorf("advanced index key rendering is not implemented")
          \t\t}
          \t\tif key.Order != "" && key.Order != physical.IndexOrderDefault && key.Order != physical.IndexOrderAsc {
          \t\t\treturn nil, fmt.Errorf("advanced index ordering is not implemented")
          \t\t}
          \t\tif key.NullsOrder != "" && key.NullsOrder != physical.IndexNullsDefault && key.NullsOrder != physical.IndexNullsLast {
          \t\t\treturn nil, fmt.Errorf("advanced index NULL ordering is not implemented")
          \t\t}
          \t\tcolumns = append(columns, key.Column)
          \t}
          \treturn columns, nil
          }

          func indexMethod(i *physical.Index) string {
          ''')

          replace('internal/database/schemadiff/diff.go', '''\tAddIndex             ChangeKind = "add-index"
          \tDropIndex            ChangeKind = "drop-index"
          ''', '''\tAddIndex             ChangeKind = "add-index"
          \tDropIndex            ChangeKind = "drop-index"
          \tIndexStateDrift      ChangeKind = "index-state-drift"
          ''')

          replace('internal/database/schemadiff/diff.go', '''\t\t} else if dok && aok && !sameIndex(d, a) {
          \t\t\told := a
          \t\t\tnewi := d
          \t\t\tout = append(out, Change{Kind: DropIndex, Table: name, Index: &old}, Change{Kind: AddIndex, Table: name, Index: &newi})
          \t\t}
          ''', '''\t\t} else if dok && aok && !sameIndexStructure(d, a) {
          \t\t\told := a
          \t\t\tnewi := d
          \t\t\tout = append(out, Change{Kind: DropIndex, Table: name, Index: &old}, Change{Kind: AddIndex, Table: name, Index: &newi})
          \t\t} else if dok && aok && a.State != nil && !a.State.Usable() {
          \t\t\tobserved := a
          \t\t\tout = append(out, Change{Kind: IndexStateDrift, Table: name, Index: &observed})
          \t\t}
          ''')

          replace('internal/database/schemadiff/diff.go', '''func sameIndex(a, b physical.Index) bool {
          \treturn a.Unique == b.Unique && norm(a.Method) == norm(b.Method) && sameStrings(a.Columns, b.Columns)
          }
          ''', '''func sameIndexStructure(a, b physical.Index) bool {
          \tif a.Unique != b.Unique || norm(a.Method) != norm(b.Method) || a.UniqueNullTreatment != b.UniqueNullTreatment {
          \t\treturn false
          \t}
          \tif len(a.Keys) != len(b.Keys) || len(a.IncludedColumns) != len(b.IncludedColumns) {
          \t\treturn false
          \t}
          \tfor i := range a.Keys {
          \t\tif !sameIndexKey(a.Keys[i], b.Keys[i]) {
          \t\t\treturn false
          \t\t}
          \t}
          \tif !sameStrings(a.IncludedColumns, b.IncludedColumns) {
          \t\treturn false
          \t}
          \treturn sameProviderExpression(a.Predicate, b.Predicate)
          }

          func sameIndexKey(a, b physical.IndexKey) bool {
          \treturn norm(a.Column) == norm(b.Column) &&
          \t\tsameProviderExpression(a.Expression, b.Expression) &&
          \t\tnorm(a.Collation) == norm(b.Collation) &&
          \t\tnorm(a.OperatorClass) == norm(b.OperatorClass) &&
          \t\tnormalizeIndexOrder(a.Order) == normalizeIndexOrder(b.Order) &&
          \t\tnormalizeIndexNullsOrder(a.NullsOrder) == normalizeIndexNullsOrder(b.NullsOrder)
          }

          func sameProviderExpression(a, b *physical.ProviderExpression) bool {
          \tif a == nil || b == nil {
          \t\treturn a == nil && b == nil
          \t}
          \treturn norm(a.Provider) == norm(b.Provider) && strings.TrimSpace(a.Source) == strings.TrimSpace(b.Source)
          }

          func normalizeIndexOrder(v physical.IndexOrder) physical.IndexOrder {
          \tif v == "" {
          \t\treturn physical.IndexOrderDefault
          \t}
          \treturn v
          }

          func normalizeIndexNullsOrder(v physical.IndexNullsOrder) physical.IndexNullsOrder {
          \tif v == "" {
          \t\treturn physical.IndexNullsDefault
          \t}
          \treturn v
          }
          ''')

          replace('internal/database/providers/postgres/provider_test.go', '''func (fakeCatalog) Indexes(context.Context) ([]postgres.IndexMeta, error) {
          \treturn []postgres.IndexMeta{{Schema: "public", Table: "orders", Name: "orders_customer_idx", Columns: []string{"customer_id"}, Method: "btree"}}, nil
          }
          ''', '''func (fakeCatalog) Indexes(context.Context) ([]postgres.IndexMeta, error) {
          \treturn []postgres.IndexMeta{{
          \t\tSchema: "public", Table: "orders", Name: "orders_customer_idx", Method: "btree",
          \t\tKeys: []postgres.IndexKeyMeta{{Column: "customer_id"}},
          \t\tValid: true, Ready: true, Live: true,
          \t}}, nil
          }
          ''')
          PY
          gofmt -w internal/database/providers/postgres/catalog.go internal/database/providers/postgres/provider.go internal/database/providers/postgres/provider_test.go internal/database/persistence/realize.go internal/database/migration/render.go internal/database/schemadiff/diff.go
      - name: Internal database tests
        run: go test ./internal/database/...
      - name: Commit core model migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/database
          git commit -m "Issue #50 Advanced Index Core modelへ移行する"
          git push
