name: TEI Windows go test 範囲確認

# Issue #2319。Windows固有の分岐を持つパッケージで、go testの通過・失敗・Skipの件数を記録する。
# 全PRへの必須検査にはしない（AGENTS.md、#1189）。手動起動と、このファイル自身の変更時だけ動く。
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tei-windows-go-test-survey.yml
  workflow_dispatch:
    inputs:
      scope:
        description: 'survey=固定7パッケージ（既定、約30分） / full=./... 全体（約90分）'
        type: choice
        options: [survey, full]
        default: survey

permissions:
  contents: read

concurrency:
  group: tei-windows-go-test-survey-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-go-test:
    runs-on: windows-2025
    # The survey list takes about 30 minutes; a full `./...` run takes about 90.
    # The bound is one value because the repository requires every job to state
    # a literal limit (tools/ci-workflows-test.py).
    timeout-minutes: 120
    env:
      GOENV: off
      GOWORK: off
      GOFLAGS: ''
      GOTOOLCHAIN: local
      SCOPE_INPUT: ${{ inputs.scope }}
    steps:
      - name: 対象のGit版を取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 固定Go版をWindowsで用意
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false

      - name: checkoutの行末とダイジェストを記録
        shell: pwsh
        run: |
          # The Windows runner may check text files out with CRLF, which changes
          # the bytes a digest comparison sees. Record what this checkout
          # actually contains so a Windows-only failure can be told apart from a
          # real regression (#3783).
          "core.autocrlf=$(git config --get core.autocrlf)"
          "core.eol=$(git config --get core.eol)"
          $crlf = (git ls-files --eol | Select-String -Pattern 'i/crlf' | Measure-Object).Count
          $lf = (git ls-files --eol | Select-String -Pattern 'i/lf' | Measure-Object).Count
          "index: crlf=$crlf lf=$lf"
          foreach ($path in @('tools/reference-generator-selection/testdata/line-amount/contract.json', 'plan/adr/README.md', 'tools/reference-target-profile/testdata/server.json')) {
            if (Test-Path $path) {
              $hash = (Get-FileHash -Algorithm SHA256 -Path $path).Hash.ToLower()
              $bytes = [System.IO.File]::ReadAllBytes($path)
              $crlfInFile = ([regex]::Matches([System.Text.Encoding]::UTF8.GetString($bytes), "`r`n")).Count
              "$path sha256=$hash bytes=$($bytes.Length) crlf_pairs=$crlfInFile"
            }
          }

      - name: 対象パッケージのgo testを実行
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((go env GOOS).Trim() -ne 'windows') { throw 'Not running native Windows Go' }
          # The finite list below is where a Windows-specific failure is worth
          # watching on every PR. `./...` on Windows now passes (#3460), but a
          # full run takes 90 minutes, so it is the `full` dispatch scope; the
          # survey covers the packages whose Windows-only branches the code
          # actually uses.
          $packages = @('./internal/plugin/runtime', './internal/desktophost', './internal/operations', './cmd/tei', './internal/workspace', './internal/modelref', './reference/application-composition', './tools/reference-developer-context', './tools/reference-build-catalog-authoring', './tools/reference-gate-b-final-evidence', './tools/reference-target-package-evidence', './tools/reference-generator-selection')
          $scope = "$env:SCOPE_INPUT".Trim()
          if ($scope -eq 'full') {
            # `./...` includes every package, so it replaces the survey list
            # rather than being appended to it.
            $packages = @('./...')
            Write-Host 'scope=full: running go test ./...'
          } else {
            Write-Host 'scope=survey: running the fixed package list'
          }
          # 失敗があっても集計まで進める。終了コードは最後の工程で判定する。
          $timeoutArg = if ($scope -eq 'full') { '90m' } else { '30m' }
          go test -json -count=1 -timeout $timeoutArg @packages > "$env:RUNNER_TEMP/gotest.jsonl"
          $code = $LASTEXITCODE
          "GOTEST_EXIT=$code" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          exit 0

      - name: 通過・失敗・Skipを集計
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $events = Get-Content "$env:RUNNER_TEMP/gotest.jsonl" | ForEach-Object { try { $_ | ConvertFrom-Json } catch { $null } } | Where-Object { $_ }
          $tests = $events | Where-Object { $_.Test -and $_.Action -in @('pass', 'fail', 'skip') }
          $lines = @()
          $lines += "## Windows go test 集計 (commit $env:GITHUB_SHA)"
          $lines += ''
          $lines += '| package | pass | fail | skip |'
          $lines += '|---|---|---|---|'
          foreach ($g in ($tests | Group-Object Package)) {
            $c = @{ pass = 0; fail = 0; skip = 0 }
            foreach ($t in $g.Group) { $c[$t.Action]++ }
            $lines += "| $($g.Name) | $($c.pass) | $($c.fail) | $($c.skip) |"
          }
          $lines += ''
          $lines += '### Skip理由（テストごと）'
          $skips = $tests | Where-Object { $_.Action -eq 'skip' }
          foreach ($s in $skips) {
            $reason = ($events | Where-Object { $_.Package -eq $s.Package -and $_.Test -eq $s.Test -and $_.Action -eq 'output' -and $_.Output -notmatch '^\s*(=== |--- )' } | ForEach-Object { $_.Output.Trim() }) -join ' / '
            $lines += "- $($s.Package) $($s.Test): $reason"
          }
          $lines += ''
          $lines += '### 失敗'
          foreach ($f in ($tests | Where-Object { $_.Action -eq 'fail' })) {
            $lines += "- $($f.Package) $($f.Test)"
            $out = $events | Where-Object { $_.Package -eq $f.Package -and $_.Test -eq $f.Test -and $_.Action -eq 'output' -and $_.Output -notmatch '^\s*(=== |--- )' } | Select-Object -First 8 | ForEach-Object { '    ' + $_.Output.TrimEnd() }
            $lines += $out
          }
          $pkgFail = $events | Where-Object { -not $_.Test -and $_.Action -eq 'fail' }
          foreach ($f in $pkgFail) { $lines += "- (package) $($f.Package)" }
          $lines | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          $lines | ForEach-Object { Write-Host $_ }

      - name: 結果を判定
        shell: pwsh
        run: |
          # PRではworkflow定義の確認だけが目的なので、試験失敗は集計に残して成功扱いにする。手動起動では失敗を失敗として返す。
          if ($env:GOTEST_EXIT -ne '0' -and $env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { throw "go test exit code $env:GOTEST_EXIT (集計は上の工程を参照)" }
