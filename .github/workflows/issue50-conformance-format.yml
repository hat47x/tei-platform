name: Format and verify Issue 50 conformance

on:
  push:
    branches: [work/issue-50-core-model]
    paths:
      - .github/workflows/issue50-conformance-format.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Conformanceテストを整形
        run: gofmt -w internal/database/schemadiff/advanced_index_test.go internal/database/providers/postgres/advanced_index_test.go
      - name: 整形をcommit
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/database/schemadiff/advanced_index_test.go internal/database/providers/postgres/advanced_index_test.go
            git commit -m "Issue #50 Advanced Index Conformanceを整形する"
            git push
          fi
      - run: go vet ./...
      - run: go test ./...
