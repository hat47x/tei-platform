name: Apply Issue 33 process argv model

on:
  push:
    branches:
      - work/issue-33-process-argv
    paths:
      - .github/workflows/issue33-process-argv-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/issue-33-process-argv
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Apply executable and argv model
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, got {count}: {old[:180]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "internal/plugin/model.go",
              '''type Runtime struct {\n\tKind    RuntimeKind   `json:"kind"`\n\tCommand string        `json:"command,omitempty"`\n\tSandbox SandboxPolicy `json:"sandbox,omitempty"`\n}''',
              '''type Runtime struct {\n\tKind    RuntimeKind   `json:"kind"`\n\tCommand string        `json:"command,omitempty"`\n\tArgs    []string      `json:"args,omitempty"`\n\tSandbox SandboxPolicy `json:"sandbox,omitempty"`\n}''',
          )

          replace_once(
              "internal/plugin/runtime/model.go",
              '''\tCommand               string               `json:"command,omitempty"`\n\tSandboxPolicy         plugin.SandboxPolicy `json:"sandboxPolicy,omitempty"`''',
              '''\tCommand               string               `json:"command,omitempty"`\n\tArgs                  []string             `json:"args,omitempty"`\n\tSandboxPolicy         plugin.SandboxPolicy `json:"sandboxPolicy,omitempty"`''',
          )
          replace_once(
              "internal/plugin/runtime/model.go",
              '''\t\tpr := PluginRuntime{Plugin: ident, DescriptorFingerprint: plugin.DefinitionFingerprint(d), Command: d.Runtime.Command, SandboxPolicy: d.Runtime.Sandbox, Artifact: d.Artifact}''',
              '''\t\tpr := PluginRuntime{Plugin: ident, DescriptorFingerprint: plugin.DefinitionFingerprint(d), Command: d.Runtime.Command, Args: append([]string(nil), d.Runtime.Args...), SandboxPolicy: d.Runtime.Sandbox, Artifact: d.Artifact}''',
          )
          replace_once(
              "internal/plugin/runtime/model.go",
              '''// ProcessLauncher is supplied by the TEI host. M0.15 deliberately does not\n// execute arbitrary workspace process commands by itself. A host may implement\n// a stdio process protocol, container boundary, or stronger sandbox later.\ntype ProcessLauncher interface {\n\tInvoke(context.Context, string, Request) (Response, error)\n}''',
              '''// ProcessCommand preserves executable and argv as separate values across the\n// Host boundary. It is never a shell command line and must not be reparsed by\n// ProcessLauncher implementations.\ntype ProcessCommand struct {\n\tExecutable string   `json:"executable"`\n\tArgs       []string `json:"args,omitempty"`\n}\n\n// ProcessLauncher is supplied by the TEI host. It receives a structured\n// executable/argv pair so hosts cannot silently introduce shell semantics.\ntype ProcessLauncher interface {\n\tInvoke(context.Context, ProcessCommand, Request) (Response, error)\n}''',
          )
          replace_once(
              "internal/plugin/runtime/model.go",
              '''type SandboxSpec struct {\n\tCommand         string                  `json:"command"`''',
              '''type SandboxSpec struct {\n\tCommand         ProcessCommand          `json:"command"`''',
          )
          replace_once(
              "internal/plugin/runtime/model.go",
              '''\t\tif r.Sandboxes != nil && (policy == plugin.SandboxRequired || policy == plugin.SandboxPreferred) {\n\t\t\tprov.Sandboxed = true\n\t\t\tresp, err = r.Sandboxes.Invoke(ctx, SandboxSpec{Command: pr.Command, Plugin: cr.Plugin, Artifact: pr.Artifact, Permissions: req.Permissions, ResourceLease: lease, LeaseController: leaseControl, LeasePolicy: cr.LeasePolicy, Profile: sandboxProfile(lease)}, req)''',
              '''\t\tprocessCommand := ProcessCommand{Executable: pr.Command, Args: append([]string(nil), pr.Args...)}\n\t\tif r.Sandboxes != nil && (policy == plugin.SandboxRequired || policy == plugin.SandboxPreferred) {\n\t\t\tprov.Sandboxed = true\n\t\t\tresp, err = r.Sandboxes.Invoke(ctx, SandboxSpec{Command: processCommand, Plugin: cr.Plugin, Artifact: pr.Artifact, Permissions: req.Permissions, ResourceLease: lease, LeaseController: leaseControl, LeasePolicy: cr.LeasePolicy, Profile: sandboxProfile(lease)}, req)''',
          )
          replace_once(
              "internal/plugin/runtime/model.go",
              '''\t\t\tresp, err = r.Processes.Invoke(ctx, pr.Command, req)''',
              '''\t\t\tresp, err = r.Processes.Invoke(ctx, processCommand, req)''',
          )

          replace_once(
              "internal/plugin/runtime/host_sandbox.go",
              '''type SandboxedProcessRunner interface {\n\tInvokeSandboxed(context.Context, string, Request) (Response, error)\n}''',
              '''type SandboxedProcessRunner interface {\n\tInvokeSandboxed(context.Context, ProcessCommand, Request) (Response, error)\n}''',
          )

          p = Path("internal/plugin/runtime/process_stdio.go")
          text = p.read_text()
          text = text.replace(
              '''// ProcessLauncher. Command is treated as one executable name/path exactly as\n// supplied. It is never passed through a shell and is never whitespace-split\n// into argv elements.''',
              '''// ProcessLauncher. Executable and argv are kept separate exactly as supplied.\n// They are never passed through a shell and are never re-split or re-quoted.''',
          )
          text = text.replace(
              '''func (l StdioProcessLauncher) InvokeSandboxed(ctx context.Context, command string, req Request) (Response, error) {\n\treturn l.Invoke(ctx, command, req)\n}\n\nfunc (l StdioProcessLauncher) Invoke(ctx context.Context, command string, req Request) (Response, error) {''',
              '''func (l StdioProcessLauncher) InvokeSandboxed(ctx context.Context, command ProcessCommand, req Request) (Response, error) {\n\treturn l.Invoke(ctx, command, req)\n}\n\nfunc (l StdioProcessLauncher) Invoke(ctx context.Context, command ProcessCommand, req Request) (Response, error) {''',
          )
          text = text.replace('''\tif strings.TrimSpace(command) == "" {\n\t\treturn Response{}, fmt.Errorf("process plugin command is empty")\n\t}''', '''\tif strings.TrimSpace(command.Executable) == "" {\n\t\treturn Response{}, fmt.Errorf("process plugin executable is empty")\n\t}\n\tif strings.ContainsAny(command.Executable, " \\t\\r\\n") {\n\t\treturn Response{}, fmt.Errorf("process plugin executable must be a single name/path; use argv for arguments")\n\t}''')
          text = text.replace('''\tcmd := exec.CommandContext(ctx, command)''', '''\tcmd := exec.CommandContext(ctx, command.Executable, command.Args...)''')
          text = text.replace('''fmt.Errorf("process plugin %q canceled: %w", command, ctxErr)''', '''fmt.Errorf("process plugin executable %q canceled: %w", command.Executable, ctxErr)''')
          text = text.replace('''processExecutionError(command, err, stderr)''', '''processExecutionError(command.Executable, err, stderr)''')
          text = text.replace('''fmt.Errorf("process plugin %q response exceeds %d bytes", command, limit)''', '''fmt.Errorf("process plugin executable %q response exceeds %d bytes", command.Executable, limit)''')
          text = text.replace('''fmt.Errorf("decode process plugin response from %q: %w", command, err)''', '''fmt.Errorf("decode process plugin response from executable %q: %w", command.Executable, err)''')
          text = text.replace('''fmt.Errorf("process plugin %q returned more than one JSON value", command)''', '''fmt.Errorf("process plugin executable %q returned more than one JSON value", command.Executable)''')
          text = text.replace('''fmt.Errorf("decode trailing process plugin output from %q: %w", command, err)''', '''fmt.Errorf("decode trailing process plugin output from executable %q: %w", command.Executable, err)''')
          p.write_text(text)

          replace_once(
              "internal/syntax/parser.go",
              '''\t\t\td.Runtime.Kind = plugin.RuntimeKind(kindTok.Text)\n\t\t\tif d.Runtime.Kind == plugin.RuntimeProcess {\n\t\t\t\tcmd, err := p.expect(TokenString)\n\t\t\t\tif err != nil {\n\t\t\t\t\treturn d, err\n\t\t\t\t}\n\t\t\t\td.Runtime.Command = cmd.Text\n\t\t\t\tnext, err := p.peek()\n\t\t\t\tif err != nil {\n\t\t\t\t\treturn d, err\n\t\t\t\t}\n\t\t\t\tif next.Text == "sandbox" {\n\t\t\t\t\t_, _ = p.next()\n\t\t\t\t\tpol, err := p.expect(TokenIdent)\n\t\t\t\t\tif err != nil {\n\t\t\t\t\t\treturn d, err\n\t\t\t\t\t}\n\t\t\t\t\td.Runtime.Sandbox = plugin.SandboxPolicy(pol.Text)\n\t\t\t\t}\n\t\t\t}''',
              '''\t\t\td.Runtime.Kind = plugin.RuntimeKind(kindTok.Text)\n\t\t\tif d.Runtime.Kind == plugin.RuntimeProcess {\n\t\t\t\tcmd, err := p.expect(TokenString)\n\t\t\t\tif err != nil {\n\t\t\t\t\treturn d, err\n\t\t\t\t}\n\t\t\t\tif strings.ContainsAny(cmd.Text, " \\t\\r\\n") {\n\t\t\t\t\treturn d, p.errAt(cmd, "process command must be a single executable name/path; use args for arguments")\n\t\t\t\t}\n\t\t\t\td.Runtime.Command = cmd.Text\n\t\t\t\tnext, err := p.peek()\n\t\t\t\tif err != nil {\n\t\t\t\t\treturn d, err\n\t\t\t\t}\n\t\t\t\tif next.Text == "args" {\n\t\t\t\t\targsTok, _ := p.next()\n\t\t\t\t\tfor {\n\t\t\t\t\t\targ, err := p.peek()\n\t\t\t\t\t\tif err != nil {\n\t\t\t\t\t\t\treturn d, err\n\t\t\t\t\t\t}\n\t\t\t\t\t\tif arg.Kind != TokenString {\n\t\t\t\t\t\t\tbreak\n\t\t\t\t\t\t}\n\t\t\t\t\t\tv, _ := p.next()\n\t\t\t\t\t\td.Runtime.Args = append(d.Runtime.Args, v.Text)\n\t\t\t\t\t}\n\t\t\t\t\tif len(d.Runtime.Args) == 0 {\n\t\t\t\t\t\treturn d, p.errAt(argsTok, "args requires at least one quoted argument")\n\t\t\t\t\t}\n\t\t\t\t\tnext, err = p.peek()\n\t\t\t\t\tif err != nil {\n\t\t\t\t\t\treturn d, err\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t\tif next.Text == "sandbox" {\n\t\t\t\t\t_, _ = p.next()\n\t\t\t\t\tpol, err := p.expect(TokenIdent)\n\t\t\t\t\tif err != nil {\n\t\t\t\t\t\treturn d, err\n\t\t\t\t\t}\n\t\t\t\t\td.Runtime.Sandbox = plugin.SandboxPolicy(pol.Text)\n\t\t\t\t}\n\t\t\t}''',
          )

          p = Path("internal/syntax/plugin_parser_test.go")
          text = p.read_text()
          text = text.replace('''runtime process "python3 -m worker" sandbox required''', '''runtime process "python3" args "-m" "worker" sandbox required''')
          text = text.replace(
              '''\tif p.Runtime.Sandbox != plugin.SandboxRequired || p.Artifact.Digest == "" || len(p.Provides[0].Permissions) != 1 {''',
              '''\tif p.Runtime.Command != "python3" || len(p.Runtime.Args) != 2 || p.Runtime.Args[0] != "-m" || p.Runtime.Args[1] != "worker" || p.Runtime.Sandbox != plugin.SandboxRequired || p.Artifact.Digest == "" || len(p.Provides[0].Permissions) != 1 {''',
          )
          p.write_text(text)

          p = Path("internal/plugin/runtime/process_stdio_test.go")
          text = p.read_text()
          text = text.replace('''func helperLauncher(t *testing.T, mode string) (pruntime.StdioProcessLauncher, string) {''', '''func helperLauncher(t *testing.T, mode string) (pruntime.StdioProcessLauncher, pruntime.ProcessCommand) {''')
          text = text.replace('''\treturn pruntime.StdioProcessLauncher{Env: env}, executable''', '''\treturn pruntime.StdioProcessLauncher{Env: env}, pruntime.ProcessCommand{Executable: executable}''')
          text = text.replace('''\t\t\tCommand:               command,\n\t\t\tSandboxPolicy:''', '''\t\t\tCommand:               command.Executable,\n\t\t\tArgs:                  append([]string(nil), command.Args...),\n\t\t\tSandboxPolicy:''')
          p.write_text(text)

      - name: Format changed code
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w internal/plugin/model.go internal/plugin/runtime/model.go internal/plugin/runtime/host_sandbox.go internal/plugin/runtime/process_stdio.go internal/plugin/runtime/process_stdio_test.go internal/syntax/parser.go internal/syntax/plugin_parser_test.go

      - name: Static checks
        run: go vet ./...
      - name: Tests
        run: go test ./...

      - name: Commit executable argv core
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/plugin internal/syntax
          git commit -m "process commandをexecutableとargvへ分離する"
          git push origin HEAD:work/issue-33-process-argv
