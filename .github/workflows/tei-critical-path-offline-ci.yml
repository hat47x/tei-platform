name: TEI 横断検証のオフライン固定版契約

# GitHub Actionsを使わずに動かせるシェル契約の隔離fixture試験。
# ここではGo/Nodeをスタブ化するため製品本体の合格証拠ではない。
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'tools/reference-critical-path-evidence-audit/compose-smoke.sh'
      - 'tools/reference-critical-path-evidence-audit/compose_offline_test.py'
      - '.github/workflows/tei-critical-path-offline-ci.yml'
  push:
    branches: [main]
    paths:
      - 'tools/reference-critical-path-evidence-audit/compose-smoke.sh'
      - 'tools/reference-critical-path-evidence-audit/compose_offline_test.py'
      - '.github/workflows/tei-critical-path-offline-ci.yml'

permissions:
  contents: read

concurrency:
  group: tei-critical-path-offline-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pinned-local-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 検査対象の版を取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: 検査前に版と作業領域を確認
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            read -r merge base head extra < <(git rev-list --parents -n 1 HEAD)
            test -z "${extra:-}"
            test "$merge" = "$GITHUB_SHA"
            test "$head" = "${{ github.event.pull_request.head.sha }}"
            [[ "$base" =~ ^[0-9a-f]{40}$ ]]
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored=matching)"

      - name: オフライン契約の正負試験
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/reference-critical-path-evidence-audit/compose-smoke.sh
          python3 -B tools/reference-critical-path-evidence-audit/compose_offline_test.py

      - name: 検査後に版と作業領域を確認
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git ls-files -v | awk '/^[a-zS]/ { print }')"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored=matching)"
