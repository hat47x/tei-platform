name: TEI Cache Full vs Incremental Verification

# 公開リポジトリの標準ランナーだけで実行し、Secretsや書込み権限を使わない。
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tei-cache-verification-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cache-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOENV: off
      GOWORK: off
      GOFLAGS: ''
      GOTOOLCHAIN: local
    steps:
      - name: 対象版を取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Goを用意
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false

      # 1回の実行結果をそのまま保存する。別Runの再実行結果を混ぜない。
      - name: Cache verification testsを実行し証拠を保存
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
            go version
            go env GOOS GOARCH GOVERSION GOTOOLCHAIN GOFLAGS GOWORK GOENV
          } > "$GITHUB_WORKSPACE/artifacts/run-context.txt"
          go test ./tools/reference-cache-full-vs-incremental-verification/... -v -count=1 \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/verification.log"

      - name: 検証結果をアップロード
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cache-verification-results
          path: artifacts/
