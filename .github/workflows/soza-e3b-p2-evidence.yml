name: SOZA E3b-P2 TEI Evidence

on:
  push:
    branches:
      - evidence/soza-e3b-p2-version-exchange-2026-09-05
  workflow_dispatch:

permissions:
  contents: read

env:
  TEI_SOURCE_COMMIT: 1a7028d444fcae60a1c4f2f2d247456f4c7c35be

jobs:
  actual-tei-cli:
    runs-on: ubuntu-24.04
    steps:
      - name: Evidence workflowを取得
        uses: actions/checkout@v7

      - name: 固定したTEI本体sourceを取得
        uses: actions/checkout@v7
        with:
          repository: hat47x/tei-platform
          ref: ${{ env.TEI_SOURCE_COMMIT }}
          path: tei-source
          fetch-depth: 1

      - name: Goを準備
        uses: actions/setup-go@v7
        with:
          go-version-file: tei-source/go.mod
          cache: false

      - name: source identityを確認
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C tei-source rev-parse HEAD)"
          test "${actual}" = "${TEI_SOURCE_COMMIT}"
          echo "TEI source commit: ${actual}"

      - name: actual TEI CLIをbuild
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/tei-e3b-p2/bin"
          (
            cd tei-source
            go build -trimpath -ldflags='-s -w' \
              -o "${RUNNER_TEMP}/tei-e3b-p2/bin/tei" \
              ./cmd/tei
          )
          test -x "${RUNNER_TEMP}/tei-e3b-p2/bin/tei"

      - name: actual deployment-provider-planを実行
        shell: bash
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/tei-e3b-p2/bin/tei" \
            deployment-provider-plan \
            -workspace tei-source/reference/workspace \
            -run tei-source/reference/order_rollout.durable-run.m0.21.start.json \
            -solution order_rollout \
            -version 2026.8.27 \
            -plugin-lock tei-source/reference/workspace/.tei/plugin-lock.json \
            > "${RUNNER_TEMP}/tei-e3b-p2/provider-plan.json"

      - name: Provider Planの最小成立条件を確認
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ['RUNNER_TEMP']) / 'tei-e3b-p2' / 'provider-plan.json'
          value = json.loads(path.read_text(encoding='utf-8'))
          allowed = {'executors', 'observations', 'evidence', 'pluginRuntime'}
          unknown = set(value) - allowed
          assert not unknown, unknown
          assert any(value.get(key) for key in allowed), value
          print(json.dumps(value, ensure_ascii=False, sort_keys=True))
          PY

      - name: Evidence bundleを作成
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/tei-e3b-p2/reference"
          cp -R tei-source/reference/workspace "${RUNNER_TEMP}/tei-e3b-p2/reference/workspace"
          cp \
            tei-source/reference/order_rollout.durable-run.m0.21.start.json \
            "${RUNNER_TEMP}/tei-e3b-p2/reference/"

          binary_sha256="$(sha256sum "${RUNNER_TEMP}/tei-e3b-p2/bin/tei" | awk '{print $1}')"
          plan_sha256="$(sha256sum "${RUNNER_TEMP}/tei-e3b-p2/provider-plan.json" | awk '{print $1}')"
          go_version="$(go version)"

          python3 - "${RUNNER_TEMP}/tei-e3b-p2/metadata.json" "${TEI_SOURCE_COMMIT}" "${binary_sha256}" "${plan_sha256}" "${go_version}" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          metadata = {
              'schema': 'tei.soza-e3b-p2-evidence/v1',
              'repository': 'hat47x/tei-platform',
              'source_commit': sys.argv[2],
              'entry_point': 'cmd/tei deployment-provider-plan',
              'binary_sha256': sys.argv[3],
              'provider_plan_sha256': sys.argv[4],
              'go_version': sys.argv[5],
              'comparison_role': 'revision-b',
          }
          path.write_text(json.dumps(metadata, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(path.read_text(encoding='utf-8'))
          PY

      - name: 再実行用bundleをarchive化
        shell: bash
        run: |
          set -euo pipefail
          tar -C "${RUNNER_TEMP}/tei-e3b-p2" \
            -czf "${RUNNER_TEMP}/tei-e3b-p2-version-b-linux-amd64.tar.gz" \
            .
          sha256sum "${RUNNER_TEMP}/tei-e3b-p2-version-b-linux-amd64.tar.gz"

      - name: Evidence artifactを保存
        uses: actions/upload-artifact@v4
        with:
          name: tei-soza-e3b-p2-version-b-linux-amd64
          path: ${{ runner.temp }}/tei-e3b-p2-version-b-linux-amd64.tar.gz
          retention-days: 14
