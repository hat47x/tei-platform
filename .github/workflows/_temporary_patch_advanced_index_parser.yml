name: temporary-patch-advanced-index-parser

on:
  push:
    branches:
      - work/advanced-index-authoring
    paths:
      - .github/workflows/_temporary_patch_advanced_index_parser.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/advanced-index-authoring
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Patch ParsePersistence
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("internal/syntax/parser.go")
          source = path.read_text()
          pattern = re.compile(r'(?ms)^\t\tcase "index", "unique-index":\n.*?(?=^\t\tcase "unique":)')
          matches = pattern.findall(source)
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one legacy index parser block, found {len(matches)}")
          replacement = "\n".join([
              '\t\tcase "index", "unique-index":',
              '\t\t\tunique := t.Text == "unique-index"',
              '\t\t\t_, _ = p.next()',
              '\t\t\tname, err := p.expect(TokenIdent)',
              '\t\t\tif err != nil {',
              '\t\t\t\treturn m, err',
              '\t\t\t}',
              '\t\t\tnext, err := p.peek()',
              '\t\t\tif err != nil {',
              '\t\t\t\treturn m, err',
              '\t\t\t}',
              '\t\t\tif next.Text == "on" {',
              '\t\t\t\t_, _ = p.next()',
              '\t\t\t\ta, err := p.expect(TokenIdent)',
              '\t\t\t\tif err != nil {',
              '\t\t\t\t\treturn m, err',
              '\t\t\t\t}',
              '\t\t\t\tattr, err := core.ParseCanonicalID(a.Text)',
              '\t\t\t\tif err != nil {',
              '\t\t\t\t\treturn m, p.errAt(a, err.Error())',
              '\t\t\t\t}',
              '\t\t\t\tm.Indexes = append(m.Indexes, persistence.IndexMapping{Name: name.Text, Attributes: []core.CanonicalID{attr}, Unique: unique})',
              '\t\t\t\tbreak',
              '\t\t\t}',
              '\t\t\tif next.Kind != TokenLBrace {',
              '\t\t\t\treturn m, p.errAt(next, "expected on or advanced index block")',
              '\t\t\t}',
              '\t\t\tindex, err := p.parseAdvancedIndexBody(name, unique)',
              '\t\t\tif err != nil {',
              '\t\t\t\treturn m, err',
              '\t\t\t}',
              '\t\t\tm.Indexes = append(m.Indexes, index)',
              '',
          ])
          path.write_text(pattern.sub(replacement, source, count=1))
      - name: Format parser
        run: gofmt -w internal/syntax/parser.go
      - name: Commit patch
        run: |
          git config user.name "tei-ci-patch"
          git config user.email "actions@users.noreply.github.com"
          git add internal/syntax/parser.go
          git diff --cached --quiet && exit 0
          git commit -m "ParsePersistenceへAdvanced Index block formを接続する"
          git push origin HEAD:work/advanced-index-authoring
