name: Apply Issue 46 unique constraint parser

on:
  push:
    branches: [work/issue-46-unique-constraint-drift]
    paths:
      - .github/workflows/issue46-parser-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/issue-46-unique-constraint-drift
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Apply parser
        run: python3 .github/scripts/issue46_parser.py
      - name: Format
        run: gofmt -w internal/syntax/parser.go internal/syntax/unique_constraint_test.go
      - name: Verify syntax
        run: |
          go vet ./...
          go test ./internal/syntax ./internal/database/persistence ./internal/database/schemadiff ./internal/database/providers/postgres
      - name: Commit parser
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/syntax/parser.go internal/syntax/unique_constraint_test.go
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Issue #46 Unique Constraint DSLを追加する"
          git push
