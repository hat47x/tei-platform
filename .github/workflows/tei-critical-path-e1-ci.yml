name: TEI 受理Sourceから実Webへの一往復（E1-A）

# 公開PR上で必要なときだけ実行する。試験用の受理と合成Providerであり、製品Gateではない。
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - '.github/workflows/tei-critical-path-e1-ci.yml'
      - 'tools/reference-critical-path-evidence-audit/live-r1-smoke.mjs'
      - 'tools/reference-shared-acceptance/**'
      - 'tools/reference-first-web-target/**'
      - 'reference/studio-authoring/**'
      - 'reference/workspace/**'
      - 'cmd/tei/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/tei-critical-path-e1-ci.yml'
      - 'tools/reference-critical-path-evidence-audit/live-r1-smoke.mjs'
      - 'tools/reference-shared-acceptance/**'
      - 'tools/reference-first-web-target/**'
      - 'reference/studio-authoring/**'
      - 'reference/workspace/**'
      - 'cmd/tei/**'

permissions:
  contents: read

concurrency:
  group: tei-e1a-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scratch-source-to-running-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOENV: off
      GOWORK: off
      GOFLAGS: ''
      GOTOOLCHAIN: local
    steps:
      - name: 試験対象のGit版を取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 試験前の版と作業領域を確認
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" = pull_request ]]; then
            read -r merge base head extra < <(git rev-list --parents -n 1 HEAD)
            test -z "${extra:-}"
            test "$merge" = "$GITHUB_SHA"
            test "$head" = "${{ github.event.pull_request.head.sha }}"
            [[ "$base" =~ ^[0-9a-f]{40}$ ]]
          else
            test "$GITHUB_EVENT_NAME" = push
            test "$GITHUB_REF" = refs/heads/main
          fi
          test -z "$(git ls-files -v | awk '/^[a-zS]/ { print }')"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored=matching)"

      - name: Goを用意
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false

      - name: 一時Source受理からWebの正常系まで実行
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node -e 'if (Number(process.versions.node.split(".")[0]) < 20) process.exit(1)'
          go version
          node --check tools/reference-critical-path-evidence-audit/live-r1-smoke.mjs
          export TEI_CP_EVIDENCE_DIR="$RUNNER_TEMP/tei-e1a-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export TEI_CP_LIVE_R1_SMOKE=1
          node tools/reference-critical-path-evidence-audit/live-r1-smoke.mjs > "$RUNNER_TEMP/tei-e1a-summary.json"
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import { join } from "node:path";
          const read = name => JSON.parse(readFileSync(join(process.env.TEI_CP_EVIDENCE_DIR, name), "utf8"));
          const summary = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, "tei-e1a-summary.json"), "utf8"));
          const lineage = read("workspace-r1.json");
          const launch = read("target-launch.json");
          const positive = read("web-positive.json");
          assert.equal(summary.status, "E1_A_LIVE_HTTP_SYNTHETIC_PROVIDER_ONLY");
          assert.equal(summary.repositoryIntegrationHead, process.env.GITHUB_SHA);
          assert.equal(lineage.integrationHead, process.env.GITHUB_SHA);
          assert.equal(launch.targetBuildRevision, process.env.GITHUB_SHA);
          assert.equal(positive.integrationHead, process.env.GITHUB_SHA);
          assert.equal(lineage.sourceAfter, summary.acceptedScratchSourceR1);
          assert.notEqual(lineage.sourceBefore, lineage.sourceAfter);
          assert.equal(launch.workspaceSourceRevisionBeforeLaunch, lineage.sourceAfter);
          assert.equal(positive.acceptedSourceRevisionClaim, lineage.sourceAfter);
          assert.equal(lineage.humanApproval, false);
          assert.equal(launch.runtimeAuthorityVerified, false);
          assert.equal(positive.httpStatus, 200);
          assert.equal(positive.commandObserved, true);
          assert.equal(positive.independentDatabaseRead, false);
          assert.equal(positive.negativeUnitPriceTest, "NOT_RUN");
          assert.equal(summary.negativeUnitPriceRunningWeb, "NOT_TESTED");
          assert.equal(summary.independentDatabaseRead, false);
          assert.equal(summary.validationCount, 4);
          console.log(JSON.stringify({
            status: "E1_A_SYNTHETIC_WEB_ONLY",
            testedGitHead: process.env.GITHUB_SHA,
            sourceR0: lineage.sourceBefore,
            sourceR1: lineage.sourceAfter,
            targetBinarySHA256: launch.targetBinarySHA256,
            selectedValidationIDs: positive.selectedValidationIDs,
            httpStatus: positive.httpStatus,
            commandObserved: positive.commandObserved,
            negativeUnitPrice: "NOT_RUN",
            realDatabaseAndIndependentRead: "NOT_TESTED",
            humanAcceptance: false,
            productGate: "UNQUALIFIED"
          }, null, 2));
          NODE

      - name: 試験後の版と作業領域を確認
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git ls-files -v | awk '/^[a-zS]/ { print }')"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored=matching)"
