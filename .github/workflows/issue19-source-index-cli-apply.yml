name: Apply Issue 19 Source Index CLI patch

on:
  push:
    branches:
      - work/issue-19-source-index-cli
    paths:
      - .github/workflows/issue19-source-index-cli-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/issue-19-source-index-cli

      - name: Connect source-index command
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, got {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "cmd/tei/main.go",
              "usage: tei <workspace-files|validate|index|plugin-lock|plugin-resolve|plugin-runtime-plan|observed-index|workbench-model|world|requirements|normalize-postgres-plan|desired-schema|schema-diff|plan-migration|migration-fingerprint|database-reconcile|database-compatibility|application-release-compatibility|release-graph|solution-release-graph|consumer-impact|deployment-simulate|deployment-start|deployment-ready-commands|deployment-record-attempt|deployment-retry|deployment-pause|deployment-resume|deployment-abort|deployment-recovery|deployment-start-recovery|deployment-provider-plan|deployment-reconcile> [options]",
              "usage: tei <workspace-files|source-index|validate|index|plugin-lock|plugin-resolve|plugin-runtime-plan|observed-index|workbench-model|world|requirements|normalize-postgres-plan|desired-schema|schema-diff|plan-migration|migration-fingerprint|database-reconcile|database-compatibility|application-release-compatibility|release-graph|solution-release-graph|consumer-impact|deployment-simulate|deployment-start|deployment-ready-commands|deployment-record-attempt|deployment-retry|deployment-pause|deployment-resume|deployment-abort|deployment-recovery|deployment-start-recovery|deployment-provider-plan|deployment-reconcile> [options]",
          )

          replace_once(
              "cmd/tei/main.go",
              '''\tworkspacePath := fs.String("workspace", "", "TEI workspace directory")\n\tvar analysisPaths pathList''',
              '''\tworkspacePath := fs.String("workspace", "", "TEI workspace directory")\n\tsubjectKind := fs.String("subject-kind", "", "Source Index subject kind")\n\tsubjectID := fs.String("subject-id", "", "Source Index subject ID")\n\tvar analysisPaths pathList''',
          )

          replace_once(
              "cmd/tei/main.go",
              '''\t\twriteJSON(r.ManagedFiles)\n\t\treturn\n\t}\n\tif command == "normalize-postgres-plan" {''',
              '''\t\twriteJSON(r.ManagedFiles)\n\t\treturn\n\t}\n\tif command == "source-index" {\n\t\tif *workspacePath == "" || *worldPath != "" {\n\t\t\tfmt.Fprintln(os.Stderr, "source-index requires -workspace and does not accept -world")\n\t\t\tos.Exit(2)\n\t\t}\n\t\tinspection, err := buildSourceIndexInspection(*workspacePath, *subjectKind, *subjectID)\n\t\tif err != nil {\n\t\t\tfmt.Fprintln(os.Stderr, err)\n\t\t\tos.Exit(2)\n\t\t}\n\t\twriteJSON(inspection)\n\t\treturn\n\t}\n\tif command == "normalize-postgres-plan" {''',
          )

      - name: Format and test
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w cmd/tei/main.go cmd/tei/source_index.go cmd/tei/source_index_test.go
          go vet ./...
          go test ./...

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cmd/tei/main.go cmd/tei/source_index.go cmd/tei/source_index_test.go
          git commit -m "Source Index inspection CLIを追加する"
          git push origin HEAD:work/issue-19-source-index-cli
