name: Inspect Issue 50 index dependencies

on:
  push:
    branches: [work/issue-50-advanced-index-actual-diff]
    paths:
      - .github/workflows/issue50-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Find index model dependencies
        shell: bash
        run: |
          set -euo pipefail
          echo '=== physical.Index references ==='
          grep -RIn --exclude-dir=.git 'physical\.Index' cmd internal examples tools reference || true
          echo '=== Index Columns field literals ==='
          grep -RIn --exclude-dir=.git 'Columns:.*\[\]string\|\.Indexes\|\.Columns' internal/database tools | grep -E 'Index|Indexes|idx|index|Columns' || true
          echo '=== IndexMapping references ==='
          grep -RIn --exclude-dir=.git 'IndexMapping' cmd internal examples tools reference || true
