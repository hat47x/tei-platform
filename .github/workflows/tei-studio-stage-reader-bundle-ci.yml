name: TEI Studio Reader Bundle stage reentry

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - .github/workflows/tei-studio-stage-reader-bundle-ci.yml
      - tools/reference-studio-part-generator/**
      - cmd/tei-studio/test/desktop_webview_smoke.py
      - tools/reference-go-build-with-supply/**
      - tools/reference-studio-static-composition/build-generated-workbench.mjs
      - reference/tei-studio-workbench/**
      - reference/studio-authoring/stage-required-source-accept.mjs
      - reference/studio-authoring/editor.mjs
      - reference/studio-authoring/bridge.mjs
      - reference/studio-authoring/cli.mjs
      - tools/reference-shared-acceptance/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-reader-bundle-stage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tei-driven-reader-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
          check-latest: false

      - name: Prepare declared module supply and Workbench deps
        shell: bash
        run: |
          set -euo pipefail
          go mod download
          (cd reference/tei-studio-workbench && npm ci --no-audit --no-fund)

      - name: Check reentry judgement and drive real N2 Bundle from both TEI stages
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOWORK: off
        run: |
          set -euo pipefail
          python3 -B tools/reference-studio-part-generator/stage_reentry.py --self-test
          python3 -B tools/reference-studio-part-generator/stage_reentry.py \
            --repo . --supply "$(go env GOMODCACHE)/cache/download" \
            --work "$RUNNER_TEMP/tei-studio-reader-bundle-stage" --bundle-reader \
            > "$RUNNER_TEMP/studio-bundle-stage-result.json"
          python3 - "$RUNNER_TEMP/studio-bundle-stage-result.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          checks = report["judgement"]
          assert checks["reentryObserved"] is True, checks
          for field in (
              "bundlesWereMadeByTheRecordedNodeChild",
              "bundlesUseSameBuilderSource",
              "eachBundleCarriesItsOwnGeneratedReader",
              "bundleContractsEqualAcrossStages",
              "bundlesEqualAcrossStages",
              "stage1TeiArtifactIsStage2Invoker",
          ):
              assert checks[field] is True, field
          assert report["stage2Desktop"] is None
          print("TEI Stage1 -> Stage2 Reader/Node Bundle receipts checked; no Desktop claim")
          PY

  staged-generated-windows-desktop:
    # In one scratch-only attempt the existing Studio form emits a typed
    # candidate. Shared Acceptance reviews and saves the exact Data cell;
    # both TEI invokers then rebuild the Reader/Bundle, and an isolated Wails
    # Desktop shows the accepted Source after a real Edge form submission.
    # This does not establish human acceptance or an in-Wails Editor session.
    runs-on: windows-2022
    timeout-minutes: 65
    env:
      GOTOOLCHAIN: local
      GOWORK: off
    steps:
      - name: Checkout exact candidate Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Go from the candidate module
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
          check-latest: false

      - name: Prepare real Go supply, esbuild and baseline Data Source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go mod download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location cmd/tei-studio
          try {
            go mod download
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
          Push-Location reference/tei-studio-workbench
          try {
            npm ci --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
          # Browser dependency outside the repository and authored Workspaces.
          $playwrightRoot = Join-Path $env:RUNNER_TEMP 'tei-studio-playwright'
          npm install --prefix $playwrightRoot --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path (Join-Path $playwrightRoot 'node_modules/playwright-core/index.mjs'))) {
            throw 'Pinned Playwright installation failed'
          }
          $env:TEI_STAGE_PLAYWRIGHT_ROOT = $playwrightRoot
          # Only the old Data is authored directly by this test. The changed
          # Source MUST come from the existing offline Editor → typed candidate
          # → Shared Acceptance Review/Accept; never write required: yes here.
          $beforeRoot = Join-Path $env:RUNNER_TEMP 'tei-studio-before-data'
          $beforeDir = Join-Path $beforeRoot 'semantic/studio'
          New-Item -ItemType Directory -Force -Path $beforeDir | Out-Null
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          $workspaceText = (@(
            'workspace: studio_reader'
            'formatVersion: 1'
            'sources:'
            '  - semantic'
            'languages:'
            '  - tei.authoring/v1'
          ) -join "`n") + "`n"
          [System.IO.File]::WriteAllText((Join-Path $beforeRoot 'tei.workspace.yaml'), $workspaceText, $utf8)
          $dataText = (@(
            '# Studio response'
            ''
            '<!-- tei: data InspectionResponse in studio -->'
            '| attribute | type | required | display |'
            '| --- | --- | --- | --- |'
            '| schemaVersion | std.text | yes | Schema |'
            '| snapshotFingerprint | std.text | no | Snapshot |'
          ) -join "`n") + "`n"
          [System.IO.File]::WriteAllText(
            (Join-Path $beforeDir 'inspection-response.tei.md'), $dataText, $utf8)
          $changedRoot = Join-Path $env:RUNNER_TEMP 'tei-studio-changed-data'
          $acceptReceipt = Join-Path $env:RUNNER_TEMP 'tei-studio-source-accept-receipt.json'
          node reference/studio-authoring/stage-required-source-accept.mjs `
            $beforeRoot $changedRoot $acceptReceipt
          if ($LASTEXITCODE -ne 0) { throw 'Studio form → Shared Acceptance failed' }
          $accepted = Get-Content -LiteralPath $acceptReceipt -Raw | ConvertFrom-Json
          if ($accepted.schema -ne 'tei.reference.studio-stage-source-accept/v0' -or
              $accepted.realBrowserEditing -ne 'observed-in-this-attempt' -or
              $accepted.browserScreenshotDigest -notmatch '^sha256:[0-9a-f]{64} -or
              $accepted.previewAndReviewDidNotWriteSource -ne $true -or
              $accepted.unreviewedAcceptRefused -ne $true -or
              $accepted.ownerMeaningAcceptance -ne 'not-established') {
            throw 'Missing exact Editor → Source acceptance boundary'
          }

      - name: Stage1 and Stage2 build the new Wails Desktop and inspect it in WebView2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B tools/reference-studio-part-generator/stage_reentry.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $attempt = Join-Path $env:RUNNER_TEMP 'tei-studio-generated-desktop-stage'
          $source = Join-Path $env:RUNNER_TEMP 'tei-studio-changed-data'
          $before = Join-Path $env:RUNNER_TEMP 'tei-studio-before-data'
          $supply = Join-Path ((go env GOMODCACHE).Trim()) 'cache/download'
          $reportFile = Join-Path $env:RUNNER_TEMP 'tei-studio-staged-desktop-evidence.json'
          python -B tools/reference-studio-part-generator/stage_reentry.py `
            --repo . --supply $supply --work $attempt `
            --authoring-root $source --authoring-data studio.inspection_response `
            --visible-before-root $before `
            --bundle-reader --stage-desktop-bundle --desktop-smoke > $reportFile
          if ($LASTEXITCODE -ne 0) { throw 'TEI-driven changed Data -> new Stage2 Desktop -> WebView2 failed' }
          $report = Get-Content -LiteralPath $reportFile -Raw | ConvertFrom-Json
          $acceptReceipt = Join-Path $env:RUNNER_TEMP 'tei-studio-source-accept-receipt.json'
          $accepted = Get-Content -LiteralPath $acceptReceipt -Raw | ConvertFrom-Json
          if ($report.sources.authoringInputDigest -ne $accepted.afterWorkspaceDigest -or
              $report.sources.authoringInputDigestAfter -ne $accepted.afterWorkspaceDigest -or
              $report.sources.visibleBeforeSourceDigest -ne $accepted.beforeWorkspaceDigest -or
              $report.sources.visibleBeforeSourceAfterDigest -ne $accepted.beforeWorkspaceDigest) {
            throw 'Stage2 generated Reader/visible Inspector used a different Source than the accepted Editor candidate'
          }
          if ($accepted.expectedModelRevision -eq $accepted.savedModelRevision -or
              $accepted.beforeSourceDigest -eq $accepted.afterSourceDigest -or
              $accepted.editorTransport -ne 'real-edge-offline-form-playwright') {
            throw 'Source revision or Studio form provenance was not established'
          }
          foreach ($name in @(
            'reentryObserved',
            'stage1TeiArtifactIsStage2Invoker',
            'eachBundleCarriesItsOwnGeneratedReader',
            'bundlesWereMadeByTheRecordedNodeChild',
            'stage2PartChangedFromCommittedPart',
            'authoringSourceStableAcrossStages',
            'eachDesktopUsedItsStageGeneratedBundle',
            'stage2DesktopEmbedsGeneratedBundle',
            'generatedDesktopExcludesCommittedBundle',
            'generatedDesktopCarriesReaderContract',
            'stage2DesktopUsedGeneratedReaderInNewProcess',
            'visibleBeforeSourceUnchanged',
            'sameNativeWebViewDisplaysChangedCanonical'
          )) {
            if ($report.judgement.$name -ne $true) { throw "Missing Stage2 acceptance: $name" }
          }
          if ($report.stage2Desktop.embedded.inputMode -ne 'stage-generated') {
            throw 'The committed Bundle was used instead of the changed Bundle'
          }
          $head = (git rev-parse HEAD).Trim()
          if ($report.sources.repoHead -ne $head) { throw 'Attempt Source revision mismatch' }
          $shown = $report.stage2Desktop.smoke.visibleAuthoring
          if ($shown.before.snapshotRequired -ne $false -or $shown.after.snapshotRequired -ne $true) {
            throw 'Actual WebView2 Editor did not show the independent required flag delta'
          }
          Write-Host "Stage2 changed Data / generated Bundle / visible before-after Canonical: PASS at $head"

      - name: Keep exact staged Desktop evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tei-stage-generated-windows-desktop-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/tei-studio-staged-desktop-evidence.json
            ${{ runner.temp }}/tei-studio-source-accept-receipt.json
            ${{ runner.temp }}/tei-studio-stage-required-edit.json
            ${{ runner.temp }}/tei-studio-stage-required-candidate.json
            ${{ runner.temp }}/tei-studio-generated-desktop-stage/stage2-desktop-smoke/**
          retention-days: 7
          if-no-files-found: warn
 -or
              @($accepted.browserPageErrors).Count -ne 0 -or
              @($accepted.browserNetworkRequests).Count -ne 0 -or
              $accepted.sourceChangedOneCell -ne $true -or
              $accepted.previewAndReviewDidNotWriteSource -ne $true -or
              $accepted.unreviewedAcceptRefused -ne $true -or
              $accepted.ownerMeaningAcceptance -ne 'not-established') {
            throw 'Missing exact Editor → Source acceptance boundary'
          }

      - name: Stage1 and Stage2 build the new Wails Desktop and inspect it in WebView2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B tools/reference-studio-part-generator/stage_reentry.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $attempt = Join-Path $env:RUNNER_TEMP 'tei-studio-generated-desktop-stage'
          $source = Join-Path $env:RUNNER_TEMP 'tei-studio-changed-data'
          $before = Join-Path $env:RUNNER_TEMP 'tei-studio-before-data'
          $supply = Join-Path ((go env GOMODCACHE).Trim()) 'cache/download'
          $reportFile = Join-Path $env:RUNNER_TEMP 'tei-studio-staged-desktop-evidence.json'
          python -B tools/reference-studio-part-generator/stage_reentry.py `
            --repo . --supply $supply --work $attempt `
            --authoring-root $source --authoring-data studio.inspection_response `
            --visible-before-root $before `
            --bundle-reader --stage-desktop-bundle --desktop-smoke > $reportFile
          if ($LASTEXITCODE -ne 0) { throw 'TEI-driven changed Data -> new Stage2 Desktop -> WebView2 failed' }
          $report = Get-Content -LiteralPath $reportFile -Raw | ConvertFrom-Json
          $acceptReceipt = Join-Path $env:RUNNER_TEMP 'tei-studio-source-accept-receipt.json'
          $accepted = Get-Content -LiteralPath $acceptReceipt -Raw | ConvertFrom-Json
          if ($report.sources.authoringInputDigest -ne $accepted.afterWorkspaceDigest -or
              $report.sources.authoringInputDigestAfter -ne $accepted.afterWorkspaceDigest -or
              $report.sources.visibleBeforeSourceDigest -ne $accepted.beforeWorkspaceDigest -or
              $report.sources.visibleBeforeSourceAfterDigest -ne $accepted.beforeWorkspaceDigest) {
            throw 'Stage2 generated Reader/visible Inspector used a different Source than the accepted Editor candidate'
          }
          if ($accepted.expectedModelRevision -eq $accepted.savedModelRevision -or
              $accepted.beforeSourceDigest -eq $accepted.afterSourceDigest -or
              $accepted.editorTransport -ne 'real-edge-offline-form-playwright') {
            throw 'Source revision or Studio form provenance was not established'
          }
          foreach ($name in @(
            'reentryObserved',
            'stage1TeiArtifactIsStage2Invoker',
            'eachBundleCarriesItsOwnGeneratedReader',
            'bundlesWereMadeByTheRecordedNodeChild',
            'stage2PartChangedFromCommittedPart',
            'authoringSourceStableAcrossStages',
            'eachDesktopUsedItsStageGeneratedBundle',
            'stage2DesktopEmbedsGeneratedBundle',
            'generatedDesktopExcludesCommittedBundle',
            'generatedDesktopCarriesReaderContract',
            'stage2DesktopUsedGeneratedReaderInNewProcess',
            'visibleBeforeSourceUnchanged',
            'sameNativeWebViewDisplaysChangedCanonical'
          )) {
            if ($report.judgement.$name -ne $true) { throw "Missing Stage2 acceptance: $name" }
          }
          if ($report.stage2Desktop.embedded.inputMode -ne 'stage-generated') {
            throw 'The committed Bundle was used instead of the changed Bundle'
          }
          $head = (git rev-parse HEAD).Trim()
          if ($report.sources.repoHead -ne $head) { throw 'Attempt Source revision mismatch' }
          $shown = $report.stage2Desktop.smoke.visibleAuthoring
          if ($shown.before.snapshotRequired -ne $false -or $shown.after.snapshotRequired -ne $true) {
            throw 'Actual WebView2 Editor did not show the independent required flag delta'
          }
          Write-Host "Stage2 changed Data / generated Bundle / visible before-after Canonical: PASS at $head"

      - name: Keep exact staged Desktop evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tei-stage-generated-windows-desktop-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/tei-studio-staged-desktop-evidence.json
            ${{ runner.temp }}/tei-studio-source-accept-receipt.json
            ${{ runner.temp }}/tei-studio-stage-required-form.png
            ${{ runner.temp }}/tei-studio-stage-required-edit.json
            ${{ runner.temp }}/tei-studio-stage-required-candidate.json
            ${{ runner.temp }}/tei-studio-generated-desktop-stage/stage2-desktop-smoke/**
          retention-days: 7
          if-no-files-found: warn
