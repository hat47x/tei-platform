name: Finalize Issue 37 foreign key docs

on:
  push:
    branches:
      - work/issue-37-foreign-key-diff
    paths:
      - .github/workflows/issue37-fk-docs.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: M0.27文書を現在地へ同期
        run: python3 tools/issue37_docs.py
      - name: Repositoryを検証
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l cmd internal examples tools)"
          go vet ./...
          go test ./...
      - name: 文書をcommit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m "M0.27 Foreign Key境界を文書化する"
            git push
          fi
