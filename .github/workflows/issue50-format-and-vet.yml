name: Format and vet Issue 50

on:
  push:
    branches: [work/issue-50-core-model]
    paths:
      - .github/workflows/issue50-format-and-vet.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Goコードを整形
        run: gofmt -w cmd internal examples tools
      - name: 整形差分をcommit
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cmd internal examples tools
            git commit -m "Issue #50 Goコードを整形する"
            git push
          fi
      - name: 静的検査
        run: go vet ./...
      - name: 全テスト
        run: go test ./...
