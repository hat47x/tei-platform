name: TEI RA-2 disposable PostgreSQL Browse reference

# This checks only the reference browse-read entry against disposable PostgreSQL.
# It does not qualify the product tei CLI, Native Consumer or current Host Grant.
on:
  pull_request:
    branches:
      - feat/query-browse-preexecutor-input-guard-20261114
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - '.github/workflows/tei-ra2-browse-disposable-postgres.yml'
      - 'tools/reference-browse-read/**'
      - 'internal/driver/**'
      - 'internal/query/**'
      - 'internal/workspace/**'
      - 'reference/workspace/**'
      - 'examples/data-source-workbench/**'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

concurrency:
  group: tei-ra2-browse-pg-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  isolated-postgres-browse:
    name: Exact merge-HEAD - full reference Browse PG counterexamples
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tei_ra2
          POSTGRES_PASSWORD: isolated_ra2_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tei_ra2 -d postgres"
          --health-interval 3s
          --health-timeout 4s
          --health-retries 15
    env:
      GOENV: off
      GOWORK: off
      GOTOOLCHAIN: local
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      TEI_BROWSE_READ_PG_DSN: postgres://tei_ra2:isolated_ra2_only@127.0.0.1:5432/tei_browse_read_e2e?sslmode=disable
      TEI_BROWSE_READ_PG_CONFIRM_ISOLATED: tei_browse_read_e2e
      TEI_BROWSE_READ_PG_OTHER_DSN: postgres://tei_ra2:isolated_ra2_only@127.0.0.1:5432/tei_browse_other_e2e?sslmode=disable
      TEI_BROWSE_READ_PG_READER_DSN: postgres://tei_browse_reader:tei_browse_reader@127.0.0.1:5432/tei_browse_read_e2e?sslmode=disable
    steps:
      - name: Checkout exact PR merge SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check head parent and clean source before execution
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$GITHUB_REF" =~ ^refs/pull/[0-9]+/merge$ ]]
          read -r merge base head extra < <(git rev-list --parents -n 1 HEAD)
          test -z "${extra:-}"
          test "$merge" = "$GITHUB_SHA"
          test "$head" = "$PR_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored=matching)"
      - name: Set up pinned Go from module
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - name: Create two empty disposable databases
        shell: bash
        run: |
          set -euo pipefail
          for name in tei_browse_read_e2e tei_browse_other_e2e; do
            docker exec "${{ job.services.postgres.id }}" \
              psql -v ON_ERROR_STOP=1 -U tei_ra2 -d postgres -c "CREATE DATABASE ${name}"
          done
      - name: Execute real PostgreSQL Reference Browse with all counterexamples
        shell: bash
        run: |
          set -euo pipefail
          for key in TEI_BROWSE_READ_PG_DSN TEI_BROWSE_READ_PG_CONFIRM_ISOLATED TEI_BROWSE_READ_PG_OTHER_DSN TEI_BROWSE_READ_PG_READER_DSN; do
            test -n "${!key:-}" || { echo "RA-2 witness refused: unset ${key}" >&2; exit 1; }
          done
          test "$TEI_BROWSE_READ_PG_CONFIRM_ISOLATED" = tei_browse_read_e2e
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          go test -count=1 -timeout 15m -json -run '^TestBrowseReadAgainstDisposablePostgreSQL$' ./tools/reference-browse-read > "$RUNNER_TEMP/ra2-go-test.jsonl"
          python3 - "$RUNNER_TEMP/ra2-go-test.jsonl" "$GITHUB_SHA" "$PR_HEAD_SHA" <<'PY'
          import json
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          merge_sha, pr_head = sys.argv[2:]
          parent = 'TestBrowseReadAgainstDisposablePostgreSQL'
          expected_names = {
              'A_normal_read_matches_the_hand-fixed_rows_and_the_independent_reader',
              'B_boundary_is_inclusive_and_one_microsecond_later_excludes',
              'C_empty_result_never_becomes_absence',
              'D_refusals_happen_before_any_read',
              'E_NULL_is_null;_a_missing_column_is_refused,_not_nulled',
              'G_changed_Source_bytes_change_the_digest_and_the_Rowset_under_the_same_Query_ID',
              'F_RLS_and_column_privilege:_the_visible_set_is_never_a_complete_set',
          }
          results = {}
          for line in path.read_text().splitlines():
              event = json.loads(line)
              name = event.get('Test', '')
              action = event.get('Action', '')
              if name == parent or name.startswith(parent + '/'):
                  if action in ('pass', 'fail', 'skip'):
                      results[name] = action
          assert results.get(parent) == 'pass', 'actual PG parent not passed: ' + repr(results)
          actual = {name.split('/', 1)[1] for name in results if name.startswith(parent + '/')}
          assert actual == expected_names, 'unexpected/missing PG cases: ' + repr(sorted(actual))
          assert all(state == 'pass' for state in results.values()), 'a PG case failed or skipped: ' + repr(results)
          summary = {'passed': True, 'evidenceNature': 'real-postgres-ephemeral-fixture',
                     'entry': 'reference-browse-read (not product tei)',
                     'scope': 'isolated PostgreSQL / all A-G cases including other DB and RLS',
                     'mergeSHA': merge_sha, 'prHeadSHA': pr_head, 'tests': sorted(actual),
                     'productReadAccepted': False, 'hostCurrentGrantAccepted': False}
          print(json.dumps(summary, ensure_ascii=False, sort_keys=True))
          PY
      - name: No changes to checked-out Source after test
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored=matching)"
