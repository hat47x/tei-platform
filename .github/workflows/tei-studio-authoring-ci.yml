name: TEI Studio 参照編集の検証

# #1124専用。共通の全体健全性CIは変更せず、正本の変更は一時作業領域だけに限定する。
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - .github/workflows/tei-studio-authoring-ci.yml
      - reference/studio-authoring/**
      - reference/workspace/**
      - reference/world.json
      - reference/business-system-design/order-entry-business-procedure.json
      - tools/reference-shared-acceptance/**
      - cmd/tei/**
      - internal/application/**
      - internal/core/**
      - internal/database/**
      - internal/deployment/**
      - internal/environment/**
      - internal/ir/**
      - internal/operations/**
      - internal/permission/**
      - internal/plugin/**
      - internal/query/**
      - internal/realization/**
      - internal/releaseplan/**
      - internal/resource/**
      - internal/semantic/**
      - internal/studiohost/**
      - internal/stdlib/**
      - internal/sourceindex/**
      - internal/subject/**
      - internal/syntax/**
      - internal/validation/**
      - internal/workspace/**
      - go.mod
      - go.sum
  push:
    branches: [main]
    paths:
      - .github/workflows/tei-studio-authoring-ci.yml
      - reference/studio-authoring/**
      - reference/workspace/**
      - reference/world.json
      - reference/business-system-design/order-entry-business-procedure.json
      - tools/reference-shared-acceptance/**
      - cmd/tei/**
      - internal/application/**
      - internal/core/**
      - internal/database/**
      - internal/deployment/**
      - internal/environment/**
      - internal/ir/**
      - internal/operations/**
      - internal/permission/**
      - internal/plugin/**
      - internal/query/**
      - internal/realization/**
      - internal/releaseplan/**
      - internal/resource/**
      - internal/semantic/**
      - internal/studiohost/**
      - internal/stdlib/**
      - internal/sourceindex/**
      - internal/subject/**
      - internal/syntax/**
      - internal/validation/**
      - internal/workspace/**
      - go.mod
      - go.sum
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tei-studio-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  studio-source-loop:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOENV: off
      GOWORK: off
      GOFLAGS: ''
      GOTOOLCHAIN: local
    steps:
      - name: 検証対象をGit履歴とともに取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 実行前の版と作業領域を確認
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            [[ "$GITHUB_REF" =~ ^refs/pull/[0-9]+/merge$ ]]
            read -r merged base head extra < <(git rev-list --parents -n 1 HEAD)
            test -z "${extra:-}"
            test "$merged" = "$GITHUB_SHA"
            test "$head" = "$PR_HEAD_SHA"
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored=matching)"
          printf 'verified-commit=%s\n' "$GITHUB_SHA"

      - name: Goの版を固定
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false

      - name: CLIとStudio HostのCatalog結果・失敗分類を比較
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l cmd/tei/cli_inprocess_parity_test.go)"
          go test -count=1 ./cmd/tei \
            -run '^(TestStudioCatalogMatchesCLI(ResultSemantics|DuplicateIdentitySemantics)|TestStudioCatalogMatchesCLILoadFailureClassification)$'
          go test -count=1 ./internal/operations \
            -run '^(TestCatalogWorldEnumeratesTypedSemanticAndApplicationSubjects|TestCatalogWorldDoesNotDiscardDuplicateIdentities|TestCatalogNamespaceFilterPreservesGlobalIdentityAmbiguity)$'

      - name: TraceWorkspaceの並行処理をデータ競合検出つきで検査
        shell: bash
        run: |
          set -euo pipefail
          # TraceWorkspaceは、Source Index側とWorldの直列化を、投影・整列と並行に走らせる。
          # index.Buildの完了前にWorldを読むような欠陥は、内容の差ではなくデータ競合として現れ、
          # -race以外では検出できない。
          go test -race -count=1 -run '^TestTraceWorkspace' ./internal/operations

      - name: Node.jsの版を固定
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          check-latest: false

      - name: Studioの単体試験
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node --test reference/studio-authoring/*.test.mjs

      - name: 1万件合成Referenceの投影とHTML表示を実測
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/tei-studio-1124-performance.json"
          node reference/studio-authoring/performance.mjs > "$receipt"
          jq -e --arg sha "$GITHUB_SHA" '
            .schema == "tei.reference.studio-performance-receipt/v0"
            and .head == $sha
            and .fixture.kind == "synthetic"
            and .fixture.highFanIn == 10000
            and .result.erEdges == 10000
            and .result.erNodes == 10001
            and .result.functionItems == 10000
            and .result.truncatedHTMLLists == true
            and (.result.htmlBytes > 0)
            and (.observed.projectionMs >= 0)
            and (.observed.htmlMs >= 0)
            and (.observed.rssMiB > 0)
            and .authority.sourceWrite == "not-performed"
            and .authority.humanAcceptance == "not-observed"
            and .authority.actualBrowser == "not-observed"
            and .authority.acceptedBusiness == "not-established"
          ' "$receipt" >/dev/null
          jq '{schema, head, fixture, result, observed, authority, qualification}' "$receipt"

      - name: 既存実Chrome試験と同じ固定Playwrightライブラリを作業領域外へ準備
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome || command -v google-chrome-stable
          npm install --prefix "$RUNNER_TEMP/tei-studio-playwright" \
            --no-audit --no-fund --ignore-scripts --no-save --no-package-lock \
            playwright-core@1.56.1
          test -s "$RUNNER_TEMP/tei-studio-playwright/node_modules/playwright-core/index.mjs"

      - name: 実ChromeでStudio編集フォームを送信してGo共通審査へ渡す
        shell: bash
        run: |
          set -euo pipefail
          shots="$RUNNER_TEMP/tei-studio-real-browser"
          node reference/studio-authoring/real-browser.mjs \
            "$RUNNER_TEMP/tei-studio-playwright" "$shots"
          test -s "$shots/er.png"
          test -s "$shots/table.png"
          jq -e --arg sha "$GITHUB_SHA" '
            .schema == "tei.reference.studio-real-browser-receipt/v0"
            and .head == $sha
            and .browser == "real-chrome-headless"
            and .sourceRevisionAfter == .revision
            and (.cases | length == 2)
            and ([.cases[] | .revisionBound == true
              and .realChromeDOMEvent == true
              and .cspScriptExecuted == true
              and .offlineNetworkRequests == 0
              and .invalidBrowserReferenceRefused == true
              and .accepted == false
              and .sourceChanged == false] | all)
            and .authority.humanAcceptance == "not-observed"
            and .authority.acceptedBusiness == "not-established"
          ' "$shots/real-browser-receipt.json" >/dev/null

      - name: 実Chromeのオフライン編集画面証跡を添付
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: studio-edit-chrome-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tei-studio-real-browser/
          retention-days: 7
          if-no-files-found: error

      - name: 実Chromeの属性必須指定をShared Acceptanceで明示Review・Source保存・再読込
        shell: bash
        env:
          TEI_STUDIO_ACCEPTED_SOURCE_LOOP: '1'
        run: |
          set -euo pipefail
          shots="$RUNNER_TEMP/tei-studio-required-accepted-source"
          mkdir -p "$shots"
          node reference/studio-authoring/required-source-loop.mjs \
            "$RUNNER_TEMP/tei-studio-playwright" "$shots"
          test -s "$shots/required-editor.png"
          jq -e --arg sha "$GITHUB_SHA" '
            .schema == "tei.reference.studio-required-source-loop/v0"
            and .head == $sha
            and .status == "PASS"
            and .actualBrowser == "chrome-headless"
            and .editorMode == "required"
            and .browserDraftSchema == "tei.reference.studio-edit/v0"
            and .candidateSchema == "tei.reference.change-candidate/v0"
            and (.modelRevisionBefore != .modelRevisionAfter)
            and .changedManagedSourceFiles == ["semantic/studio/inspection-response.tei.md"]
            and (.sourceBytesBefore != .sourceBytesAfter)
            and .readerSourceIsRealTEIWorld == true
            and .independentCanonicalRequiredBefore == false
            and .independentCanonicalRequiredAfter == true
            and .previewNonMutating == true
            and .reviewNonMutating == true
            and .explicitFingerprintAccepted == true
            and .missingFingerprintRefused == true
            and .staleReviewRefused == true
            and .offlineNetworkRequests == 0
            and .humanMeaningAcceptance == "not-observed"
            and .productWailsEditor == "not-observed"
            and .windowsSelfBuildAfterAcceptance == "not-observed"
            and .buildAuthority == "not-established"
          ' "$shots/required-source-loop-receipt.json" >/dev/null

      - name: 実ChromeとShared Acceptanceから作成した保存後Sourceの証拠を添付
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: studio-required-source-loop-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tei-studio-required-accepted-source/
          retention-days: 7
          if-no-files-found: error

      - name: 一時作業領域で正本受理と再投影を検証
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/tei-studio-1124-e2e.json"
          TEI_STUDIO_E2E=1 node reference/studio-authoring/e2e.mjs > "$receipt"
          jq -e --arg sha "$GITHUB_SHA" '
            .status == "PASS"
            and .head == $sha
            and (.checks > 0)
            and (.cases | length == 2)
            and (.businessReference.status == "PASS")
            and (.businessReference.authority == "noncanonical-reference")
            and (.businessReference.humanAcceptance == "not-observed")
            and (.businessReference.actualProviderResult == "not-observed")
            and ([.cases[] | .concurrentRivalRefused == true
                and .invalidBrowserReferenceRefused == true
                and .editorTransport.kind == "offline-editor-script-vm"
                and .editorTransport.candidateOrigin == "studio"
                and .editorTransport.sourceRevision == .sourceLineage.baseModelRevision
                and .editorTransport.acceptedCandidateFingerprint == .sourceLineage.candidateFingerprint
                and .editorTransport.staleBrowserReviewRefused == true
                and .humanAcceptance == "not-observed"
                and .actualProviderResult == "not-observed"
                and .runtimeObservation == "not-observed"] | all)
          ' "$receipt" >/dev/null
          jq '{status, head, checks, caseNames: [.cases[].name], businessReference, claimLimits}' "$receipt"

      - name: 実行後の版と作業領域を確認
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored=matching)"

  accepted-source-into-windows-studio:
    # The accepted file is produced by the actual Chrome+Shared Acceptance
    # job, then passed as immutable bytes to the existing Windows Stage driver.
    needs: studio-source-loop
    runs-on: windows-2022
    timeout-minutes: 65
    env:
      GOTOOLCHAIN: local
      GOWORK: off
    steps:
      - name: Checkout the same workflow revision, including Git worktrees
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go from the checked-in module
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false

      - name: Setup Node for existing esbuild child
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
          check-latest: false

      - name: Download actual accepted Source bytes from this workflow run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: studio-required-source-loop-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tei-studio-source-transport

      - name: Prepare real Stage Builder supply and check accepted Source lineage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $transport = Join-Path $env:RUNNER_TEMP 'tei-studio-source-transport'
          $receiptPath = Join-Path $transport 'required-source-loop-receipt.json'
          if (-not (Test-Path -LiteralPath $receiptPath)) { throw 'No accepted Source receipt' }
          $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:GITHUB_SHA -or $receipt.head -ne $head) {
            throw 'Chrome acceptance and Windows reentry are on different Source revisions'
          }
          if ($receipt.status -ne 'PASS' -or $receipt.humanMeaningAcceptance -ne 'not-observed') {
            throw 'Missing explicit Reference acceptance boundary'
          }
          $accepted = Join-Path $transport 'accepted-workspace'
          $before = Join-Path $transport 'before-workspace'
          $relative = 'semantic/studio/inspection-response.tei.md'
          $acceptedPath = Join-Path $accepted $relative
          $beforePath = Join-Path $before $relative
          $hashAfter = (Get-FileHash -LiteralPath $acceptedPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $hashBefore = (Get-FileHash -LiteralPath $beforePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if (('sha256:' + $hashAfter) -ne $receipt.sourceBytesAfter -or
              ('sha256:' + $hashBefore) -ne $receipt.sourceBytesBefore) {
            throw 'Downloaded Data Source bytes do not match accepted Chrome source fingerprints'
          }
          $old = [System.IO.File]::ReadAllText($beforePath)
          $new = [System.IO.File]::ReadAllText($acceptedPath)
          $from = '| snapshotFingerprint | std.text | no | Snapshot |'
          $to = '| snapshotFingerprint | std.text | yes | Snapshot |'
          if (($old.Split($from)).Count -ne 2 -or $new -ne $old.Replace($from, $to)) {
            throw 'The downloaded accepted Source differs by more than one required cell'
          }
          $manifestOld = [System.IO.File]::ReadAllBytes((Join-Path $before 'tei.workspace.yaml'))
          $manifestNew = [System.IO.File]::ReadAllBytes((Join-Path $accepted 'tei.workspace.yaml'))
          if (([Convert]::ToHexString($manifestOld)) -ne ([Convert]::ToHexString($manifestNew))) {
            throw 'Source Workspace manifest was altered between Chrome and Stage2'
          }
          go mod download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location cmd/tei-studio
          try {
            go mod download
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
          Push-Location reference/tei-studio-workbench
          try {
            npm ci --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }

      - name: Rebuild Stage1 and Stage2 from that accepted Source and inspect real WebView2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B tools/reference-studio-part-generator/stage_reentry.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $transport = Join-Path $env:RUNNER_TEMP 'tei-studio-source-transport'
          $source = Join-Path $transport 'accepted-workspace'
          $before = Join-Path $transport 'before-workspace'
          $attempt = Join-Path $env:RUNNER_TEMP 'tei-studio-accepted-source-n3-attempt'
          $supply = Join-Path ((go env GOMODCACHE).Trim()) 'cache/download'
          $reportFile = Join-Path $env:RUNNER_TEMP 'tei-studio-accepted-source-n3-evidence.json'
          python -B tools/reference-studio-part-generator/stage_reentry.py `
            --repo . --supply $supply --work $attempt `
            --authoring-root $source --authoring-data studio.inspection_response `
            --visible-before-root $before `
            --bundle-reader --stage-desktop-bundle --desktop-smoke > $reportFile
          if ($LASTEXITCODE -ne 0) { throw 'Accepted Data -> Stage2 Wails -> WebView2 failed' }
          $report = Get-Content -LiteralPath $reportFile -Raw | ConvertFrom-Json
          $receipt = Get-Content -LiteralPath (Join-Path $transport 'required-source-loop-receipt.json') -Raw | ConvertFrom-Json
          if ($report.sources.repoHead -ne $receipt.head -or $report.sources.repoHead -ne (git rev-parse HEAD).Trim()) {
            throw 'Stage2 used a different Git Source revision than Chrome acceptance'
          }
          foreach ($gate in @(
            'reentryObserved',
            'stage1TeiArtifactIsStage2Invoker',
            'eachBundleCarriesItsOwnGeneratedReader',
            'bundlesWereMadeByTheRecordedNodeChild',
            'stage2PartChangedFromCommittedPart',
            'authoringSourceStableAcrossStages',
            'eachDesktopUsedItsStageGeneratedBundle',
            'stage2DesktopEmbedsGeneratedBundle',
            'generatedDesktopExcludesCommittedBundle',
            'generatedDesktopCarriesReaderContract',
            'stage2DesktopUsedGeneratedReaderInNewProcess',
            'visibleBeforeSourceUnchanged',
            'sameNativeWebViewDisplaysChangedCanonical'
          )) {
            if ($report.judgement.$gate -ne $true) { throw "Stage2 acceptance missing: $gate" }
          }
          $visible = $report.stage2Desktop.smoke.visibleAuthoring
          if ($visible.before.snapshotRequired -ne $false -or
              $visible.after.snapshotRequired -ne $true -or
              $receipt.independentCanonicalRequiredBefore -ne $false -or
              $receipt.independentCanonicalRequiredAfter -ne $true) {
            throw 'Real Chrome accepted Source and Stage2 visible Inspector disagree'
          }
          Write-Host 'Real Chrome -> explicit Review/Accept -> saved Source -> Stage2 Windows WebView2: PASS'

      - name: Retain Stage2 evidence bound to actual accepted Source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: studio-accepted-source-to-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/tei-studio-accepted-source-n3-evidence.json
            ${{ runner.temp }}/tei-studio-accepted-source-n3-attempt/stage2-desktop-smoke/**
          retention-days: 7
          if-no-files-found: warn
