name: TEI Studio 参照編集の検証

# #1124専用。共通の全体健全性CIは変更せず、正本の変更は一時作業領域だけに限定する。
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - .github/workflows/tei-studio-authoring-ci.yml
      - reference/studio-authoring/**
      - reference/workspace/**
      - reference/world.json
      - reference/business-system-design/order-entry-business-procedure.json
      - tools/reference-shared-acceptance/**
      - cmd/tei/**
      - internal/sourceindex/**
  push:
    branches: [main]
    paths:
      - .github/workflows/tei-studio-authoring-ci.yml
      - reference/studio-authoring/**
      - reference/workspace/**
      - reference/world.json
      - reference/business-system-design/order-entry-business-procedure.json
      - tools/reference-shared-acceptance/**
      - cmd/tei/**
      - internal/sourceindex/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tei-studio-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  studio-source-loop:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOENV: off
      GOWORK: off
      GOFLAGS: ''
      GOTOOLCHAIN: local
    steps:
      - name: 検証対象をGit履歴とともに取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 実行前の版と作業領域を確認
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            [[ "$GITHUB_REF" =~ ^refs/pull/[0-9]+/merge$ ]]
            read -r merged base head extra < <(git rev-list --parents -n 1 HEAD)
            test -z "${extra:-}"
            test "$merged" = "$GITHUB_SHA"
            test "$head" = "$PR_HEAD_SHA"
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored=matching)"
          printf 'verified-commit=%s\n' "$GITHUB_SHA"

      - name: Goの版を固定
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false

      - name: Node.jsの版を固定
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          check-latest: false

      - name: Studioの単体試験
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node --test reference/studio-authoring/*.test.mjs

      - name: 1万件合成Referenceの投影とHTML表示を実測
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/tei-studio-1124-performance.json"
          node reference/studio-authoring/performance.mjs > "$receipt"
          jq -e --arg sha "$GITHUB_SHA" '
            .schema == "tei.reference.studio-performance-receipt/v0"
            and .head == $sha
            and .fixture.kind == "synthetic"
            and .fixture.highFanIn == 10000
            and .result.erEdges == 10000
            and .result.erNodes == 10001
            and .result.functionItems == 10000
            and .result.truncatedHTMLLists == true
            and (.result.htmlBytes > 0)
            and (.observed.projectionMs >= 0)
            and (.observed.htmlMs >= 0)
            and (.observed.rssMiB > 0)
            and .authority.sourceWrite == "not-performed"
            and .authority.humanAcceptance == "not-observed"
            and .authority.actualBrowser == "not-observed"
            and .authority.acceptedBusiness == "not-established"
          ' "$receipt" >/dev/null
          jq '{schema, head, fixture, result, observed, authority, qualification}' "$receipt"

      - name: 既存実Chrome試験と同じ固定Playwrightライブラリを作業領域外へ準備
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome || command -v google-chrome-stable
          npm install --prefix "$RUNNER_TEMP/tei-studio-playwright" \
            --no-audit --no-fund --ignore-scripts --no-save --no-package-lock \
            playwright-core@1.56.1
          test -s "$RUNNER_TEMP/tei-studio-playwright/node_modules/playwright-core/index.mjs"

      - name: 実ChromeでStudio編集フォームを送信してGo共通審査へ渡す
        shell: bash
        run: |
          set -euo pipefail
          shots="$RUNNER_TEMP/tei-studio-real-browser"
          node reference/studio-authoring/real-browser.mjs \
            "$RUNNER_TEMP/tei-studio-playwright" "$shots"
          test -s "$shots/er.png"
          test -s "$shots/table.png"
          jq -e --arg sha "$GITHUB_SHA" '
            .schema == "tei.reference.studio-real-browser-receipt/v0"
            and .head == $sha
            and .browser == "real-chrome-headless"
            and .sourceRevisionAfter == .revision
            and (.cases | length == 2)
            and ([.cases[] | .revisionBound == true
              and .realChromeDOMEvent == true
              and .cspScriptExecuted == true
              and .offlineNetworkRequests == 0
              and .accepted == false
              and .sourceChanged == false] | all)
            and .authority.humanAcceptance == "not-observed"
            and .authority.acceptedBusiness == "not-established"
          ' "$shots/real-browser-receipt.json" >/dev/null

      - name: 実Chromeのオフライン編集画面証跡を添付
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: studio-edit-chrome-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tei-studio-real-browser/
          retention-days: 7
          if-no-files-found: error

      - name: 一時作業領域で正本受理と再投影を検証
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/tei-studio-1124-e2e.json"
          TEI_STUDIO_E2E=1 node reference/studio-authoring/e2e.mjs > "$receipt"
          jq -e --arg sha "$GITHUB_SHA" '
            .status == "PASS"
            and .head == $sha
            and (.checks > 0)
            and (.cases | length == 2)
            and (.businessReference.status == "PASS")
            and (.businessReference.authority == "noncanonical-reference")
            and (.businessReference.humanAcceptance == "not-observed")
            and (.businessReference.actualProviderResult == "not-observed")
            and ([.cases[] | .concurrentRivalRefused == true
                and .invalidBrowserReferenceRefused == true
                and .editorTransport.kind == "offline-editor-script-vm"
                and .editorTransport.candidateOrigin == "studio"
                and .editorTransport.sourceRevision == .sourceLineage.baseModelRevision
                and .editorTransport.acceptedCandidateFingerprint == .sourceLineage.candidateFingerprint
                and .editorTransport.staleBrowserReviewRefused == true
                and .humanAcceptance == "not-observed"
                and .actualProviderResult == "not-observed"
                and .runtimeObservation == "not-observed"] | all)
          ' "$receipt" >/dev/null
          jq '{status, head, checks, caseNames: [.cases[].name], businessReference, claimLimits}' "$receipt"

      - name: 実行後の版と作業領域を確認
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored=matching)"
