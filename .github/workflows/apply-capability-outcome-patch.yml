name: Capability Outcome最小パッチ適用

on:
  push:
    branches:
      - work/capability-named-outcome

permissions:
  contents: write

jobs:
  apply-patch:
    if: ${{ !contains(github.event.head_commit.message, '[outcome-patch-applied]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Repositoryを取得
        uses: actions/checkout@v7
        with:
          ref: work/capability-named-outcome

      - name: Goを準備
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Outcome契約を既存実装へ接続
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: replacement target count={count}, want=1")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "internal/syntax/parser.go",
              '''\tc := semantic.Capability{ID: id, Symbol: symbol}\n\tif _, err := p.expect(TokenLBrace); err != nil {\n''',
              '''\tc := semantic.Capability{ID: id, Symbol: symbol}\n\toutcomeNames := map[core.LocalName]struct{}{}\n\thasOutput := false\n\tif _, err := p.expect(TokenLBrace); err != nil {\n''',
          )

          replace_once(
              "internal/syntax/parser.go",
              '''\t\tcase "output":\n\t\t\t_, _ = p.next()\n\t\t\ttypeTok, err := p.expect(TokenIdent)\n\t\t\tif err != nil {\n\t\t\t\treturn c, err\n\t\t\t}\n\t\t\tc.Output, err = core.ParseCanonicalID(typeTok.Text)\n\t\t\tif err != nil {\n\t\t\t\treturn c, p.errAt(typeTok, err.Error())\n\t\t\t}\n\t\tdefault:\n\t\t\treturn c, p.errAt(t, "expected input or output")\n''',
              '''\t\tcase "output":\n\t\t\tif hasOutput {\n\t\t\t\treturn c, p.errAt(t, "output is declared more than once")\n\t\t\t}\n\t\t\tif len(c.Outcomes) > 0 {\n\t\t\t\treturn c, p.errAt(t, "capability cannot declare both output and named outcomes")\n\t\t\t}\n\t\t\thasOutput = true\n\t\t\t_, _ = p.next()\n\t\t\ttypeTok, err := p.expect(TokenIdent)\n\t\t\tif err != nil {\n\t\t\t\treturn c, err\n\t\t\t}\n\t\t\tc.Output, err = core.ParseCanonicalID(typeTok.Text)\n\t\t\tif err != nil {\n\t\t\t\treturn c, p.errAt(typeTok, err.Error())\n\t\t\t}\n\t\tcase "outcome":\n\t\t\tif hasOutput {\n\t\t\t\treturn c, p.errAt(t, "capability cannot declare both output and named outcomes")\n\t\t\t}\n\t\t\t_, _ = p.next()\n\t\t\tnameTok, err := p.expect(TokenIdent)\n\t\t\tif err != nil {\n\t\t\t\treturn c, err\n\t\t\t}\n\t\t\tname, err := core.ParseLocalName(nameTok.Text)\n\t\t\tif err != nil {\n\t\t\t\treturn c, p.errAt(nameTok, err.Error())\n\t\t\t}\n\t\t\tif _, exists := outcomeNames[name]; exists {\n\t\t\t\treturn c, p.errAt(nameTok, fmt.Sprintf("outcome %s is declared more than once", name))\n\t\t\t}\n\t\t\toutcomeNames[name] = struct{}{}\n\t\t\tpayloadTok, err := p.expect(TokenIdent)\n\t\t\tif err != nil {\n\t\t\t\treturn c, err\n\t\t\t}\n\t\t\tpayload, err := core.ParseCanonicalID(payloadTok.Text)\n\t\t\tif err != nil {\n\t\t\t\treturn c, p.errAt(payloadTok, err.Error())\n\t\t\t}\n\t\t\tc.Outcomes = append(c.Outcomes, semantic.Outcome{Name: name, Payload: payload})\n\t\tdefault:\n\t\t\treturn c, p.errAt(t, "expected input, output, or outcome")\n''',
          )

          replace_once(
              "internal/syntax/semantic_anchor.go",
              '''\t\tcase "output":\n\t\t\tif _, err := expectLexerIdent(lx, "semantic capability output type"); err != nil {\n\t\t\t\treturn err\n\t\t\t}\n\t\tdefault:\n''',
              '''\t\tcase "output":\n\t\t\tif _, err := expectLexerIdent(lx, "semantic capability output type"); err != nil {\n\t\t\t\treturn err\n\t\t\t}\n\t\tcase "outcome":\n\t\t\tif _, err := expectLexerIdent(lx, "semantic capability outcome name"); err != nil {\n\t\t\t\treturn err\n\t\t\t}\n\t\t\tif _, err := expectLexerIdent(lx, "semantic capability outcome payload type"); err != nil {\n\t\t\t\treturn err\n\t\t\t}\n\t\tdefault:\n''',
          )

          replace_once(
              "internal/validation/validation.go",
              '''\tout := validateApplicationPatterns(w)\n\n\tpluginCatalog := plugin.Catalog{Plugins: w.Plugins, Bundles: w.Bundles}\n''',
              '''\tout := validateApplicationPatterns(w)\n\tout = append(out, validateCapabilityOutcomes(w)...)\n\n\tpluginCatalog := plugin.Catalog{Plugins: w.Plugins, Bundles: w.Bundles}\n''',
          )

          replace_once(
              "internal/workspace/loader.go",
              '''\t\tsort.Slice(w.Semantics[i].Capabilities, func(a, b int) bool { return w.Semantics[i].Capabilities[a].ID < w.Semantics[i].Capabilities[b].ID })\n\t}\n''',
              '''\t\tsort.Slice(w.Semantics[i].Capabilities, func(a, b int) bool { return w.Semantics[i].Capabilities[a].ID < w.Semantics[i].Capabilities[b].ID })\n\t\tfor j := range w.Semantics[i].Capabilities {\n\t\t\tsort.Slice(w.Semantics[i].Capabilities[j].Outcomes, func(a, b int) bool {\n\t\t\t\tif w.Semantics[i].Capabilities[j].Outcomes[a].Name == w.Semantics[i].Capabilities[j].Outcomes[b].Name {\n\t\t\t\t\treturn w.Semantics[i].Capabilities[j].Outcomes[a].Payload < w.Semantics[i].Capabilities[j].Outcomes[b].Payload\n\t\t\t\t}\n\t\t\t\treturn w.Semantics[i].Capabilities[j].Outcomes[a].Name < w.Semantics[i].Capabilities[j].Outcomes[b].Name\n\t\t\t})\n\t\t}\n\t}\n''',
          )
          PY

          gofmt -w \
            internal/syntax/parser.go \
            internal/syntax/semantic_anchor.go \
            internal/validation/validation.go \
            internal/workspace/loader.go

      - name: 最小Conformanceを実行
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/syntax ./internal/validation ./internal/workspace

      - name: 適用結果をbranchへ反映
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            internal/syntax/parser.go \
            internal/syntax/semantic_anchor.go \
            internal/validation/validation.go \
            internal/workspace/loader.go
          if git diff --cached --quiet; then
            echo "適用対象の差分はありません。"
            exit 0
          fi
          git commit -m "Capability OutcomeをParser・Validation・Normalizationへ接続する [outcome-patch-applied]"
          git push origin HEAD:work/capability-named-outcome
