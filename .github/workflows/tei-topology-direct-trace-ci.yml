name: TEI direct trace read-only current-main Reference

# A narrowly scoped, read-only CLI->Node consumer observation.
# This does not establish Source closure, Policy, Acceptance or UI readiness.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'reference/tei-topology-coverage/**'
      - 'reference/README.md'
      - 'plan/design/TOPOLOGY_COMPOSITE_VIEWS_AND_PIPELINE_2026-10.md'
      - '.github/workflows/tei-topology-direct-trace-ci.yml'
      - 'internal/modelref/**'
      - 'internal/operations/trace_workspace.go'
      - 'internal/workspace/**'
      - 'cmd/tei/**'
      - 'reference/workspace/**'
      - 'go.mod'
      - 'go.sum'
  push:
    branches: [main]
    paths:
      - 'reference/tei-topology-coverage/**'
      - 'reference/README.md'
      - 'plan/design/TOPOLOGY_COMPOSITE_VIEWS_AND_PIPELINE_2026-10.md'
      - '.github/workflows/tei-topology-direct-trace-ci.yml'
      - 'internal/modelref/**'
      - 'internal/operations/trace_workspace.go'
      - 'internal/workspace/**'
      - 'cmd/tei/**'
      - 'reference/workspace/**'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

concurrency:
  group: tei-direct-trace-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  direct-trace-observation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GOFLAGS: -mod=readonly
    steps:
      - name: Checkout exact PR head or push
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Use declared Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Pin Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
          check-latest: false
      - name: Confirm revision and test blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          go version
          node --version
          for file in reference/tei-topology-coverage/direct-trace.mjs \
                      reference/tei-topology-coverage/direct-trace.test.mjs \
                      reference/tei-topology-coverage/verify-cli-trace.mjs; do
            test -f "$file"
            printf 'direct-trace-blob=%s path=%s\n' "$(git hash-object "$file")" "$file"
          done
      - name: Test narrow CLI envelope/SourceNavigation/Manifest contract
        shell: bash
        run: |
          set -euo pipefail
          node --test reference/tei-topology-coverage/direct-trace.test.mjs
      - name: Observe actual Workspace under two caller-supplied scopes
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/tei trace \
            -workspace reference/workspace \
            -scope reference-observation \
            -subject-kind semantic-relation \
            -subject-id sales.order.customer \
            -direction both -mode full > "$RUNNER_TEMP/tei_trace_a.json"
          go run ./cmd/tei trace \
            -workspace reference/workspace \
            -scope alternate-observation \
            -subject-kind semantic-relation \
            -subject-id sales.order.customer \
            -direction both -mode full > "$RUNNER_TEMP/tei_trace_b.json"
          # A second Workspace with identical semantic Sources but changed
          # manifest bytes/name can produce the same World and Source Index FP.
          # Create only outside the checkout; do not modify repository fixtures.
          mkdir -p "$RUNNER_TEMP/tei_trace_other_workspace"
          cp -a reference/workspace/. "$RUNNER_TEMP/tei_trace_other_workspace/"
          sed -i 's/^workspace: tei_reference$/workspace: tei_reference_copy/' \
            "$RUNNER_TEMP/tei_trace_other_workspace/tei.workspace.yaml"
          grep -qx 'workspace: tei_reference_copy' \
            "$RUNNER_TEMP/tei_trace_other_workspace/tei.workspace.yaml"
          go run ./cmd/tei trace \
            -workspace "$RUNNER_TEMP/tei_trace_other_workspace" \
            -scope reference-observation \
            -subject-kind semantic-relation \
            -subject-id sales.order.customer \
            -direction both -mode full > "$RUNNER_TEMP/tei_trace_other_workspace.json"
          # A second independent directory with *identical* Manifest and
          # Source bytes. The CLI cannot identify its physical root or attempt.
          mkdir -p "$RUNNER_TEMP/tei_trace_identical_workspace"
          cp -a reference/workspace/. "$RUNNER_TEMP/tei_trace_identical_workspace/"
          cmp reference/workspace/tei.workspace.yaml \
            "$RUNNER_TEMP/tei_trace_identical_workspace/tei.workspace.yaml"
          go run ./cmd/tei trace \
            -workspace "$RUNNER_TEMP/tei_trace_identical_workspace" \
            -scope reference-observation \
            -subject-kind semantic-relation \
            -subject-id sales.order.customer \
            -direction both -mode full > "$RUNNER_TEMP/tei_trace_identical_workspace.json"
          node reference/tei-topology-coverage/verify-cli-trace.mjs \
            "$RUNNER_TEMP/tei_trace_a.json" \
            "$RUNNER_TEMP/tei_trace_b.json" \
            "$RUNNER_TEMP/tei_trace_other_workspace.json" \
            "$RUNNER_TEMP/tei_trace_identical_workspace.json"
      - name: Verify repository checkout unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
