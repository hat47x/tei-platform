name: Normalize TEI M0.22.1 source

on:
  push:
    branches:
      - bootstrap-source

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out transport branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify source payload
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/final-source/* > /tmp/tei-source.b64
          base64 -d /tmp/tei-source.b64 > /tmp/tei-source.tar.xz
          echo "6e0d22efaa4896c4fc44adf1c543d8950abfa910e2a6a0306ec84b3655acc801  /tmp/tei-source.tar.xz" | sha256sum -c -

      - name: Normalize main and verify executable checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B normalize origin/main

          tar -xJf /tmp/tei-source.tar.xz -C .
          rm -rf bootstrap patches

          mkdir -p reference/observed
          cat > reference/observed/production.deployment-state.json <<'JSON'
          {
            "environment": "production",
            "observedAt": "2026-08-27T18:30:00+09:00",
            "activeApplications": [
              {"application": "order_entry", "version": "3.7.0"}
            ],
            "databases": [
              {
                "database": "sales_core",
                "source": "release",
                "release": "4.0.0",
                "provides": [
                  {"id": "sales_core.order_legacy", "version": {"major": 1, "minor": 0}}
                ],
                "dataReadiness": "ready"
              },
              {
                "database": "master_data",
                "source": "observed",
                "provides": [
                  {"id": "master_data.customer", "version": {"major": 2, "minor": 4}}
                ],
                "dataReadiness": "ready",
                "observedAt": "2026-08-27T18:30:00+09:00"
              }
            ]
          }
          JSON

          cat > reference/observed/production.canary.deployment-state.json <<'JSON'
          {
            "environment": "production",
            "observedAt": "2026-08-28T15:45:00+09:00",
            "activeApplications": [
              {"application": "order_entry", "version": "3.7.0"},
              {"application": "order_entry", "version": "3.8.0"}
            ],
            "applicationRuntime": [
              {
                "application": "order_entry",
                "version": "3.7.0",
                "lifecycle": "serving",
                "trafficBasisPoints": 7000,
                "acceptingWork": true,
                "drainComplete": false
              },
              {
                "application": "order_entry",
                "version": "3.8.0",
                "lifecycle": "serving",
                "trafficBasisPoints": 3000,
                "acceptingWork": true,
                "drainComplete": false
              }
            ],
            "databases": [
              {
                "database": "sales_core",
                "source": "release",
                "release": "4.1.0",
                "provides": [
                  {"id": "sales_core.order_legacy", "version": {"major": 1, "minor": 0}},
                  {"id": "sales_core.order", "version": {"major": 4, "minor": 1}}
                ],
                "dataReadiness": "ready"
              },
              {
                "database": "master_data",
                "source": "observed",
                "provides": [
                  {"id": "master_data.customer", "version": {"major": 2, "minor": 4}}
                ],
                "dataReadiness": "ready",
                "observedAt": "2026-08-28T15:45:00+09:00"
              }
            ]
          }
          JSON

          go run ./cmd/tei world -workspace reference/workspace > reference/world.json

          python3 - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text()
          marker = "## Repository staging note\n"
          next_heading = "## まず動かす\n"
          if marker in text and next_heading in text:
              before, rest = text.split(marker, 1)
              _, after = rest.split(next_heading, 1)
              text = before.rstrip() + "\n\n" + next_heading + after
          readme.write_text(text)

          ci = Path(".github/workflows/ci.yml")
          ci.parent.mkdir(parents=True, exist_ok=True)
          ci.write_text("""name: CI

          on:
            push:
              branches:
                - main
            pull_request:

          permissions:
            contents: read

          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-go@v5
                  with:
                    go-version-file: go.mod
                    cache: false
                - name: Vet
                  run: go vet ./...
                - name: Test
                  run: go test ./...
                - name: Validate reference workspace
                  run: go run ./cmd/tei validate -workspace reference/workspace
                - name: Exercise runtime reattach
                  run: go run ./examples/runtime-reattach
          """.replace("          ", ""))
          PY

          go vet ./...
          go test ./...
          go run ./cmd/tei validate -workspace reference/workspace
          go run ./examples/runtime-reattach

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Normalize M0.22.1 public source tree"
          git push origin HEAD:main
