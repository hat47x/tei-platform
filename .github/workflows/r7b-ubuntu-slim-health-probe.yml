name: R7B ubuntu-slim repository health transfer probe

on:
  push:
    branches:
      - research/selective-knowledge-routing-r6

permissions:
  contents: read

jobs:
  repository-health:
    runs-on: ubuntu-slim
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Record execution revision
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git status --short
          go version
          go env GOOS GOARCH

      - name: Verify canonical packet identity and mode
        shell: bash
        run: |
          set -euo pipefail
          check_blob() {
            path="$1"
            want="$2"
            got="$(git hash-object "$path")"
            test "$got" = "$want" || {
              printf '%s blob=%s want=%s\n' "$path" "$got" "$want" >&2
              exit 1
            }
          }
          check_blob tools/internal/firstwebtargetevidence/semantics.go 9641e3539bb048b13e7e9a4bb245ee457fe1e7a5
          check_blob tools/internal/firstwebtargetevidence/semantics_pressure_test.go 95553ba10756399a50e52e639f7d860f4420f29f
          check_blob tools/internal/firstwebtargetevidence/semantics_test.go ba17f69a7e375cfdeec0db544986d51f99b26192
          check_blob tools/reference-first-web-target-evidence-audit/main.go 3878dae15b06a3b57954cf196b108da1cc03bbc7
          check_blob tools/reference-first-web-target-r7b-repeatability/main.go 7b2cf09460319b13241fa44e59f865d3864734ff
          check_blob tools/reference-first-web-target-r7b-repeatability/main_test.go 30a907578836c9b1b33b79bf4d521fb809a49e74
          check_blob tools/reference-first-web-target-r7b-replay-audit/main.go a370e0c5efc4399e324be7a0ad4801626f05a5da
          check_blob tools/reference-first-web-target-r7b-replay-audit/main_test.go 2fab7e44d49ddb2778a2bcb55cae67c0f48c1c99
          check_blob tools/reference-first-web-target-r7b-replay-plan/main.go 40a1b1b19fa8bf16c43dd2fd0d4f549070efe7ab
          check_blob tools/reference-first-web-target-r7b-replay-plan/main_test.go d8fc5e8a1cadb82783c3804fa04d147c5954b3ed
          check_blob tools/run-first-web-target-r7b-replay.sh 2f55ec06f29bbca8f4a9e6ce04816bd311a8af03
          test "$(git ls-files -s tools/run-first-web-target-r7b-replay.sh | awk '{print $1}')" = "100755"

      - name: Repository health
        shell: bash
        run: |
          set -euo pipefail
          bash tools/repository-health-check.sh

      - name: Create portable Git bundle
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git bundle create tei-r7b-probe.bundle HEAD
          sha256sum tei-r7b-probe.bundle > tei-r7b-probe.bundle.sha256
          git bundle verify tei-r7b-probe.bundle

      - name: Upload portable Git bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tei-r7b-probe-${{ github.sha }}
          path: |
            tei-r7b-probe.bundle
            tei-r7b-probe.bundle.sha256
          if-no-files-found: warn
