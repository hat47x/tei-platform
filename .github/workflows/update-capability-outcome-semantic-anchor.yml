name: Capability Outcome Semantic anchor更新

on:
  push:
    branches:
      - work/capability-outcome-semantic-anchor

permissions:
  contents: write

jobs:
  update-semantic-anchor:
    if: ${{ !contains(github.event.head_commit.message, '[capability-outcome-anchor-generated]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Repositoryを取得
        uses: actions/checkout@v7
        with:
          ref: work/capability-outcome-semantic-anchor

      - name: Goを準備
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Semantic anchor parserへOutcome構文を追加
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("internal/syntax/semantic_anchor.go")
          text = path.read_text()
          old = '''\t\tcase "output":
          \t\t\tif _, err := expectLexerIdent(lx, "semantic capability output type"); err != nil {
          \t\t\t\treturn err
          \t\t\t}
          \t\tdefault:
          \t\t\treturn fmt.Errorf("unexpected semantic capability member %q at %d:%d", t.Text, t.Start.Line, t.Start.Column)
          '''
          new = '''\t\tcase "output":
          \t\t\tif _, err := expectLexerIdent(lx, "semantic capability output type"); err != nil {
          \t\t\t\treturn err
          \t\t\t}
          \t\tcase "outcome":
          \t\t\tif _, err := expectLexerIdent(lx, "semantic capability outcome name"); err != nil {
          \t\t\t\treturn err
          \t\t\t}
          \t\t\tif _, err := expectLexerIdent(lx, "semantic capability outcome payload type"); err != nil {
          \t\t\t\treturn err
          \t\t\t}
          \t\tdefault:
          \t\t\treturn fmt.Errorf("unexpected semantic capability member %q at %d:%d", t.Text, t.Start.Line, t.Start.Column)
          '''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"semantic anchor replacement target count={count}, want=1")
          path.write_text(text.replace(old, new, 1))
          PY

          gofmt -w internal/syntax/semantic_anchor.go internal/syntax/capability_outcome_anchor_test.go
          go test ./internal/syntax
          git diff --check

      - name: 変更をbranchへ反映
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/syntax/semantic_anchor.go internal/syntax/capability_outcome_anchor_test.go
          if git diff --cached --quiet; then
            echo "反映すべき差分がありません。"
            exit 0
          fi
          git commit -m "Capability OutcomeをSemantic anchor parserへ接続する [capability-outcome-anchor-generated]"
          git push origin HEAD:work/capability-outcome-semantic-anchor
