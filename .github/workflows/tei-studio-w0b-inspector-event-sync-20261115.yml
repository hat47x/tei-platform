# Temporary, branch-only asset generation; remove this file before merging.
# Never run with untrusted pull_request code or write to main.
name: TEI Studio W0-B Inspector Event Asset Sync

on:
  push:
    branches:
      - fix/studio-w0b-inspector-event-assets-20261115
    paths:
      - .github/workflows/tei-studio-w0b-inspector-event-sync-20261115.yml

permissions:
  contents: write

concurrency:
  group: tei-studio-w0b-inspector-event-sync-20261115
  cancel-in-progress: false

jobs:
  build-and-commit:
    if: github.ref == 'refs/heads/fix/studio-w0b-inspector-event-assets-20261115'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
          check-latest: false
          cache: npm
          cache-dependency-path: reference/tei-studio-workbench/package-lock.json
      - name: Test, typecheck and build current Workbench
        working-directory: reference/tei-studio-workbench
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm ci --no-audit --no-fund
          npm test
          npm run typecheck
          npm run build
      - name: Synchronize only shipped Workbench files
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html main.js style.css THIRD_PARTY_NOTICES.txt; do
            cp "reference/tei-studio-workbench/dist/$file" "cmd/tei-studio/assets/workbench/$file"
            cmp "reference/tei-studio-workbench/dist/$file" "cmd/tei-studio/assets/workbench/$file"
          done
          test ! -e cmd/tei-studio/assets/workbench/dependencies.json
          sha256sum cmd/tei-studio/assets/workbench/{index.html,main.js,style.css,THIRD_PARTY_NOTICES.txt} >> "$GITHUB_STEP_SUMMARY"
      - name: Commit only generated assets on this branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/fix/studio-w0b-inspector-event-assets-20261115"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- cmd/tei-studio/assets/workbench/index.html \
            cmd/tei-studio/assets/workbench/main.js \
            cmd/tei-studio/assets/workbench/style.css \
            cmd/tei-studio/assets/workbench/THIRD_PARTY_NOTICES.txt
          if git diff --cached --quiet; then
            echo "No generated asset changes." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --cached --stat
          git commit -m "build(studio): refresh embedded Workbench after Inspector event integration"
          git push origin "HEAD:refs/heads/fix/studio-w0b-inspector-event-assets-20261115"
