name: Patch semantic business validation

on:
  push:
    branches:
      - work/business-validation-semantic-contract

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Repositoryを取得
        uses: actions/checkout@v7
        with:
          ref: work/business-validation-semantic-contract

      - name: 共通ValidationとSource Indexを安全に更新
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_business_validation_integration.py
          git diff --check
          if git diff --quiet -- internal/validation/validation.go internal/workspace/source_index.go; then
            echo '既に統合patch済みです。'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/validation/validation.go internal/workspace/source_index.go
          git commit -m "Semantic業務Validationを共通検査とSource Indexへ接続する [business-validation-integrated]"
          git push origin HEAD:work/business-validation-semantic-contract
