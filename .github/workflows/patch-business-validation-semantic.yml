name: Patch semantic business validation

on:
  push:
    branches:
      - work/business-validation-semantic-contract

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Repositoryを取得
        uses: actions/checkout@v7
        with:
          ref: work/business-validation-semantic-contract

      - name: ParserとLoaderを安全に更新
        shell: bash
        run: |
          set -euo pipefail
          if git log -1 --pretty=%B | grep -Fq '[business-validation-patched]'; then
            echo '既にpatch済みです。'
            exit 0
          fi
          python3 tools/patch_business_validation_semantic.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/syntax/parser.go internal/workspace/loader.go
          git commit -m "Semantic業務ValidationをParserとLoaderへ接続する [business-validation-patched]"
          git push origin HEAD:work/business-validation-semantic-contract
