name: TEI Runtime Engine ネイティブ・WebAssembly実行照合

# #973限定の移植性検証。全PRの一律必須条件にしない。
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - tools/reference-transform-runtime-engine/target_conformance_test.go
      - tools/reference-transform-runtime-engine/target_cli_fixture_test.go
      - tools/reference-plugin-self-build/wasm_host_acceptance_test.go
      - tools/check-transform-wasm-conformance.sh
      - .github/workflows/tei-transform-wasm-conformance.yml
  push:
    branches: [main]
    paths:
      - tools/reference-transform-runtime-engine/target_conformance_test.go
      - tools/reference-transform-runtime-engine/target_cli_fixture_test.go
      - tools/reference-plugin-self-build/wasm_host_acceptance_test.go
      - tools/check-transform-wasm-conformance.sh
      - .github/workflows/tei-transform-wasm-conformance.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tei-transform-wasm-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-and-js-wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GOENV: off
      GOWORK: off
      GOFLAGS: ''
      GOTOOLCHAIN: local
    steps:
      - name: 受入候補を取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: リポジトリ指定版のGoを使用
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: 実WebAssemblyとネイティブの型付き応答を照合
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash tools/check-transform-wasm-conformance.sh "$RUNNER_TEMP/tei-transform-wasm"

      - name: 実行後もソースが清浄であることを確認
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: 対象別の実行結果とバイナリ指紋を保存
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tei-transform-native-wasm-${{ github.sha }}
          path: |
            ${{ runner.temp }}/tei-transform-wasm/conformance-evidence.json
            ${{ runner.temp }}/tei-transform-wasm/native-test.log
            ${{ runner.temp }}/tei-transform-wasm/wasm-test.log
            ${{ runner.temp }}/tei-transform-wasm/target-binding-test.log
            ${{ runner.temp }}/tei-transform-wasm/cli-fixture-test.log
            ${{ runner.temp }}/tei-transform-wasm/wasm-host-approval.log
            ${{ runner.temp }}/tei-transform-wasm/native-cli-response.json
            ${{ runner.temp }}/tei-transform-wasm/wasm-cli-response.json
            ${{ runner.temp }}/tei-transform-wasm/cli-expected-response.json
            ${{ runner.temp }}/tei-transform-wasm/go-version.txt
            ${{ runner.temp }}/tei-transform-wasm/node-version.txt
          if-no-files-found: error
          retention-days: 7
