name: TEI Studio Workbench embedded bundle

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - .github/workflows/tei-studio-workbench-embed-ci.yml
      - cmd/tei-studio/assets/workbench/**
      # The bundle also inlines these; a change here without a rebuild leaves
      # the embedded bundle behind its sources.
      - cmd/tei-studio/assets/client.mjs
      - reference/tei-studio-command/**
      - reference/tei-studio-editor/**
      - reference/tei-studio-graph/**
      - reference/tei-studio-workbench/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tei-studio-workbench-embed-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-match-embedded-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
          check-latest: false

      - name: Test and build Workbench
        working-directory: reference/tei-studio-workbench
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm ci --no-audit --no-fund
          npm test
          # R0: compare the new generated Reader against the current product behavior.
          # This does not qualify inclusion in the historical embedded bundle.
          node --test inspection-reader.generated.test.mjs
          npm run typecheck
          npm run build

      - name: Qualify a separate Inspector candidate bundle
        shell: bash
        run: |
          set -euo pipefail
          node --test tools/reference-studio-static-composition/inspector-candidate.test.mjs
          candidate=reference/tei-studio-workbench/main.inspector-candidate.ts
          trap 'rm -f "$candidate"' EXIT
          node tools/reference-studio-static-composition/inspector-candidate.mjs
          (cd reference/tei-studio-workbench && npm run typecheck)
          # Build only in the runner's temp area. The committed Wails bundle
          # remains the historically qualified result of main.ts, not this candidate.
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFile } from "node:fs/promises";
          import { createRequire } from "node:module";
          import { resolve } from "node:path";
          const dir = resolve("reference/tei-studio-workbench");
          const { build } = createRequire(resolve(dir, "package.json"))("esbuild");
          const output = resolve(process.env.RUNNER_TEMP, "tei-p1a2-inspector-candidate.js");
          const result = await build({
            absWorkingDir: dir,
            entryPoints: [resolve(dir, "main.inspector-candidate.ts")],
            outfile: output, bundle: true, format: "esm", platform: "browser",
            target: "es2022", nodePaths: [resolve(dir, "node_modules")],
            metafile: true,
          });
          const inputs = Object.keys(result.metafile.inputs);
          if (!inputs.some(path => path.endsWith("inspector-presentation.ts")))
            throw Error("INSPECTOR_CANDIDATE_PRESENTER_NOT_BUNDLED");
          const bytes = await readFile(output);
          if (!bytes.toString("utf8").includes("presentInspection"))
            throw Error("INSPECTOR_CANDIDATE_PRESENTATION_NOT_USED");
          const historical = await readFile(resolve("cmd/tei-studio/assets/workbench/main.js"));
          if (bytes.equals(historical))
            throw Error("INSPECTOR_CANDIDATE_INCORRECTLY_EQUATED_WITH_HISTORICAL_ASSET");
          console.log(JSON.stringify({
            status: "candidate-bundle-only",
            blob: createHash("sha256").update(bytes).digest("hex"),
            target: "es2022",
            consumerEvidence: "not-run",
          }));
          NODE

      - name: Compare build output with Wails embedded files
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html main.js style.css THIRD_PARTY_NOTICES.txt; do
            cmp "reference/tei-studio-workbench/dist/$file" "cmd/tei-studio/assets/workbench/$file"
          done
          test ! -e cmd/tei-studio/assets/workbench/dependencies.json
