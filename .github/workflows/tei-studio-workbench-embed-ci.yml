name: TEI Studio Workbench embedded bundle

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - .github/workflows/tei-studio-workbench-embed-ci.yml
      - cmd/tei-studio/assets/workbench/**
      - reference/tei-studio-workbench/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tei-studio-workbench-embed-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-match-embedded-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
          check-latest: false

      - name: Test and build Workbench
        working-directory: reference/tei-studio-workbench
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm ci --no-audit --no-fund
          npm test
          npm run typecheck
          npm run build

      # Temporary PR qualification: preserve exact generated bytes for review
      # before the embedded snapshot is committed. Read-only permissions only.
      - name: Capture built Workbench candidate
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tei-studio-workbench-candidate-${{ github.run_id }}
          path: reference/tei-studio-workbench/dist/main.js
          if-no-files-found: error
          retention-days: 1

      # Temporary read-only transfer of the exact build delta (no GitHub write token).
      - name: Report reproducible embedded JS delta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json
          before = Path("cmd/tei-studio/assets/workbench/main.js").read_bytes()
          after = Path("reference/tei-studio-workbench/dist/main.js").read_bytes()
          p = 0
          while p < min(len(before), len(after)) and before[p] == after[p]:
              p += 1
          s = 0
          while s < min(len(before), len(after)) - p and before[-(s + 1)] == after[-(s + 1)]:
              s += 1
          middle = after[p:len(after) - s if s else len(after)]
          if len(middle) > 100000:
              raise SystemExit("delta-too-large; do not print full build")
          payload = json.dumps({"prefix": p, "suffix": s, "middle": middle.decode("utf-8")}, ensure_ascii=True)
          print("TEI_BUNDLE_DELTA_CHECK " + json.dumps({
              "oldBytes": len(before), "newBytes": len(after),
              "sha256Old": sha256(before).hexdigest(),
              "sha256New": sha256(after).hexdigest(),
              "middleBytes": len(middle), "parts": (len(payload) + 499) // 500,
          }))
          for i in range(0, len(payload), 500):
              print("TEI_BUNDLE_DELTA_PART_%04d " % (i // 500) + payload[i:i+500])
          PY

      - name: Compare build output with Wails embedded files
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html main.js style.css THIRD_PARTY_NOTICES.txt; do
            cmp "reference/tei-studio-workbench/dist/$file" "cmd/tei-studio/assets/workbench/$file"
          done
          test ! -e cmd/tei-studio/assets/workbench/dependencies.json
