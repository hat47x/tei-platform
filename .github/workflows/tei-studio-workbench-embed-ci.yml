name: TEI Studio Workbench embedded bundle

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - .github/workflows/tei-studio-workbench-embed-ci.yml
      - cmd/tei-studio/assets/workbench/**
      # The bundle also inlines these; a change here without a rebuild leaves
      # the embedded bundle behind its sources.
      - cmd/tei-studio/assets/client.mjs
      - reference/tei-studio-command/**
      - reference/tei-studio-editor/**
      - reference/tei-studio-graph/**
      - reference/tei-studio-workbench/**
      - tools/reference-studio-part-generator/**
      - tools/reference-studio-static-composition/build-generated-workbench.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tei-studio-workbench-embed-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-match-embedded-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
          check-latest: false

      - name: Setup Go for Data-derived Reader integration
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false

      - name: Test and build Workbench
        working-directory: reference/tei-studio-workbench
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm ci --no-audit --no-fund
          npm test
          # Production entrypoint identity plus independent positive/negative outcomes.
          node --test inspection-reader.generated.test.mjs
          # Generate both Readers from actual *.tei.md Data; bundle each with
          # esbuild and assert independent old/new runtime behavior.
          node --test inspection-reader.model-derived.test.mjs
          npm run typecheck
          npm run build

      - name: Verify historical Inspector candidate against its original source snapshot
        shell: bash
        run: |
          set -euo pipefail
          node --test tools/reference-studio-static-composition/inspector-candidate.test.mjs

      - name: Verify product bundle contains exactly one generated Inspector Reader
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          const root = "reference/tei-studio-workbench/";
          const bundle = readFileSync(root + "dist/main.js", "utf8");
          const contract = JSON.parse(readFileSync(root + "inspection-reader.contract.json", "utf8"));
          const digest = "sha256:" + createHash("sha256").update(JSON.stringify(contract)).digest("hex");
          if (!bundle.includes("// inspection-reader.generated.ts\n"))
            throw Error("PRODUCT_BUNDLE_MISSING_GENERATED_READER");
          if (!bundle.includes('contractDigest: "' + digest + '"'))
            throw Error("PRODUCT_BUNDLE_STALE_READER_CONTRACT");
          if ((bundle.match(/function readInspection\d*\(/g) ?? []).length !== 1)
            throw Error("PRODUCT_BUNDLE_DUPLICATE_INSPECTOR_READERS");
          if (!bundle.includes("teiInspectionReaderCalls") || bundle.includes("seedReadInspection"))
            throw Error("PRODUCT_BUNDLE_READER_USE_NOT_OBSERVABLE");
          console.log("CURRENT_GENERATED_READER_CONTRACT " + digest);
          NODE

      - name: Compare build output with Wails embedded files
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html main.js style.css THIRD_PARTY_NOTICES.txt; do
            cmp "reference/tei-studio-workbench/dist/$file" "cmd/tei-studio/assets/workbench/$file"
          done
          test ! -e cmd/tei-studio/assets/workbench/dependencies.json


