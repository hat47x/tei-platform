name: Legacy Authentication Adapter検証

on:
  push:
    branches:
      - work/legacy-auth-compatibility-reference

permissions:
  contents: write

jobs:
  verify-adapter:
    if: ${{ !contains(github.event.head_commit.message, '[legacy-auth-adapter-formatted]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Repositoryを取得
        uses: actions/checkout@v7
        with:
          ref: work/legacy-auth-compatibility-reference

      - name: Goを準備
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Goコードを整形して単体検証する
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w internal/security/legacyauth/*.go
          go test ./internal/security/legacyauth
          git diff --check

      - name: 整形差分をbranchへ反映
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/security/legacyauth
          if git diff --cached --quiet; then
            echo "Go整形による差分はありません。"
            exit 0
          fi
          git commit -m "legacy認証adapterをGo標準形式へ整える [legacy-auth-adapter-formatted]"
          git push origin HEAD:work/legacy-auth-compatibility-reference
