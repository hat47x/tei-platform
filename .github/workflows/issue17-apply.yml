name: Apply Issue 17 diagnostic subject patch

on:
  push:
    branches:
      - work/issue-17-diagnostic-subject-projection
    paths:
      - .github/workflows/issue17-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/issue-17-diagnostic-subject-projection

      - name: Apply narrow validation patch
        shell: python
        run: |
          from pathlib import Path

          p = Path("internal/validation/validation.go")
          text = p.read_text()

          replacements = [
              (
                  '\t"tei/internal/semantic"\n)',
                  '\t"tei/internal/semantic"\n\t"tei/internal/subject"\n)',
              ),
              (
                  'type Diagnostic struct {\n\tCode     string\n\tSeverity Severity\n\tMessage  string\n}',
                  'type Diagnostic struct {\n\tCode     string           `json:"code"`\n\tSeverity Severity         `json:"severity"`\n\tMessage  string           `json:"message"`\n\tSubject  *subject.Subject `json:"subject,omitempty"`\n}',
              ),
              (
                  'errd("INVALID_PLUGIN_RUNTIME", "plugin %s has invalid runtime %s", p.ID, p.Runtime.Kind)',
                  'errFor(subject.Subject{Kind: "plugin", ID: string(p.ID) + "@" + p.Version}, "INVALID_PLUGIN_RUNTIME", "plugin %s has invalid runtime %s", p.ID, p.Runtime.Kind)',
              ),
              (
                  'errd("SEMANTIC_TYPE_NAMESPACE_MISMATCH", "type %s is declared in semantic namespace %s", typ.ID, ns.ID)',
                  'errFor(subject.Subject{Kind: "semantic-type", ID: string(typ.ID)}, "SEMANTIC_TYPE_NAMESPACE_MISMATCH", "type %s is declared in semantic namespace %s", typ.ID, ns.ID)',
              ),
              (
                  'errd("SEMANTIC_DATA_NAMESPACE_MISMATCH", "data %s is declared in semantic namespace %s", d.ID, ns.ID)',
                  'errFor(subject.Subject{Kind: "semantic-data", ID: string(d.ID)}, "SEMANTIC_DATA_NAMESPACE_MISMATCH", "data %s is declared in semantic namespace %s", d.ID, ns.ID)',
              ),
              (
                  'errd("SEMANTIC_ATTRIBUTE_PARENT_MISMATCH", "attribute %s is declared under data %s", a.ID, d.ID)',
                  'errFor(subject.Subject{Kind: "semantic-attribute", ID: string(a.ID)}, "SEMANTIC_ATTRIBUTE_PARENT_MISMATCH", "attribute %s is declared under data %s", a.ID, d.ID)',
              ),
              (
                  'errd("INVALID_SEMANTIC_RELATION_CARDINALITY", "relation %s has invalid cardinality %q", r.ID, r.Cardinality)',
                  'errFor(subject.Subject{Kind: "semantic-relation", ID: string(r.ID)}, "INVALID_SEMANTIC_RELATION_CARDINALITY", "relation %s has invalid cardinality %q", r.ID, r.Cardinality)',
              ),
              (
                  'errd("DUPLICATE_APPLICATION", "duplicate application %s", a.ID)',
                  'errFor(subject.Subject{Kind: "application", ID: string(a.ID)}, "DUPLICATE_APPLICATION", "duplicate application %s", a.ID)',
              ),
              (
                  'errd("INVALID_DATABASE_ACCESS", "application %s datasource %s has invalid access mode %q", a.ID, r.Alias, r.Access)',
                  'errFor(subject.Subject{Kind: "application", ID: string(a.ID)}, "INVALID_DATABASE_ACCESS", "application %s datasource %s has invalid access mode %q", a.ID, r.Alias, r.Access)',
              ),
              (
                  'errd("INVALID_DATABASE_OWNERSHIP", "database %s has invalid ownership %q", d.ID, d.Ownership)',
                  'errFor(subject.Subject{Kind: "database", ID: string(d.ID)}, "INVALID_DATABASE_OWNERSHIP", "database %s has invalid ownership %q", d.ID, d.Ownership)',
              ),
              (
                  'errd("DATABASE_CONTRACT_NAMESPACE_MISMATCH", "contract %s is declared by database %s but is outside its namespace", c.ID, d.ID)',
                  'errFor(subject.Subject{Kind: "database-contract", ID: string(c.ID)}, "DATABASE_CONTRACT_NAMESPACE_MISMATCH", "contract %s is declared by database %s but is outside its namespace", c.ID, d.ID)',
              ),
              (
                  'func errd(code, format string, args ...any) Diagnostic {\n\treturn Diagnostic{Code: code, Severity: Error, Message: fmt.Sprintf(format, args...)}\n}\n\nfunc warnd(code, format string, args ...any) Diagnostic {\n\treturn Diagnostic{Code: code, Severity: Warning, Message: fmt.Sprintf(format, args...)}\n}',
                  'func errd(code, format string, args ...any) Diagnostic {\n\treturn Diagnostic{Code: code, Severity: Error, Message: fmt.Sprintf(format, args...)}\n}\n\nfunc errFor(s subject.Subject, code, format string, args ...any) Diagnostic {\n\treturn Diagnostic{Code: code, Severity: Error, Message: fmt.Sprintf(format, args...), Subject: &s}\n}\n\nfunc warnd(code, format string, args ...any) Diagnostic {\n\treturn Diagnostic{Code: code, Severity: Warning, Message: fmt.Sprintf(format, args...)}\n}\n\nfunc warnFor(s subject.Subject, code, format string, args ...any) Diagnostic {\n\treturn Diagnostic{Code: code, Severity: Warning, Message: fmt.Sprintf(format, args...), Subject: &s}\n}',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one replacement target, got {count}: {old[:100]!r}")
              text = text.replace(old, new, 1)

          p.write_text(text)

      - name: Format
        run: gofmt -w internal/validation/validation.go internal/sourceindex/model.go internal/subject/subject.go

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/validation/validation.go internal/sourceindex/model.go internal/subject/subject.go
          git commit -m "Diagnosticへpath-independentなSemantic Subjectを追加する"
          git push origin HEAD:work/issue-17-diagnostic-subject-projection
