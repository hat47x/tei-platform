name: Apply Issue 33 process argv model v6

on:
  push:
    branches:
      - work/issue-33-process-argv
    paths:
      - .github/workflows/issue33-process-argv-apply6.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/issue-33-process-argv
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Reuse v5 transformation and migrate ProcessLauncher fixtures
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/issue33-process-argv-apply5.yml').read_text()
          marker = '      - name: Reuse v4 transformation and finish SandboxSpec fixtures\n        shell: python\n        run: |\n'
          start = workflow.index(marker) + len(marker)
          rest = workflow[start:]
          end = rest.index('\n      - name: Format')
          block = rest[:end]
          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  line = line[10:]
              lines.append(line)
          exec(compile('\n'.join(lines), '<issue33-v5-transform>', 'exec'))

          p = Path('internal/plugin/runtime/model_test.go')
          text = p.read_text()
          old = 'func (l *launcher) Invoke(_ context.Context, command string, req pruntime.Request)'
          new = 'func (l *launcher) Invoke(_ context.Context, command pruntime.ProcessCommand, req pruntime.Request)'
          if text.count(old) != 1:
              raise SystemExit(f'launcher signature count={text.count(old)}')
          text = text.replace(old, new, 1)
          text = text.replace('''"command": command''', '''"command": command''')
          count = text.count('''Runtime: plugin.Runtime{Kind: plugin.RuntimeProcess, Command: "python3 -m worker"''')
          if count == 0:
              raise SystemExit('expected legacy process Runtime fixtures')
          text = text.replace(
              '''Runtime: plugin.Runtime{Kind: plugin.RuntimeProcess, Command: "python3 -m worker"''',
              '''Runtime: plugin.Runtime{Kind: plugin.RuntimeProcess, Command: "python3", Args: []string{"-m", "worker"}''',
          )
          p.write_text(text)

      - name: Format
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w $(find internal/plugin internal/syntax tools/reference-deployment-attempt tools/reference-lease-supervision -name '*.go' -type f)
      - name: Static checks
        run: go vet ./...
      - name: Tests
        run: go test ./...
      - name: Commit executable argv core
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/plugin internal/syntax tools/reference-deployment-attempt tools/reference-lease-supervision
          git commit -m "process commandをexecutableとargvへ分離する"
          git push origin HEAD:work/issue-33-process-argv
