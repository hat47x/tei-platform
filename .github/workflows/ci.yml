name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Repositoryを取得
        uses: actions/checkout@v7

      - name: Goを準備
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Goコードの整形を確認
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l cmd internal examples tools)"
          if [[ -n "${unformatted}" ]]; then
            echo "gofmtが必要なファイルがあります:"
            echo "${unformatted}"
            exit 1
          fi

      - name: 静的検査
        run: go vet ./...

      - name: テスト
        run: go test ./...

      - name: Reference Workspaceを検証
        run: go run ./cmd/tei validate -workspace reference/workspace

      - name: Source IndexのQuery追跡経路を確認
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/tei source-index \
            -workspace reference/workspace \
            -subject-kind query \
            -subject-id order_entry.recent_orders \
            > /tmp/tei-source-index-query.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          view = json.loads(Path('/tmp/tei-source-index-query.json').read_text())
          assert view['subject'] == {'kind': 'query', 'id': 'order_entry.recent_orders'}
          refs = {ref['role']: ref['artifactPath'] for ref in view['references']}
          assert refs == {
              'definition': 'applications/order-entry/queries/recent_orders.tei',
              'authoring': 'applications/order-entry/queries/recent_orders.sql',
          }
          assert len(view['artifacts']) == 2
          assert all(a['fingerprint'].startswith('sha256:') for a in view['artifacts'])
          PY

      - name: Reference Worldの再現性を確認
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/tei world \
            -workspace reference/workspace \
            > /tmp/tei-reference-world.json
          diff -u reference/world.json /tmp/tei-reference-world.json

      - name: Plugin Lockの再現性を確認
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/tei plugin-lock \
            -workspace reference/workspace \
            > /tmp/tei-reference-plugin-lock.json
          diff -u \
            reference/workspace/.tei/plugin-lock.json \
            /tmp/tei-reference-plugin-lock.json

      - name: Durable Run fixtureの再現性を確認
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/tei deployment-start \
            -workspace reference/workspace \
            -solution order_rollout \
            -version 2026.8.27 \
            -deployment reference/observed/production.deployment-state.json \
            -run-id order-rollout-prod-m0.21 \
            -plugin-lock reference/workspace/.tei/plugin-lock.json \
            > /tmp/tei-reference-deployment-run.json
          diff -u \
            reference/order_rollout.durable-run.m0.21.start.json \
            /tmp/tei-reference-deployment-run.json

      - name: Deployment executorの参照例を実行
        run: go run ./tools/reference-deployment-attempt > /tmp/tei-reference-deployment-attempt.json

      - name: Reference実process Pluginをbuild
        run: go build -o /tmp/tei-reference-process-plugin ./tools/reference-process-plugin

      - name: DeploymentExecutorを実process経由で実行
        shell: bash
        run: |
          set -euo pipefail
          go run ./examples/process-plugin \
            -plugin /tmp/tei-reference-process-plugin \
            > /tmp/tei-reference-process-result.json
          grep -q '"outcome": "accepted"' /tmp/tei-reference-process-result.json
          grep -q '"boundary": "process"' /tmp/tei-reference-process-result.json
          grep -q 'reference-process://reference-process-command-1' /tmp/tei-reference-process-result.json
          grep -q 'argv=--tei-reference-marker=argv value preserved' /tmp/tei-reference-process-result.json

      - name: Runtime reattachの参照例を実行
        run: go run ./examples/runtime-reattach

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tei
          POSTGRES_PASSWORD: tei-reference-password
          POSTGRES_DB: tei_reference
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tei -d tei_reference"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEI_TEST_POSTGRES_DSN: postgres://tei:tei-reference-password@127.0.0.1:5432/tei_reference?sslmode=disable
    steps:
      - name: Repositoryを取得
        uses: actions/checkout@v7

      - name: Goを準備
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: actual PostgreSQLでDesired / Actual / Diffを検証
        shell: bash
        run: |
          set -euo pipefail
          go run ./tools/reference-postgres-integration > /tmp/tei-postgres-integration.json
          cat /tmp/tei-postgres-integration.json
          grep -q '"connectionDataPersisted": false' /tmp/tei-postgres-integration.json
          grep -q '"actualTables": 2' /tmp/tei-postgres-integration.json
          grep -q '"foreignKeys": 1' /tmp/tei-postgres-integration.json
          grep -q '"foreignKeyDriftDetected": true' /tmp/tei-postgres-integration.json
          grep -q '"viewColumnsObserved": true' /tmp/tei-postgres-integration.json
          grep -q '"materializedViewColumnsObserved": true' /tmp/tei-postgres-integration.json
          grep -q '"kind": "drop-column"' /tmp/tei-postgres-integration.json
          grep -q '"name": "drift_note"' /tmp/tei-postgres-integration.json
          grep -q '"kind": "add-foreign-key"' /tmp/tei-postgres-integration.json
