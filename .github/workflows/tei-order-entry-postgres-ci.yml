name: TEI order_entry実PostgreSQL保存と別process読取（検証専用）

# #1127: order_entryの注文を、Persistence Mappingから導いたDDLの使い捨てPostgreSQLへ書き込み、
# 別processで読み戻す。Source・Host許可は合成であり、人的受理・通常のWeb経路・生成CRUD・
# 製品E2を証明しない。
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/tei-order-entry-postgres-ci.yml'
      - 'tools/reference-order-entry-persistence/**'

permissions:
  contents: read

concurrency:
  group: tei-order-entry-postgres-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  isolated-postgres-order-entry:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tei_fixture
          POSTGRES_PASSWORD: local_fixture_only
          POSTGRES_DB: tei_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tei_fixture -d tei_fixture"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      GOENV: off
      GOWORK: off
      GOFLAGS: ''
      GOTOOLCHAIN: local
      TEI_TEST_POSTGRES_DSN: postgres://tei_fixture:local_fixture_only@127.0.0.1:5432/tei_fixture?sslmode=disable
    steps:
      - name: GitHub仮統合HEADを完全取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 実行前のhead・branchとcleanを照合
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$GITHUB_REF" =~ ^refs/pull/[0-9]+/merge$ ]]
          read -r merge base head extra < <(git rev-list --parents -n 1 HEAD)
          test -z "${extra:-}"
          test "$merge" = "$GITHUB_SHA"
          test "$head" = "${{ github.event.pull_request.head.sha }}"
          [[ "$base" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse --is-shallow-repository)" = false
          test -z "$(git ls-files -v | awk '/^[a-zS]/ {print}')"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored=matching)"
      - name: Go版を確定
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - name: DB不要の試験と、DSNを使う実PostgreSQL試験（空のDBへfixtureを作って消す）
        shell: bash
        run: |
          set -euo pipefail
          go vet ./tools/reference-order-entry-persistence
          go test -count=1 -v ./tools/reference-order-entry-persistence | tee "$RUNNER_TEMP/go-test.log"
          # 実DB試験がSKIPされていないことを確認する。SKIPをPASSとして数えない。
          grep -q -- '--- PASS: TestRealPostgresRoundTrip' "$RUNNER_TEMP/go-test.log"
          ! grep -q -- '--- SKIP: TestRealPostgresRoundTrip' "$RUNNER_TEMP/go-test.log"
      - name: 別processのprepare・write・read・cleanup
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/tei-order-entry-${GITHUB_RUN_ID}"
          mkdir -p "$out"
          go build -o "$out/oe-persist" ./tools/reference-order-entry-persistence
          cd "$GITHUB_WORKSPACE"
          "$out/oe-persist" -mode prepare > "$out/prepare.json"
          "$out/oe-persist" -mode write -prepare-receipt "$out/prepare.json" > "$out/write.json"
          "$out/oe-persist" -mode read -write-receipt "$out/write.json" > "$out/read.json"
          "$out/oe-persist" -mode join -write-receipt "$out/write.json" -read-receipt "$out/read.json" | tee "$out/join.txt"
          # 同じ注文の二度目のsubmitは、pendingの行が無いので失敗し、成功扱いにしない。
          if "$out/oe-persist" -mode write -prepare-receipt "$out/prepare.json" > "$out/write-again.json"; then
            echo "second submit unexpectedly succeeded"; exit 1
          fi
          # 手書きoverlayのreceiptは結合しない。
          printf '%s' '{"evidenceNature":"real-postgres-ephemeral-fixture","repositoryRevision":"x","workingTreeClean":true,"scope":{"handWrittenOverlay":true}}' > "$out/overlay.json"
          if "$out/oe-persist" -mode join -write-receipt "$out/overlay.json" -read-receipt "$out/read.json"; then
            echo "hand-written overlay receipt joined"; exit 1
          fi
          "$out/oe-persist" -mode cleanup -prepare-receipt "$out/prepare.json" > "$out/cleanup.json"
          python3 - "$out" "$GITHUB_SHA" <<'PY'
          import json, pathlib, sys
          out = pathlib.Path(sys.argv[1])
          def load(name): return json.loads((out / name).read_bytes())
          def ensure(cond, what):
              if not cond: raise SystemExit("order_entry receipt mismatch: " + what)
          prepare, write, read, cleanup = (load(n) for n in ("prepare.json", "write.json", "read.json", "cleanup.json"))
          for r in (prepare, write, read, cleanup):
              ensure(r["schema"] == "tei.reference.order-entry-persistence/v0", "schema")
              ensure(r["application"] == "order_entry", "application")
              ensure(r["evidenceNature"] == "real-postgres-ephemeral-fixture", "evidence nature")
              ensure(r["scope"]["productE2"] is False and r["scope"]["syntheticSource"] is True, "scope")
              ensure(r["scope"]["syntheticHostEffectGrant"] is True and r["scope"]["handWrittenOverlay"] is False, "scope")
              ensure(r["scope"]["generatedCrud"] is False and r["scope"]["standardWebPath"] is False, "scope")
              ensure(r["repository"]["repositoryRevision"] == sys.argv[2] and r["repository"]["workingTreeClean"] is True, "exact revision and clean")
              ensure("human-acceptance-of-source" in r["notExecuted"], "not-executed list")
          ensure(prepare["fixtureDatabaseSafety"]["guardPassed"] is True, "unsafe database")
          ensure(prepare["prepare"]["schemaMatchesDesiredAfterCreate"] is True, "derived DDL does not match observed schema")
          ensure(write["write"]["commandDispatched"] is True and write["write"]["gateRefused"] is False, "command not dispatched")
          obs = read["observation"]
          ensure(obs["observationStatus"] == "observed", "independent read")
          ensure(obs["commandId"] == write["write"]["commandId"], "command id correlation")
          ensure(write["process"]["processId"] != read["process"]["processId"], "same process")
          ensure(write["process"]["backendPid"] != read["process"]["backendPid"], "same DB connection")
          ensure(obs["sourceRevisionMatchesWrite"] is True, "source revision")
          ensure(cleanup["cleanup"]["verified"] is True, "fixture cleanup")
          print(json.dumps({"head": sys.argv[2], "scope": "order_entry real PostgreSQL write + separate-process read; synthetic Source/Host grant; not product E2",
                            "differentProcesses": True, "differentDbConnections": True, "observation": obs["observationStatus"]}, sort_keys=True))
          PY
      - name: 検証用原本receiptを短期間保全
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tei-order-entry-postgres-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/tei-order-entry-${{ github.run_id }}/prepare.json
            ${{ runner.temp }}/tei-order-entry-${{ github.run_id }}/write.json
            ${{ runner.temp }}/tei-order-entry-${{ github.run_id }}/read.json
            ${{ runner.temp }}/tei-order-entry-${{ github.run_id }}/cleanup.json
            ${{ runner.temp }}/tei-order-entry-${{ github.run_id }}/join.txt
          retention-days: 7
          if-no-files-found: error
      - name: 実行後のhead・checkoutを再検証
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git ls-files -v | awk '/^[a-zS]/ {print}')"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored=matching)"
