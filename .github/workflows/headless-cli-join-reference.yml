name: Headless CLI operation-artifact join reference

on:
  pull_request:
    branches: [main]
    paths:
      - 'plan/fixtures/headless-cli-join/**'
      - '.github/workflows/headless-cli-join-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

# 同じPRの古い実行だけを取り消し、mainへのpushは取り消さない（#3682）。
concurrency:
  group: tei-headless-cli-join-reference-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  synthetic-witness-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ env.EXPECTED_HEAD }}
      - name: Run bounded comparator cases
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 -B -m unittest -v plan/fixtures/headless-cli-join/test_verify_cli_surface_artifact.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  observed-real-tei-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      GOENV: off
      GOWORK: off
      GOTOOLCHAIN: local
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ env.EXPECTED_HEAD }}
      - name: Install Go version declared by checked sources
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - name: Execute separate real read-only CLI requests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          go build -o "$RUNNER_TEMP/tei" ./cmd/tei
          python3 -B plan/fixtures/headless-cli-join/verify_cli_surface_artifact.py \
            --binary "$RUNNER_TEMP/tei" \
            --workspace reference/workspace \
            --application order_entry \
            --expected-head "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
