name: Verify Issue 50 advanced index unit conformance

on:
  push:
    branches: [work/issue-50-core-model]
    paths:
      - .github/workflows/issue50-unit-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: test -z "$(gofmt -l cmd internal examples tools)"
      - run: go vet ./...
      - run: go test ./...
