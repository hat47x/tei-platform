name: REA T0 saved-report audit (test-only)

on:
  push:
    branches:
      - docs/rea-t0-evidence-admission-20261108
    paths:
      - 'tools/rea-t0-saved-report/**'
      - '.github/workflows/rea-t0-saved-report-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/rea-t0-saved-report/**'
      - '.github/workflows/rea-t0-saved-report-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

# Cancel only stale PR runs; never cancel an independent main/branch run.
concurrency:
  group: rea-t0-saved-report-audit-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  saved-report-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Python and read-only audit regression
        run: |
          python3 --version
          python3 -m unittest discover -s tools/rea-t0-saved-report -v
          python3 -m py_compile tools/rea-t0-saved-report/audit.py tools/rea-t0-saved-report/test_audit.py tools/rea-t0-saved-report/project_observations.py tools/rea-t0-saved-report/test_project_observations.py
      - name: Evidence qualification ceiling
        run: |
          echo "Test-only consumer of synthetic saved reports. No REA CLI/provider or TEI T1-A/T1-B invoked."
