name: Submit Binding Loader再接続

on:
  push:
    branches:
      - work/submit-capability-binding-reference

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[binding-loader-rebased]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Repositoryを取得
        uses: actions/checkout@v7
        with:
          ref: work/submit-capability-binding-reference

      - name: Goを準備
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: 最新LoaderへBinding source keyを一か所だけ反映
        shell: python
        run: |
          from pathlib import Path
          path = Path('internal/workspace/loader.go')
          text = path.read_text()
          old = 'r.Sources["binding:"+string(b.Capability)] = SourceLocation{File: relPath(root, bpath), Line: 1, Column: 1}'
          new = 'r.Sources["binding:"+b.Identity()] = SourceLocation{File: relPath(root, bpath), Line: 1, Column: 1}'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'loader replacement count={count} want=1')
          path.write_text(text.replace(old, new))

      - name: Goコードを整形
        run: gofmt -w internal/workspace/loader.go

      - name: Reference Worldを再生成
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/tei world -workspace reference/workspace > /tmp/world.json
          mv /tmp/world.json reference/world.json

      - name: 全Unit testを実行
        run: go test ./...

      - name: 差分を検査
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- internal/workspace/loader.go reference/world.json

      - name: branchへ反映
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/workspace/loader.go reference/world.json
          if git diff --cached --quiet; then
            echo "反映する差分はありません。"
            exit 0
          fi
          git commit -m "Binding Loaderを最新mainへ再接続する [binding-loader-rebased]"
          git push origin HEAD:work/submit-capability-binding-reference
