name: Knowledge portability reference evidence

# 2026-09-22:
# GitHub Actions monthly usage has been exceeded. Keep this workflow manual-only
# and keep the job disabled so an accidental dispatch cannot consume hosted-runner
# time. Re-enable only after the monthly budget/usage state is intentionally reset
# and Actions use is explicitly resumed. The same verification remains runnable
# locally through the script.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # Deliberate monthly-usage pause: no hosted runner must be allocated.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Run focused Knowledge Portability Reference Evidence
        shell: bash
        env:
          TEI_REFERENCE_EVIDENCE_OUT: knowledge-portability-reference-test.txt
        run: bash tools/run-knowledge-portability-reference-evidence.sh

      - name: Upload Reference Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-portability-reference-evidence
          path: knowledge-portability-reference-test.txt
          if-no-files-found: warn
