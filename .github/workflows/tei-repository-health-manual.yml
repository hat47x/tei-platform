name: TEI repository health (manual)

# Issue #1189. Manual-only: no PR, push, or scheduled runner usage.
# A manual dispatch is a separate, intentional decision to consume Actions capacity.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tei-manual-repository-health
  cancel-in-progress: false

jobs:
  repository-health:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GOENV: off
      GOWORK: off
      GOFLAGS: ''
      GOTOOLCHAIN: local
    steps:
      - name: Check out the dispatched revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact revision and initial cleanliness
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$GITHUB_SHA" "$actual"
          test "$actual" = "$GITHUB_SHA"
          dirt="$(git status --porcelain=v1 --untracked-files=all --ignored=matching)"
          if [[ -n "$dirt" ]]; then
            printf 'Initial checkout is not clean:\n%s\n' "$dirt" >&2
            exit 1
          fi

      - name: Set up exact Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false

      - name: Run full repository health check
        shell: bash
        run: |
          set -euo pipefail
          go version
          bash tools/repository-health-check.sh

      - name: Verify final revision and clean checkout
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$GITHUB_SHA" "$actual"
          test "$actual" = "$GITHUB_SHA"
          dirt="$(git status --porcelain=v1 --untracked-files=all --ignored=matching)"
          if [[ -n "$dirt" ]]; then
            printf 'Final checkout is not clean:\n%s\n' "$dirt" >&2
            exit 1
          fi
