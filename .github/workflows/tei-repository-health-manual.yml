name: TEI repository health (manual)

# Issue #1189. Manual-only: no PR, push, or scheduled runner usage.
# A manual dispatch is a separate, intentional decision to consume Actions capacity.
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact 40-character commit SHA to test
        required: true
        type: string
      expected_main_sha:
        description: Exact main commit SHA used as the qualification baseline
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tei-manual-repository-health
  cancel-in-progress: false

jobs:
  repository-health:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GOENV: off
      GOWORK: off
      GOFLAGS: ''
      GOTOOLCHAIN: local
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
    steps:
      - name: Check out the dispatched revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact revision and initial cleanliness
        shell: bash
        run: |
          set -euo pipefail
          # Reject an implicit or stale choice of the tested branch and baseline.
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          # Only branch events are qualified; reject tag dispatches.
          [[ "$GITHUB_REF" == refs/heads/* ]]
          actual="$(git rev-parse HEAD)"
          source_tip="$(git ls-remote --exit-code https://github.com/hat47x/tei-platform.git "$GITHUB_REF" | cut -f1)"
          main_tip="$(git ls-remote --exit-code https://github.com/hat47x/tei-platform.git refs/heads/main | cut -f1)"
          printf 'expected-head=%s\nactual-head=%s\nevent-head=%s\nsource-ref=%s\nsource-tip=%s\nexpected-main=%s\nactual-main=%s\n' \
            "$EXPECTED_HEAD_SHA" "$actual" "$GITHUB_SHA" "$GITHUB_REF" "$source_tip" "$EXPECTED_MAIN_SHA" "$main_tip"
          test "$actual" = "$EXPECTED_HEAD_SHA"
          test "$actual" = "$GITHUB_SHA"
          test "$source_tip" = "$EXPECTED_HEAD_SHA"
          test "$main_tip" = "$EXPECTED_MAIN_SHA"
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" "$actual"
          dirt="$(git status --porcelain=v1 --untracked-files=all --ignored=matching)"
          if [[ -n "$dirt" ]]; then
            printf 'Initial checkout is not clean:\n%s\n' "$dirt" >&2
            exit 1
          fi

      - name: Set up exact Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false

      - name: Run full repository health check
        shell: bash
        run: |
          set -euo pipefail
          go version
          bash tools/repository-health-check.sh

      - name: Verify final revision and clean checkout
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          # Only branch events are qualified; reject tag dispatches.
          [[ "$GITHUB_REF" == refs/heads/* ]]
          actual="$(git rev-parse HEAD)"
          source_tip="$(git ls-remote --exit-code https://github.com/hat47x/tei-platform.git "$GITHUB_REF" | cut -f1)"
          main_tip="$(git ls-remote --exit-code https://github.com/hat47x/tei-platform.git refs/heads/main | cut -f1)"
          printf 'expected-head=%s\nactual-head=%s\nevent-head=%s\nsource-ref=%s\nsource-tip=%s\nexpected-main=%s\nactual-main=%s\n' \
            "$EXPECTED_HEAD_SHA" "$actual" "$GITHUB_SHA" "$GITHUB_REF" "$source_tip" "$EXPECTED_MAIN_SHA" "$main_tip"
          test "$actual" = "$EXPECTED_HEAD_SHA"
          test "$actual" = "$GITHUB_SHA"
          test "$source_tip" = "$EXPECTED_HEAD_SHA"
          test "$main_tip" = "$EXPECTED_MAIN_SHA"
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" "$actual"
          dirt="$(git status --porcelain=v1 --untracked-files=all --ignored=matching)"
          if [[ -n "$dirt" ]]; then
            printf 'Final checkout is not clean:\n%s\n' "$dirt" >&2
            exit 1
          fi
