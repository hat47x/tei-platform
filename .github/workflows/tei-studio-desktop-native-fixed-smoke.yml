name: TEI Studio Desktop native fixed smoke
on:
  push:
    branches:
      - test/studio-desktop-generated-fixed-20261015

permissions:
  contents: read

jobs:
  native-desktop:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      GOWORK: off
      HOST_SOURCE_SHA: 4bc437c72e63a3b5d578b1efe2c60be510a9f8a9
      GENERATOR_SOURCE_SHA: fe8e37b1c735dc138c36cb2d37db94ee44424b9e
    steps:
      - name: Host fixed-source snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2 # pin HEAD^ = exact Host source commit
      - name: Pin Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - name: Generate exactly pinned services and native EXE
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$HOST_SOURCE_SHA"
          test "$(go version | awk '{print $3}')" = go1.26.9
          git fetch --no-tags --depth=50 https://github.com/hat47x/tei-platform.git refs/pull/1833/head
          git cat-file -e "$GENERATOR_SOURCE_SHA^{commit}"
          git archive "$GENERATOR_SOURCE_SHA" tools/reference-studio-static-composition | tar -xf -
          go run ./tools/reference-studio-static-composition \
            -fixture tools/reference-studio-static-composition/fixture.json \
            -out internal/studiohost/staticservices
          sha256sum internal/studiohost/staticservices/services.generated.go
          test "$(sha256sum internal/studiohost/staticservices/services.generated.go | cut -d' ' -f1)" = 867501c5a98d71337178d8bd7995e2e4eb6d276accd25151a2c18d8cb5adee50
          cd cmd/tei-studio
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go build -mod=readonly -tags studio_generated -o "$RUNNER_TEMP/tei-studio-generated.exe" .
          test -s "$RUNNER_TEMP/tei-studio-generated.exe"
          sha256sum "$RUNNER_TEMP/tei-studio-generated.exe"
      - name: Start native Wails desktop, capture window, close normally
        shell: pwsh
        working-directory: cmd/tei-studio
        run: |
          $ErrorActionPreference = 'Stop'
          $env:WAILS_SERVER_HOST = '127.0.0.1'
          $exe = Join-Path $env:RUNNER_TEMP 'tei-studio-generated.exe'
          $log = Join-Path $env:RUNNER_TEMP 'tei-studio-desktop-native-observations.txt'
          $observations = New-Object System.Collections.Generic.List[string]
          $observations.Add("HOST_SOURCE_SHA=$env:HOST_SOURCE_SHA")
          $observations.Add("GENERATOR_SOURCE_SHA=$env:GENERATOR_SOURCE_SHA")
          $observations.Add("GO_VERSION=$(go version)")
          $observations.Add("OS=$([System.Environment]::OSVersion.VersionString)")
          $observations.Add("BUILD_TAGS=studio_generated")
          $observations.Add("WAILS_SERVER_HOST=127.0.0.1")
          $observations.Add("EXE_SHA256=$((Get-FileHash $exe -Algorithm SHA256).Hash)")
          Add-Type -AssemblyName System.Drawing
          Add-Type -TypeDefinition @'
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public static class FixedNativeWindow {
              private delegate bool EnumProc(IntPtr hWnd, IntPtr unused);
              [StructLayout(LayoutKind.Sequential)]
              public struct Rect { public int Left, Top, Right, Bottom; }
              [DllImport("user32.dll")] private static extern bool EnumWindows(EnumProc callback, IntPtr unused);
              [DllImport("user32.dll")] private static extern uint GetWindowThreadProcessId(IntPtr hWnd, out uint processId);
              [DllImport("user32.dll", CharSet=CharSet.Unicode)] private static extern int GetWindowText(IntPtr hWnd, StringBuilder text, int capacity);
              [DllImport("user32.dll")] private static extern bool IsWindowVisible(IntPtr hWnd);
              [DllImport("user32.dll")] private static extern bool GetWindowRect(IntPtr hWnd, out Rect rect);
              [DllImport("user32.dll")] public static extern bool PrintWindow(IntPtr hWnd, IntPtr hDc, uint flags);
              [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr hWnd, uint msg, IntPtr wParam, IntPtr lParam);
              public static IntPtr Find(uint pid) {
                  IntPtr found = IntPtr.Zero;
                  EnumWindows((window, unused) => {
                      uint owner;
                      GetWindowThreadProcessId(window, out owner);
                      var s = new StringBuilder(512);
                      GetWindowText(window, s, s.Capacity);
                      if (owner == pid && IsWindowVisible(window) && s.ToString().Contains("TEI Studio")) {
                          found = window;
                          return false;
                      }
                      return true;
                  }, IntPtr.Zero);
                  return found;
              }
              public static Rect Bounds(IntPtr window) {
                  Rect r;
                  if (!GetWindowRect(window, out r)) throw new Exception("GetWindowRect failed");
                  return r;
              }
          }
          '@
          $proc = $null
          $normalExit = $false
          try {
            $proc = Start-Process -FilePath $exe -ArgumentList @('-workspace','../../reference/workspace','-port','43133') -WorkingDirectory (Get-Location).Path -PassThru
            $observations.Add("PID=$($proc.Id)")
            $observations.Add("STARTED_UTC=$(Get-Date -AsUTC -Format o)")
            $win = [IntPtr]::Zero
            for ($i = 0; $i -lt 45; $i++) {
              Start-Sleep -Seconds 1
              $proc.Refresh()
              if ($proc.HasExited) { break }
              $win = [FixedNativeWindow]::Find([uint32]$proc.Id)
              if ($win -ne [IntPtr]::Zero) { break }
            }
            if ($win -eq [IntPtr]::Zero) {
              $observations.Add("WINDOW_RESULT=FAIL_NO_VISIBLE_NATIVE_WINDOW")
              throw "No visible TEI Studio native window observed"
            }
            $rect = [FixedNativeWindow]::Bounds($win)
            $width = $rect.Right - $rect.Left
            $height = $rect.Bottom - $rect.Top
            $observations.Add("WINDOW_RESULT=FOUND")
            $observations.Add("WINDOW_GEOMETRY=$($rect.Left),$($rect.Top),$width,$height")
            if ($width -lt 400 -or $height -lt 250) { throw "Desktop native window dimensions invalid" }
            Start-Sleep -Seconds 5
            $viewProcesses = @(Get-CimInstance Win32_Process -Filter "Name='msedgewebview2.exe'" -ErrorAction SilentlyContinue)
            $observations.Add("WEBVIEW2_PROCESS_COUNT=$($viewProcesses.Count)")
            $bitmap = [System.Drawing.Bitmap]::new($width,$height)
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            try {
              $dc = $graphics.GetHdc()
              try {
                $printed = [FixedNativeWindow]::PrintWindow($win,$dc,2)
              } finally {
                $graphics.ReleaseHdc($dc)
              }
              $observations.Add("PRINTWINDOW_RESULT=$printed")
              $bitmap.Save((Join-Path $env:RUNNER_TEMP 'tei-studio-desktop-native-window.png'),[System.Drawing.Imaging.ImageFormat]::Png)
            } finally {
              $graphics.Dispose()
              $bitmap.Dispose()
            }
            $observations.Add("SCREENSHOT_CAPTURED=window PNG (not automatically verified as visible WebView content)")
            if (-not [FixedNativeWindow]::PostMessage($win,16,[IntPtr]::Zero,[IntPtr]::Zero)) {
              throw "WM_CLOSE post failed"
            }
            if (-not $proc.WaitForExit(20000)) {
              $observations.Add("NORMAL_CLOSE_RESULT=FAIL_TIMEOUT")
              throw "Native window close did not terminate the process"
            }
            $observations.Add("NORMAL_CLOSE_RESULT=EXITED")
            $observations.Add("EXIT_CODE=$($proc.ExitCode)")
            $observations.Add("EXITED_UTC=$(Get-Date -AsUTC -Format o)")
            if ($proc.ExitCode -ne 0) { throw "Nonzero exit on native WM_CLOSE" }
            $normalExit = $true
          } finally {
            if ($null -ne $proc) {
              $proc.Refresh()
              if (-not $proc.HasExited) {
                $observations.Add("FORCED_CLEANUP=YES (not counted as normal exit)")
                Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              }
            }
            $observations | Set-Content -Path $log -Encoding utf8
            Get-Content $log | Write-Host
          }
          if (-not $normalExit) { throw 'Native normal close unverified' }
      - name: Save native observation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tei-studio-desktop-fixed-native-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/tei-studio-desktop-native-*.txt
            ${{ runner.temp }}/tei-studio-desktop-native-*.png
          retention-days: 7
          if-no-files-found: ignore
