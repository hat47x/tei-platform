name: Semantic Relation key Parser patch

on:
  push:
    branches:
      - work/semantic-relation-key-parser

permissions:
  contents: write

jobs:
  patch-parser:
    if: ${{ !contains(github.event.head_commit.message, '[relation-key-parser-patched]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Repositoryを取得
        uses: actions/checkout@v7
        with:
          ref: work/semantic-relation-key-parser

      - name: ParserのRelation生成だけを置換
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("internal/syntax/parser.go")
          text = path.read_text()

          old = '''\t\t\trid, _ := core.ParseCanonicalID(string(id) + "." + rseg)
          \t\t\td.Relations = append(d.Relations, semantic.Relation{ID: rid, Symbol: rSym.Text, Target: target, Cardinality: semantic.Cardinality(cardTok.Text)})
          '''
          new = '''\t\t\trid, _ := core.ParseCanonicalID(string(id) + "." + rseg)
          \t\t\tkeys, err := p.parseSemanticRelationKeyBlock(rSym)
          \t\t\tif err != nil {
          \t\t\t\treturn d, err
          \t\t\t}
          \t\t\td.Relations = append(d.Relations, semantic.Relation{ID: rid, Symbol: rSym.Text, Target: target, Cardinality: semantic.Cardinality(cardTok.Text), Keys: keys})
          '''

          count = text.count(old)
          if count != 1:
              raise SystemExit(f"置換対象のRelation生成箇所が1件ではありません: {count}")

          path.write_text(text.replace(old, new, 1))
          PY

          gofmt -w internal/syntax/parser.go internal/syntax/semantic_relation_key.go internal/syntax/semantic_relation_key_test.go

          changed_files="$(git diff --name-only)"
          if [ "$changed_files" != "internal/syntax/parser.go" ]; then
            echo "想定外の差分があります:"
            printf '%s\n' "$changed_files"
            exit 1
          fi

          added="$(git diff --numstat -- internal/syntax/parser.go | awk '{print $1}')"
          deleted="$(git diff --numstat -- internal/syntax/parser.go | awk '{print $2}')"
          if [ -z "$added" ] || [ "$added" -gt 6 ] || [ "$deleted" -gt 2 ]; then
            echo "parser.goの差分が想定より大きいです: +${added:-?} -${deleted:-?}"
            exit 1
          fi

      - name: 変更をbranchへ反映
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/syntax/parser.go
          git commit -m "Semantic Relation key authoringをParserへ接続する [relation-key-parser-patched]"
          git push origin HEAD:work/semantic-relation-key-parser
