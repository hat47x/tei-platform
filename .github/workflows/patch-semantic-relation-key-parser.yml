name: Semantic Relation key Parser patch

on:
  push:
    branches:
      - work/semantic-relation-key-parser

permissions:
  contents: write

jobs:
  patch-parser:
    if: ${{ !contains(github.event.head_commit.message, '[relation-key-parser-patched]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Repositoryを取得
        uses: actions/checkout@v7
        with:
          ref: work/semantic-relation-key-parser

      - name: ParserのRelation blockだけを置換
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("internal/syntax/parser.go")
          text = path.read_text()

          old = '''\t\tcase "relation":
          \t\t\t_, _ = p.next()
          \t\t\trSym, err := p.expect(TokenIdent)
          \t\t\tif err != nil {
          \t\t\t\treturn d, err
          \t\t\t}
          \t\t\tif _, err := p.expectText("to"); err != nil {
          \t\t\t\treturn d, err
          \t\t\t}
          \t\t\ttargetTok, err := p.expect(TokenIdent)
          \t\t\tif err != nil {
          \t\t\t\treturn d, err
          \t\t\t}
          \t\t\ttarget, err := core.ParseCanonicalID(targetTok.Text)
          \t\t\tif err != nil {
          \t\t\t\treturn d, p.errAt(targetTok, err.Error())
          \t\t\t}
          \t\t\tcardTok, err := p.expect(TokenIdent)
          \t\t\tif err != nil {
          \t\t\t\treturn d, err
          \t\t\t}
          \t\t\trseg, err := core.SymbolToSegment(rSym.Text)
          \t\t\tif err != nil {
          \t\t\t\treturn d, p.errAt(rSym, err.Error())
          \t\t\t}
          \t\t\trid, _ := core.ParseCanonicalID(string(id) + "." + rseg)
          \t\t\td.Relations = append(d.Relations, semantic.Relation{ID: rid, Symbol: rSym.Text, Target: target, Cardinality: semantic.Cardinality(cardTok.Text)})
          '''

          new = '''\t\tcase "relation":
          \t\t\t_, _ = p.next()
          \t\t\trSym, err := p.expect(TokenIdent)
          \t\t\tif err != nil {
          \t\t\t\treturn d, err
          \t\t\t}
          \t\t\tif _, err := p.expectText("to"); err != nil {
          \t\t\t\treturn d, err
          \t\t\t}
          \t\t\ttargetTok, err := p.expect(TokenIdent)
          \t\t\tif err != nil {
          \t\t\t\treturn d, err
          \t\t\t}
          \t\t\ttarget, err := core.ParseCanonicalID(targetTok.Text)
          \t\t\tif err != nil {
          \t\t\t\treturn d, p.errAt(targetTok, err.Error())
          \t\t\t}
          \t\t\tcardTok, err := p.expect(TokenIdent)
          \t\t\tif err != nil {
          \t\t\t\treturn d, err
          \t\t\t}
          \t\t\trseg, err := core.SymbolToSegment(rSym.Text)
          \t\t\tif err != nil {
          \t\t\t\treturn d, p.errAt(rSym, err.Error())
          \t\t\t}
          \t\t\trid, _ := core.ParseCanonicalID(string(id) + "." + rseg)
          \t\t\trelation := semantic.Relation{ID: rid, Symbol: rSym.Text, Target: target, Cardinality: semantic.Cardinality(cardTok.Text)}
          
          \t\t\tnext, err := p.peek()
          \t\t\tif err != nil {
          \t\t\t\treturn d, err
          \t\t\t}
          \t\t\tif next.Kind == TokenLBrace {
          \t\t\t\t_, _ = p.next()
          \t\t\t\tfor {
          \t\t\t\t\tkeyTok, err := p.peek()
          \t\t\t\t\tif err != nil {
          \t\t\t\t\t\treturn d, err
          \t\t\t\t\t}
          \t\t\t\t\tif keyTok.Kind == TokenRBrace {
          \t\t\t\t\t\t_, _ = p.next()
          \t\t\t\t\t\tbreak
          \t\t\t\t\t}
          \t\t\t\t\tif _, err := p.expectText("key"); err != nil {
          \t\t\t\t\t\treturn d, err
          \t\t\t\t\t}
          \t\t\t\t\tsourceTok, err := p.expect(TokenIdent)
          \t\t\t\t\tif err != nil {
          \t\t\t\t\t\treturn d, err
          \t\t\t\t\t}
          \t\t\t\t\tsourceAttribute, err := core.ParseCanonicalID(sourceTok.Text)
          \t\t\t\t\tif err != nil {
          \t\t\t\t\t\treturn d, p.errAt(sourceTok, err.Error())
          \t\t\t\t\t}
          \t\t\t\t\tif _, err := p.expect(TokenArrow); err != nil {
          \t\t\t\t\t\treturn d, err
          \t\t\t\t\t}
          \t\t\t\t\ttargetAttributeTok, err := p.expect(TokenIdent)
          \t\t\t\t\tif err != nil {
          \t\t\t\t\t\treturn d, err
          \t\t\t\t\t}
          \t\t\t\t\ttargetAttribute, err := core.ParseCanonicalID(targetAttributeTok.Text)
          \t\t\t\t\tif err != nil {
          \t\t\t\t\t\treturn d, p.errAt(targetAttributeTok, err.Error())
          \t\t\t\t\t}
          \t\t\t\t\trelation.Keys = append(relation.Keys, semantic.RelationKey{
          \t\t\t\t\t\tSourceAttribute: sourceAttribute,
          \t\t\t\t\t\tTargetAttribute: targetAttribute,
          \t\t\t\t\t})
          \t\t\t\t}
          \t\t\t\tif len(relation.Keys) == 0 {
          \t\t\t\t\treturn d, p.errAt(rSym, "relation key block requires at least one key mapping")
          \t\t\t\t}
          \t\t\t}
          \t\t\td.Relations = append(d.Relations, relation)
          '''

          count = text.count(old)
          if count != 1:
              raise SystemExit(f"置換対象のRelation block数が1件ではありません: {count}")

          path.write_text(text.replace(old, new, 1))
          PY

          gofmt -w internal/syntax/parser.go internal/syntax/semantic_relation_key_test.go

          if [ "$(git diff --numstat -- internal/syntax/parser.go | awk '{print NF}')" -eq 0 ]; then
            echo "parser.goに差分がありません。"
            exit 1
          fi

      - name: 変更をbranchへ反映
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/syntax/parser.go internal/syntax/semantic_relation_key_test.go
          git commit -m "Semantic Relation key authoringをParserへ追加する [relation-key-parser-patched]"
          git push origin HEAD:work/semantic-relation-key-parser
