name: Apply Issue 33 process argv model v4

on:
  push:
    branches:
      - work/issue-33-process-argv
    paths:
      - .github/workflows/issue33-process-argv-apply4.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/issue-33-process-argv
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Reuse v3 transformation and finish runner migration
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/issue33-process-argv-apply3.yml').read_text()
          marker = '      - name: Reuse v2 model transformation\n        shell: python\n        run: |\n'
          start = workflow.index(marker) + len(marker)
          rest = workflow[start:]
          end = rest.index('\n      - name: Format')
          block = rest[:end]
          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  line = line[10:]
              lines.append(line)
          exec(compile('\n'.join(lines), '<issue33-v3-transform>', 'exec'))

          p = Path('internal/plugin/runtime/host_sandbox_test.go')
          out = []
          changed = 0
          for line in p.read_text().splitlines():
              if 'InvokeSandboxed' in line and ' string,' in line:
                  line = line.replace(' string,', ' pruntime.ProcessCommand,', 1)
                  changed += 1
              out.append(line)
          p.write_text('\n'.join(out) + '\n')
          if changed == 0:
              raise SystemExit('expected at least one remaining sandbox runner signature')
          if any('InvokeSandboxed' in line and ' string,' in line for line in out):
              raise SystemExit('old sandbox runner signature remains')

      - name: Format
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w $(find internal/plugin internal/syntax tools/reference-deployment-attempt tools/reference-lease-supervision -name '*.go' -type f)
      - name: Static checks
        run: go vet ./...
      - name: Tests
        run: go test ./...
      - name: Commit executable argv core
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/plugin internal/syntax tools/reference-deployment-attempt tools/reference-lease-supervision
          git commit -m "process commandをexecutableとargvへ分離する"
          git push origin HEAD:work/issue-33-process-argv
