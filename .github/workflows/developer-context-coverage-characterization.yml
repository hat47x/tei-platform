name: TEI developer context bounded discovery characterization

on:
  pull_request:
    paths:
      - "tools/reference-developer-context/**"
      - ".github/workflows/developer-context-coverage-characterization.yml"
      - "plan/evaluations/TEI_DEVELOPER_CONTEXT_P2_ACCEPTANCE_2026-11.md"
  push:
    paths:
      - "tools/reference-developer-context/**"
      - ".github/workflows/developer-context-coverage-characterization.yml"
      - "plan/evaluations/TEI_DEVELOPER_CONTEXT_P2_ACCEPTANCE_2026-11.md"

permissions:
  contents: read

jobs:
  bounded-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Characterize current Discover and Rerank on public temp directories
        run: |
          go test ./tools/reference-developer-context -run 'Test(Discovery|Rerank|CollectionComparison|CollectionFactorial)' -v -count=1
      - name: Preview gofmt output for public characterization files
        run: |
          for p in tools/reference-developer-context/bounded_collection_comparison_test.go tools/reference-developer-context/collection_selection_factorial_test.go tools/reference-developer-context/source_rename_and_scoring_characterization_test.go; do
            gofmt -w "$p"
            echo "TEMP_FORMAT_DUMP_BEGIN_20261104:$p"
            base64 -w 0 "$p"
            echo
            echo "TEMP_FORMAT_DUMP_END_20261104:$p"
          done
