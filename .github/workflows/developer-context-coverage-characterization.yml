name: TEI developer context bounded discovery characterization

on:
  pull_request:
    paths:
      - "tools/reference-developer-context/**"
      - ".github/workflows/developer-context-coverage-characterization.yml"
      - "plan/evaluations/TEI_DEVELOPER_CONTEXT_P2_ACCEPTANCE_2026-11.md"
  push:
    paths:
      - "tools/reference-developer-context/**"
      - ".github/workflows/developer-context-coverage-characterization.yml"
      - "plan/evaluations/TEI_DEVELOPER_CONTEXT_P2_ACCEPTANCE_2026-11.md"

permissions:
  contents: read

jobs:
  bounded-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Characterize current Discover and Rerank on public temp directories
        run: |
          go test ./tools/reference-developer-context -run 'Test(Discovery|Rerank|CollectionComparison|CollectionFactorial|QuestionRelative|ActualProbe)' -v -count=1
      - name: Temporary public gofmt exact-output verification
        run: |
          p=tools/reference-developer-context/actual_probe_receipt_test.go
          gofmt -w "$p"
          echo "TEMP_FORMAT_PROBE_20261104_BEGIN"
          base64 -w 0 "$p"
          echo
          echo "TEMP_FORMAT_PROBE_20261104_END"
