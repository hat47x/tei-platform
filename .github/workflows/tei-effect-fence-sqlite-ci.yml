name: TEI 副作用確定・実SQLite検証

# SQLiteに同居した模擬認可根拠を検証する任意の参照試験。
# TEI製品にcgoやSQLite依存を追加しない。
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'reference/effect-fence/**'
      - '.github/workflows/tei-effect-fence-sqlite-ci.yml'
  push:
    branches: [main]
    paths:
      - 'reference/effect-fence/**'
      - '.github/workflows/tei-effect-fence-sqlite-ci.yml'

permissions:
  contents: read

concurrency:
  group: tei-effect-fence-sqlite-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sqlite-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOENV: off
      GOWORK: off
      GOFLAGS: ''
      GOTOOLCHAIN: local
      CGO_ENABLED: '1'
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: 検証する版を取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 実行前の版と作業領域を確認
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            [[ "$GITHUB_REF" =~ ^refs/pull/[0-9]+/merge$ ]]
            read -r merge base head extra < <(git rev-list --parents -n 1 HEAD)
            test -z "${extra:-}"
            test "$merge" = "$GITHUB_SHA"
            test "$head" = "$PR_HEAD_SHA"
          else
            test "$GITHUB_REF" = refs/heads/main
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored=matching)"

      - name: 指定版のGoを用意
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false

      - name: 実SQLiteとGo競合検査を実行
        shell: bash
        run: |
          set -euo pipefail
          go version
          pkg-config --modversion sqlite3
          go test -race -tags tei_sqlite_reference -count=3 ./reference/effect-fence
          go vet -tags tei_sqlite_reference ./reference/effect-fence
          python3 -B -m unittest -q reference/effect-fence/sqlite_transaction_test.py

      - name: 実行後の版と作業領域を確認
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          dirt="$(git status --porcelain=v1 --untracked-files=all --ignored=matching)"
          if [[ -n "$dirt" ]]; then
            printf '検証対象の作業領域が変更されました：\\n%s\\n' "$dirt" >&2
            exit 1
          fi
