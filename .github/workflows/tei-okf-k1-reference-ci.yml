name: TEI OKF K1 upstream-reference witness (test only)

on:
  pull_request:
    branches: [main]
    paths:
      - 'testdata/okf-k1-v02/**'
      - 'testdata/okf-k1-v02.expected.json'
      - 'tools/reference-okf-k1/**'
      - '.github/workflows/tei-okf-k1-reference-ci.yml'
  push:
    branches: [main]
    paths:
      - 'testdata/okf-k1-v02/**'
      - 'testdata/okf-k1-v02.expected.json'
      - 'tools/reference-okf-k1/**'
      - '.github/workflows/tei-okf-k1-reference-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: okf-k1-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  k1-upstream-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: TEI test fixture and script at checked-out commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: tei
          persist-credentials: false
      - name: Pinned upstream OKF Python reference document reader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: GoogleCloudPlatform/open-knowledge-format
          ref: ad30107c31c06aec8a7d5636e0d1058118604e6f
          path: upstream-okf
          persist-credentials: false
      - name: Create isolated test-only Python environment
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -m venv "$RUNNER_TEMP/okf-k1-venv"
          "$RUNNER_TEMP/okf-k1-venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir 'PyYAML==6.0.3'
      - name: Confirm exact upstream revision and run reference probe
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          test "$(git -C upstream-okf rev-parse HEAD)" = 'ad30107c31c06aec8a7d5636e0d1058118604e6f'
          "$RUNNER_TEMP/okf-k1-venv/bin/python" -B \
            tei/tools/reference-okf-k1/official_reference_probe.py \
            --bundle tei/testdata/okf-k1-v02 \
            --expected tei/testdata/okf-k1-v02.expected.json \
            --upstream upstream-okf
          test -z "$(git -C tei status --porcelain=v1 --untracked-files=all)"
          test -z "$(git -C upstream-okf status --porcelain=v1 --untracked-files=all)"


  k1-sho-main-raw-reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: TEI fixed K1 Markdown fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: tei
          persist-credentials: false
      - name: Pinned actual SHO main G1b product Reader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: hat47x/sho-composer
          ref: fc0127400733bac161b3fc0d556f451991d0a510
          path: sho
          persist-credentials: false
      - name: Node 22 runtime for existing SHO CLI
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install only existing SHO Reader dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix sho --ignore-scripts --no-audit --no-fund
      - name: Read the very same physical TEI K1 files with the real SHO CLI
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          node --version
          python3 -B tei/tools/reference-okf-k1/sho_g1b_receipt_probe.py \
            --bundle tei/testdata/okf-k1-v02 \
            --expected tei/testdata/okf-k1-v02.expected.json \
            --sho sho
          test -z "$(git -C tei status --porcelain=v1 --untracked-files=all)"
          test -z "$(git -C sho status --porcelain=v1 --untracked-files=all)"
