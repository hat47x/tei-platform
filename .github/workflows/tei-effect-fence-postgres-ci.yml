name: TEI 認可副作用・実PostgreSQL検証

# 製品向けeffectcommit契約のDB実装を実サーバーで検証する。
# 本CIの試験スキーマは運用Providerの適合性証明にはならない。
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'internal/security/effectcommit/**'
      - 'internal/security/legacyauthorization/**'
      - 'internal/execution/**'
      - '.github/workflows/tei-effect-fence-postgres-ci.yml'
      - 'go.mod'
      - 'go.sum'
  push:
    branches: [main]
    paths:
      - 'internal/security/effectcommit/**'
      - 'internal/security/legacyauthorization/**'
      - 'internal/execution/**'
      - '.github/workflows/tei-effect-fence-postgres-ci.yml'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

concurrency:
  group: tei-effect-fence-postgres-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tei
          POSTGRES_PASSWORD: tei_integration_only
          POSTGRES_DB: tei_effect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tei -d tei_effect"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GOENV: off
      GOWORK: off
      GOFLAGS: ''
      GOTOOLCHAIN: local
      TEI_EFFECT_POSTGRES_DSN: postgres://tei:tei_integration_only@localhost:5432/tei_effect?sslmode=disable
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: 検証対象を取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Gitの版と作業領域を検査
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            [[ "$GITHUB_REF" =~ ^refs/pull/[0-9]+/merge$ ]]
            read -r merge base head extra < <(git rev-list --parents -n 1 HEAD)
            test -z "${extra:-}"
            test "$merge" = "$GITHUB_SHA"
            test "$head" = "$PR_HEAD_SHA"
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored=matching)"

      - name: Go実行環境を準備
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false

      - name: PostgreSQLの実依存試験とSKIP・欠落の検査
        shell: bash
        run: |
          set -euo pipefail
          go vet ./internal/security/effectcommit/... ./internal/security/legacyauthorization ./internal/execution
          test -z "$(gofmt -l internal/security/effectcommit/postgres internal/execution)"
          # DSNが空だと実DBの試験はSKIPして緑に見える。ここで空を拒否する。
          test -n "${TEI_EFFECT_POSTGRES_DSN:-}"
          log="$RUNNER_TEMP/go-test.log"
          go test -race -count=3 -v ./internal/security/effectcommit/... ./internal/security/legacyauthorization ./internal/execution | tee "$log"
          # 保証水準の宣言（D10）を支える試験は、名前ごとにPASS行が在ることを要求する。
          # 件数だけでは、既存の試験が新規・改名後の試験の欠落を覆い隠す。
          # -count=3 のためPASS行は複数回出るが、1回以上在れば足りる。
          required=(
            'TestDeclaredProviderRequiredRunnerAckLossThenReplay'
            'TestDeclaredProviderRequiredRunnerConcurrentSameOperationCommitsOnce'
            'TestDeclaredProviderRequiredRunnerConcurrentRevokeIsAllOrNothing'
            'TestDeclaredProviderRequiredRunnerBlocksOnUncommittedRevocation'
            'TestDeclaredProviderRequiredRunnerPreCommitFailureLeavesNoReceiptNorOwnerEffect'
            'TestTrustedOwnerProviderDeclaresProvisionalAtomicWithCommit'
            'TestOtherPostgresProvidersDeclareNothingAndAreRefused'
            'TestWrapperDeclarationDoesNotLeakThroughNamedField'
            'TestEmbeddingWrapperInheritsDeclarationKnownLimitation'
            'TestPostgresWriterCannotMutateAuthority'
            'TestPostgresAuthorityLockFunctionMissingFailsClosed'
            'TestPostgresCommitReplayAndRestartLookup'
            'TestPostgresRoleRevocationPreventsCommitAndReceipt'
            'TestPostgresRevocationAfterCommitHidesReceipt'
            'TestPostgresResourceCASAndReceiptRollback'
            'TestPostgresSameOperationDifferentRequestIsConflict'
            'TestPostgresConcurrentRevokeAndCommitLinearize'
            'TestPostgresSchemaConfigurationRejectsUnsafeNames'
            'TestPostgresCommitErrorRemainsUncertain'
            'TestTrustedOwnerRoutineConcurrentSharedInventory'
            'TestTrustedOwnerRoutineReceiptFailureRollsBackAndMissingRoutineFailsClosed'
            'TestTrustedOwnerRoutineDistinguishesVersionConflictOwnerDenialAndInvalidInput'
            'TestTrustedOwnerRoutineDistinguishesVersionConflictOwnerDenialAndInvalidInput/matching-version-stock-shortage'
            'TestTrustedOwnerRoutineDistinguishesVersionConflictOwnerDenialAndInvalidInput/stale-version-stock-available'
            'TestTrustedOwnerRoutineDistinguishesVersionConflictOwnerDenialAndInvalidInput/matching-version-invalid-units'
            'TestTrustedOwnerRoutineDistinguishesVersionConflictOwnerDenialAndInvalidInput/matching-version-stock-available'
            'TestTrustedOwnerRoutineAckLossReconnectedReplay'
            # internal/execution: RunEffect・Compensate・RunPlanを実PostgreSQLのCommandへ接続する試験。
            'TestRealPGEffectSucceededAndIndependentObservedAreRecordedSeparately'
            'TestRealPGLaterStepFailureCompensatesInDeclaredOrderAndRecordsCompensationFailure'
            'TestRealPGUnattendedRunIsBlockedNotFailedWithoutObserverOrChecks'
            'TestRealPGUnattendedRunIsBlockedNotFailedWithoutObserverOrChecks/no_observer'
            'TestRealPGUnattendedRunIsBlockedNotFailedWithoutObserverOrChecks/observer_lacks_a_required_check'
            'TestRealPGUnattendedRunIsBlockedNotFailedWithoutObserverOrChecks/covered_run_completes'
          )
          for name in "${required[@]}"; do
            grep -Eq -- "^[[:space:]]*--- PASS: ${name} \(" "$log" || { echo "required test did not PASS: ${name}" >&2; exit 1; }
          done
          # このpackage群にはSKIPが正当な試験が無い（DSN以外のSkip条件は無い）。
          # SKIPとFAILは、サブ試験（行頭が空白）も含めて一致させる。
          # 否定した grep（! grep）は set -e では失敗扱いにならず、検査が働かない。
          # 明示的に if で判定して終了する。
          if grep -Eq -- '^[[:space:]]*--- SKIP:' "$log"; then
            echo "unexpected SKIP in the real-PG run:" >&2
            grep -E -- '^[[:space:]]*--- SKIP:' "$log" >&2
            exit 1
          fi
          if grep -Eq -- '^[[:space:]]*--- FAIL:' "$log"; then
            echo "unexpected FAIL in the real-PG run:" >&2
            grep -E -- '^[[:space:]]*--- FAIL:' "$log" >&2
            exit 1
          fi

      - name: 検証後の変更を拒否
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored=matching)"
