name: TEI quote Component experimental host parity (Native included)

on:
  pull_request:
    paths:
      - 'reference/quote-component-candidate/e2e/**'
      - 'reference/quote-component-candidate/quote.wit'
      - '.github/workflows/tei-quote-component-hosts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  component-node-chromium-wasmtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup pinned independent Native Component Host
        uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3
        with:
          version: '49.0.3'
      - name: Identify real Chrome executable
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [[ -z "$browser" ]]; then
            echo 'ERROR: real Chrome is not installed; no mock browser result accepted' >&2
            exit 1
          fi
          echo "TEI_BROWSER_EXECUTABLE=$browser" >> "$GITHUB_ENV"
          "$browser" --version
      - name: Build exact Component and test three actual Hosts
        shell: bash
        run: bash reference/quote-component-candidate/e2e/run.sh
