name: TEI AI tuning observation reference

on:
  pull_request:
    paths:
      - 'tools/reference-ai-tuning-observation/**'
      - '.github/workflows/tei-ai-tuning-reference-ci.yml'
  push:
    branches: [main]
    paths:
      - 'tools/reference-ai-tuning-observation/**'
      - '.github/workflows/tei-ai-tuning-reference-ci.yml'

permissions:
  contents: read

# 同じPRの古い実行だけを取り消し、mainへのpushは取り消さない（#3682）。
concurrency:
  group: tei-tei-ai-tuning-reference-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  synthetic-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Independent synthetic negative controls
        run: |
          python3 --version
          python3 -m unittest discover -s tools/reference-ai-tuning-observation -p 'test_*.py' -v
          python3 -m compileall -q tools/reference-ai-tuning-observation
