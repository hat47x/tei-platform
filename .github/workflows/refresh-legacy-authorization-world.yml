name: Legacy Authorization Reference World 再生成

on:
  push:
    branches:
      - work/legacy-authorization-reference

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Repositoryを取得
        uses: actions/checkout@v7

      - name: Goを準備
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Reference WorldをRepository自身から再生成
        run: go run ./cmd/tei world -workspace reference/workspace > reference/world.json

      - name: 再生成結果をbranchへ反映
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- reference/world.json; then
            echo "reference/world.json に差分はありません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/world.json
          git commit -m "legacy認可ReferenceをWorldへ反映する"
          git push
