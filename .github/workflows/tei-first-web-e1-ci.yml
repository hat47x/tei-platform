name: TEI 第一Web配備入口の実バイナリ検証

# 通常の全体健全性確認ではスキップされる、Application別の実行ファイルと
# 合成業務シナリオのHTTP応答比較を、実際のGitHub-hosted runnerで検査する。
# #1167の局所資格確認用であり、Browser/API二単位配備や本番認可の証拠ではない。
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tools/reference-first-web-target/**'
      - 'tools/reference-target-package-evidence/**'
      - 'tools/reference-first-web-target-manifest-capture/**'
      - 'tools/reference-runtime-snapshot/**'
      - 'reference/workspace/**'
      - 'reference/legacy-auth/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/tei-first-web-e1-ci.yml'
  push:
    branches: [main]
    paths:
      - 'tools/reference-first-web-target/**'
      - 'tools/reference-target-package-evidence/**'
      - 'tools/reference-first-web-target-manifest-capture/**'
      - 'tools/reference-runtime-snapshot/**'
      - 'reference/workspace/**'
      - 'reference/legacy-auth/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/tei-first-web-e1-ci.yml'

permissions:
  contents: read

concurrency:
  group: tei-first-web-e1-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tagged-target-binaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOENV: off
      GOWORK: off
      GOFLAGS: ''
      GOTOOLCHAIN: local
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: 全履歴付きの対象コミットを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 実行前の対象版と作業領域を照合
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            [[ "$GITHUB_REF" =~ ^refs/pull/[0-9]+/merge$ ]]
            read -r merge base head extra < <(git rev-list --parents -n 1 HEAD)
            test -z "${extra:-}"
            test "$merge" = "$GITHUB_SHA"
            test "$head" = "$PR_HEAD_SHA"
          elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
            test "$GITHUB_REF" = refs/heads/main
          elif [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            echo "unsupported trigger $GITHUB_EVENT_NAME" >&2
            exit 1
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored=matching)"
          hidden="$(git ls-files -v | awk '/^[a-zS]/ {print}')"
          test -z "$hidden"
          printf 'candidate=%s\nevent=%s\n' "$GITHUB_SHA" "$GITHUB_EVENT_NAME"

      - name: Goを対象のgo.modに合わせて設定
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false

      - name: Application別のGo単体テストと静的解析
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -tags=tei_order_only ./tools/reference-first-web-target
          go test -count=1 -tags=tei_repair_only ./tools/reference-first-web-target
          go vet -tags=tei_order_only ./tools/reference-first-web-target
          go vet -tags=tei_repair_only ./tools/reference-first-web-target

      - name: 3種の実バイナリ・依存閉包・HTTP業務応答を照合
        shell: bash
        env:
          TEI_E1_RUN_HTTP_PARITY: '1'
        run: |
          set -euo pipefail
          # All generated files remain outside the tracked checkout. The
          # script records exact source SHA, linked symbols, sizes, hashes and
          # synthetic HTTP parity, but never claims production equivalence.
          evidence_dir="$RUNNER_TEMP/tei-first-web-e1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          bash tools/reference-first-web-target/measure_tagged_targets.sh "$evidence_dir"
          # A successful command is not sufficient if its output went to an
          # unintended directory. Pin both the destination and the receipt.
          test -f "$evidence_dir/measurement.json"
          grep -Fq '"syntheticFixtureHttpParityVerified": true' "$evidence_dir/measurement.json"

      - name: 実第一Webの2 Application manifestを取得し固定Runtimeで再生
        shell: bash
        env:
          TEI_E1_LIVE_MANIFEST_CAPTURE: '1'
        run: |
          set -euo pipefail
          # Actual combined + tagged First Web executables, not an HTTP
          # fixture. B/R/T are diagnostic, so this is not Acceptance evidence.
          go test -count=1 \
            -run '^TestActualFirstWebTargetCaptureAcrossApplications$' \
            ./tools/reference-first-web-target-manifest-capture

      - name: 実行後の対象版と作業領域を照合
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored=matching)"
          hidden="$(git ls-files -v | awk '/^[a-zS]/ {print}')"
          test -z "$hidden"
