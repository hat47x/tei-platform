name: 一時的にQuery result mappingのGolden Worldを再生成

on:
  push:
    branches:
      - work/query-result-mapping-authoring
    paths:
      - .github/workflows/tmp-regenerate-query-result-world.yml
      - internal/query/**
      - internal/syntax/**
      - reference/workspace/**

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - name: Repositoryを取得
        uses: actions/checkout@v7
        with:
          ref: work/query-result-mapping-authoring
      - name: Goを準備
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Reference WorldをRepository自身から再生成
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/tei world -workspace reference/workspace > reference/world.json
      - name: 生成差分だけをbranchへ反映
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- reference/world.json; then
            echo "Reference Worldに差分はありません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/world.json
          git commit -m "Query result mappingをReference Worldへ反映する"
          git push origin HEAD:work/query-result-mapping-authoring
