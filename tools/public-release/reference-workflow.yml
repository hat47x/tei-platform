# INACTIVE TEMPLATE. This file is intentionally NOT under .github/workflows.
# Install only in an approved PUBLIC repository, after source/content review.
name: Public repository health (exact source)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-health-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-health:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout PR head or selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.number) || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source and pre-run clean state
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          printf 'expected_head=%s\nactual_head=%s\n' "$EXPECTED_HEAD" "$actual"
          test "$actual" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --ignored --untracked-files=all)"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Full repository health
        shell: bash
        run: |
          set -euo pipefail
          bash tools/repository-health-check.sh

      - name: Verify exact source and post-run clean state
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --ignored --untracked-files=all)"
