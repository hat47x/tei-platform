<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TEI Studio — read-only PoC A</title>
  <style>
    :root{font-family:system-ui,sans-serif;color-scheme:light dark}
    body{max-width:1000px;margin:2rem auto;padding:0 1rem}
    .controls{display:flex;gap:.65rem;align-items:center;flex-wrap:wrap;margin:1rem 0}
    select,input,button{font:inherit;padding:.45rem}
    button{cursor:pointer}
    pre{padding:1.1rem;border:1px solid #8886;border-radius:.5rem;white-space:pre-wrap;overflow-wrap:anywhere;max-height:60vh;overflow:auto}
    #state{min-height:1.5rem}
    .preview{margin-top:2rem;padding:1rem;border:1px solid #8886;border-radius:.5rem}
    .preview table{border-collapse:collapse;width:100%;margin:1rem 0}
    .preview th,.preview td{text-align:left;border:1px solid #8886;padding:.4rem}
    .view h3{margin:1rem 0 .35rem}
    .view table{border-collapse:collapse;width:100%;margin:.4rem 0}
    .view th,.view td{text-align:left;border:1px solid #8886;padding:.35rem}
  </style>
</head>
<body>
  <h1>TEI Studio — PoC A</h1>
  <p>読取り専用の検証画面です。Sourceの編集・保存・受理・任意コマンド実行はありません。</p>
  <div class="controls">
    <label for="workspace">Workspace</label>
    <select id="workspace" aria-label="Workspace"></select>
    <button id="catalog" disabled>一覧</button>
    <button id="validate" disabled>検証</button>
  </div>
  <div class="controls">
    <label for="kind">Subject kind</label><input id="kind" placeholder="semantic" autocomplete="off">
    <label for="subject-id">Subject ID</label><input id="subject-id" placeholder="exact canonical ID" autocomplete="off">
    <button id="inspect" disabled>参照</button>
  </div>
  <div class="controls">
    <label for="application-id">Application</label><input id="application-id" placeholder="order_entry" autocomplete="off">
    <label for="pattern-id">Pattern</label><input id="pattern-id" placeholder="order_entry.order_record" autocomplete="off">
    <label for="package-id">Package</label><input id="package-id" placeholder="order_entry.list_to_record" autocomplete="off">
    <button id="view-application" disabled>Applicationビュー</button>
    <button id="view-pattern" disabled>Patternビュー</button>
    <button id="view-package" disabled>Packageビュー</button>
  </div>
  <div id="view-state" role="status" aria-live="polite"></div>
  <div id="view-output" class="view" aria-label="View result"></div>
  <div class="controls">
    <label for="command-capability">Capability</label><input id="command-capability" placeholder="sales.order.submit" autocomplete="off">
    <label for="command-inputs">Inputs</label><input id="command-inputs" placeholder="order=ORD-1" autocomplete="off">
    <label for="command-periods">Periods</label><input id="command-periods" placeholder="sales.period=closed" autocomplete="off">
    <label for="command-allowed">Allowed capabilities</label><input id="command-allowed" placeholder="sales.submit_order" autocomplete="off">
    <button id="plan-command" disabled>計画</button>
    <label for="command-reference-store">変更後のフックまで実行（メモリ上の参照Storeへ適用。永続しない）</label><input id="command-reference-store" type="checkbox">
    <button id="execute-command" disabled>参照実行</button>
  </div>
  <div id="command-state" role="status" aria-live="polite"></div>
  <pre id="command-output" aria-label="Command result"></pre>
  <div id="state" role="status" aria-live="polite"></div>
  <pre id="output" aria-label="Operation result"></pre>
  <section class="preview" aria-labelledby="preview-title">
    <h2 id="preview-title">XEAD限定観察</h2>
    <p>限定観察 / 読取専用 / 非Canonical / 未対応構造あり得る</p>
    <div class="controls">
      <label for="xead-path">Workspace相対パス</label>
      <input id="xead-path" autocomplete="off" placeholder="model.xead">
      <button id="observe" disabled>読取</button>
    </div>
    <div id="preview-state" role="status" aria-live="polite"></div>
    <div id="preview-result"></div>
  </section>
  <script type="module" src="./main.js"></script>
</body>
</html>
